    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBsZHawi8LZnUeAtXuwB-O38h8-zznokqo",
            authDomain: "amiwei-trainer.firebaseapp.com",
            projectId: "amiwei-trainer",

        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        console.log('✅ Firebase initialized!');

        // Storage functions
        const storage = {
            TRAINER_PASSWORD: '1234',
            
            getTrainees: async () => {
                try {
                    const snapshot = await db.collection('trainees').orderBy('createdAt', 'desc').get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error getting trainees:', error);
                    return [];
                }
            },
            
            saveTrainee: async (trainee) => {
                try {
                    const traineeData = {
                        ...trainee,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('trainees').doc(trainee.id).set(traineeData);
                    console.log('✅ Trainee saved:', trainee.id);
                    return trainee;
                } catch (error) {
                    console.error('Error saving trainee:', error);
                    alert('שגיאה בשמירת מתאמן. אנא נסה שוב.');
                    throw error;
                }
            },
            
            updateTrainee: async (traineeId, updates) => {
                try {
                    const updateData = {
                        ...updates,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('trainees').doc(traineeId).update(updateData);
                    const doc = await db.collection('trainees').doc(traineeId).get();
                    if (doc.exists) {
                        console.log('✅ Trainee updated:', traineeId);
                        return { id: doc.id, ...doc.data() };
                    }
                    return null;
                } catch (error) {
                    console.error('Error updating trainee:', error);
                    return null;
                }
            },
            
            getTrainee: async (traineeId) => {
                try {
                    const doc = await db.collection('trainees').doc(traineeId).get();
                    if (doc.exists) {
                        console.log('✅ Trainee loaded:', traineeId);
                        return { id: doc.id, ...doc.data() };
                    }
                    console.log('❌ Trainee not found:', traineeId);
                    return null;
                } catch (error) {
                    console.error('Error getting trainee:', error);
                    return null;
                }
            },
            
            deleteTrainee: async (traineeId) => {
                try {
                    await db.collection('trainees').doc(traineeId).delete();
                    console.log('✅ Trainee deleted:', traineeId);
                } catch (error) {
                    console.error('Error deleting trainee:', error);
                    throw error;
                }
            }
        };

        // 1RM Percentage Table based on Repetitions
        const rm1PercentageTable = {
            1: 100, 2: 97, 3: 94, 4: 92, 5: 89, 6: 86, 7: 83, 8: 81, 9: 78, 10: 75,
            11: 73, 12: 71, 13: 70, 14: 68, 15: 67, 16: 65, 17: 64, 18: 63, 19: 61, 20: 60,
            21: 59, 22: 58, 23: 57, 24: 56, 25: 55, 26: 54, 27: 53, 28: 52, 29: 51, 30: 50
        };

        // Calculate recommended weight based on 1RM and target reps
        const calculateRecommendedWeight = (oneRM, targetReps) => {
            if (!oneRM || targetReps > 30) return null;
            const percentage = rm1PercentageTable[targetReps] || 50;
            return Math.round(oneRM * (percentage / 100));
        };

        // Get 1RM for exercise type
        const get1RMForExercise = (exerciseName, userData) => {
            if (!userData.knows1RM) return null;
            
            const name = exerciseName.toLowerCase();
            if (name.includes('סקוואט') || name.includes('squat')) {
                return userData.squat1RM;
            }
            if (name.includes('שכיבה') && (name.includes('לחיצת') || name.includes('חזה')) || name.includes('bench')) {
                return userData.bench1RM;
            }
            if (name.includes('דד-ליפט') || name.includes('deadlift')) {
                return userData.deadlift1RM;
            }
            if (name.includes('כתף') && name.includes('לחיצ') || name.includes('overhead') || name.includes('press')) {
                return userData.overheadPress1RM;
            }
            return null;
        };

        // Add weight recommendations to exercises
        const addWeightRecommendations = (exercises, userData, week) => {
            return exercises.map(exercise => {
                const oneRM = get1RMForExercise(exercise.name, userData);
                
                if (oneRM && exercise.reps && typeof exercise.reps === 'number') {
                    // Progressive overload: increase intensity every 2 weeks
                    const weekMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.025); // 2.5% every 2 weeks
                    const adjustedReps = Math.max(1, Math.round(exercise.reps / weekMultiplier));
                    const recommendedWeight = calculateRecommendedWeight(oneRM, adjustedReps);
                    
                    if (recommendedWeight) {
                        return {
                            ...exercise,
                            recommendedWeight: `${recommendedWeight} ק"ג`,
                            weightNote: `מבוסס על ${rm1PercentageTable[adjustedReps]}% מ-1RM (${oneRM} ק"ג). שבוע ${week}: ${adjustedReps} חזרות בעומס זה.`
                        };
                    }
                }
                
                // For exercises with rep ranges (like "8-10")
                if (oneRM && exercise.reps && typeof exercise.reps === 'string') {
                    const match = exercise.reps.match(/(\d+)-(\d+)/);
                    if (match) {
                        const maxReps = parseInt(match[2]);
                        const weekMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.025);
                        const adjustedReps = Math.max(1, Math.round(maxReps / weekMultiplier));
                        const recommendedWeight = calculateRecommendedWeight(oneRM, adjustedReps);
                        
                        if (recommendedWeight) {
                            return {
                                ...exercise,
                                recommendedWeight: `${recommendedWeight} ק"ג`,
                                weightNote: `מבוסס על ${rm1PercentageTable[adjustedReps]}% מ-1RM. התחל עם משקל זה ונסה להגיע ל-${exercise.reps} חזרות.`
                            };
                        }
                    }
                }
                
                return exercise;
            });
        };

        // Workout generation algorithm
        const generateWorkoutPlan = (userData) => {
            const { weight, height, age, gender, activityLevel, workoutDuration, goals, muscleGroups, cardioTarget, weeklyWorkouts } = userData;

            // DEBUG - remove after diagnosis
            console.log('🏋️ generateWorkoutPlan | goals:', JSON.stringify(goals), '| activityLevel:', activityLevel, '| runningLevel:', userData.runningLevel, '| raceGoal:', userData.raceGoal);

            // --- Fix: merge top-level running fields into cardioTarget ---
            // (runningLevel, raceGoal etc. are stored as top-level formData fields, not inside cardioTarget)
            const enrichedCardioTarget = {
                ...cardioTarget,
                runningLevel: userData.runningLevel || cardioTarget.runningLevel || 'beginner',
                raceGoal:     userData.raceGoal     || cardioTarget.raceGoal     || 'general',
                weeklyMileage:userData.weeklyMileage || cardioTarget.weeklyMileage || '',
                current5kTime:    userData.current5kTime     || cardioTarget.current5kTime     || '',
                current10kTime:   userData.current10kTime    || cardioTarget.current10kTime    || '',
                currentHalfTime:  userData.currentHalfTime   || cardioTarget.currentHalfTime   || '',
                currentMarathonTime: userData.currentMarathonTime || cardioTarget.currentMarathonTime || '',
                injuryHistory: userData.injuryHistory || ''
            };

            const isMuscleBuilding = goals.includes('עלייה במסת שריר');
            const hasAerobicGoal   = goals.includes('שיפור יכולת אירובית');

            let duration, workoutsPerWeek;

            if (isMuscleBuilding) {
                duration = 4;
                workoutsPerWeek = parseInt(weeklyWorkouts) || 4;
            } else if (hasAerobicGoal) {
                // Plan length based on race goal (BC Running: gradual preparation)
                const rg = enrichedCardioTarget.raceGoal;
                if      (rg === 'marathon')      duration = 18;
                else if (rg === 'half-marathon') duration = 14;
                else if (rg === '10k')           duration = 10;
                else if (rg === '5k')            duration = 12;
                else                             duration = 12; // general fitness

                if      (activityLevel === 'מתחיל') workoutsPerWeek = 3;
                else if (activityLevel === 'בינוני') workoutsPerWeek = 4;
                else                                 workoutsPerWeek = 5;
            } else {
                duration = goals.includes('ירידה במשקל') ? 6 : 4;
                if      (activityLevel === 'מתחיל') workoutsPerWeek = 3;
                else if (activityLevel === 'בינוני') workoutsPerWeek = 4;
                else                                 workoutsPerWeek = 5;
            }

            // Running workout duration (by level — not the form's 60-min default)
            const getRunningDuration = (level, week, totalWeeks) => {
                const base = level === 'advanced' ? 50 : level === 'intermediate' ? 40 : 28;
                const phase = week / totalWeeks;
                if (phase >= 0.85) return Math.round(base * 0.85); // taper
                return Math.round(base * (1 + 0.22 * Math.min(phase / 0.75, 1))); // gradual build
            };

            // Training phase label (for periodization)
            const getPhase = (week, total) => {
                const p = week / total;
                if (p <= 0.30) return { name: 'בסיס', key: 'base' };
                if (p <= 0.65) return { name: 'בנייה', key: 'build' };
                if (p <= 0.85) return { name: 'שיא', key: 'peak' };
                return { name: 'טייפר', key: 'taper' };
            };

            const weeks = [];

            for (let week = 1; week <= duration; week++) {
                const phase = getPhase(week, duration);
                const weekPlan = { weekNumber: week, workouts: [], phase: phase.name };
                const intensityMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.1);
                const runningDuration = getRunningDuration(enrichedCardioTarget.runningLevel, week, duration);

                for (let day = 1; day <= workoutsPerWeek; day++) {
                    let workout;

                    if (isMuscleBuilding) {
                        const sessionNum = (week - 1) * workoutsPerWeek + day;
                        const exercises = generateStrengthWorkout(goals, activityLevel, intensityMultiplier, muscleGroups, workoutDuration, userData.availableEquipment || [], week, sessionNum, userData.strengthExperience || '');
                        const exercisesWithWeights = addWeightRecommendations(exercises, userData, week);
                        workout = { day, type: 'כוח', exercises: exercisesWithWeights, completed: false, feedback: null, difficulty: null, phase: phase.name };

                    } else if (hasAerobicGoal) {
                        // Determine if this day is a strength day
                        let isStrengthDay = false;
                        let isShortStrength = false; // 15-min appended, vs full session
                        if      (workoutsPerWeek <= 3) { isStrengthDay = (day === 1); isShortStrength = true; }
                        else if (workoutsPerWeek === 4) { isStrengthDay = (day === 2); }
                        else                            { isStrengthDay = (day === 2 || day === 5); }

                        // Taper: no separate strength days in last 15% of plan
                        if (phase.key === 'taper') { isStrengthDay = false; isShortStrength = false; }

                        if (isStrengthDay && isShortStrength) {
                            // Running + short runner strength appended
                            const runningExercises = generateCardioWorkout(goals, activityLevel, intensityMultiplier, enrichedCardioTarget, week, runningDuration, duration, phase);
                            const strengthExercises = generateRunnerStrengthWorkout(activityLevel, userData.availableEquipment || [], '15');
                            workout = {
                                day, type: 'ריצה + חיזוק',
                                exercises: [
                                    ...runningExercises,
                                    { name: '━━━ חיזוק לרצים (10-15 דקות) ━━━', sets: 0, reps: '', rest: 0, notes: 'מעבר לתרגילי חיזוק' },
                                    ...strengthExercises
                                ],
                                completed: false, feedback: null, difficulty: null, phase: phase.name
                            };
                        } else if (isStrengthDay) {
                            const exercises = generateRunnerStrengthWorkout(activityLevel, userData.availableEquipment || [], '40');
                            workout = { day, type: 'כוח לרצים', exercises, completed: false, feedback: null, difficulty: null, phase: phase.name };
                        } else {
                            const exercises = generateCardioWorkout(goals, activityLevel, intensityMultiplier, enrichedCardioTarget, week, runningDuration, duration, phase);
                            workout = { day, type: 'ריצה', exercises, completed: false, feedback: null, difficulty: null, phase: phase.name };
                        }

                    } else {
                        if (day % 2 === 1) {
                            const exercises = generateStrengthWorkout(goals, activityLevel, intensityMultiplier, muscleGroups, workoutDuration, userData.availableEquipment || []);
                            const exercisesWithWeights = addWeightRecommendations(exercises, userData, week);
                            workout = { day, type: 'כוח', exercises: exercisesWithWeights, completed: false, feedback: null, difficulty: null };
                        } else {
                            workout = { day, type: 'אירובי', exercises: generateCardioWorkout(goals, activityLevel, intensityMultiplier, cardioTarget, week, workoutDuration), completed: false, feedback: null, difficulty: null };
                        }
                    }

                    weekPlan.workouts.push(workout);
                }

                weeks.push(weekPlan);
            }

            return {
                duration,
                workoutsPerWeek,
                workoutDuration,
                weeks,
                createdAt: new Date().toISOString(),
                muscleGroups: muscleGroups || [],
                cardioTarget: enrichedCardioTarget,
                _debug: { goals, isMuscleBuilding, hasAerobicGoal, raceGoal: enrichedCardioTarget.raceGoal, runningLevel: enrichedCardioTarget.runningLevel }
            };
        };

        const generateStrengthWorkout = (goals, level, multiplier, muscleGroups = [], workoutDuration = 60, availableEquipment = [], weekNum = 1, sessionNum = 1, strengthExperience = '') => {
            let exercises = [];

            // Check if this is for a runner (aerobic goal)
            const isRunner = goals.includes('שיפור יכולת אירובית');

            if (isRunner) {
                // Runner-specific strength training - focus on injury prevention and running economy
                exercises = generateRunnerStrengthWorkout(level, availableEquipment, workoutDuration);
                return exercises;
            }

            // Strength training for muscle building
            const isMuscleBuilding = goals.includes('עלייה במסת שריר');

            if (isMuscleBuilding) {
                return generateMuscleBuildingWorkout(muscleGroups, level, workoutDuration, availableEquipment, sessionNum, strengthExperience);
            }

            // Default general fitness workout
            return generateGeneralStrengthWorkout(level, workoutDuration, availableEquipment);
        };

        // Running Pace Table (McMillan-based, from uploaded pace table document)
        // Maps test time (2K/3K/4K) to training zones
        const runningPaceTable = [
            { test2k: '6:00',  test3k: '9:20',  test4k: '12:50', easy: '4:00-4:41', medium: '3:36-3:45', fast: '3:26-3:35', r400: '1:12-1:16' },
            { test2k: '6:30',  test3k: '10:06', test4k: '13:51', easy: '4:15-4:58', medium: '3:49-3:59', fast: '3:38-3:48', r400: '1:17-1:21' },
            { test2k: '7:00',  test3k: '10:53', test4k: '14:55', easy: '4:30-5:14', medium: '4:03-4:13', fast: '3:51-4:02', r400: '1:22-1:26' },
            { test2k: '7:30',  test3k: '11:40', test4k: '15:58', easy: '4:45-5:31', medium: '4:16-4:27', fast: '4:04-4:15', r400: '1:27-1:31' },
            { test2k: '8:00',  test3k: '12:26', test4k: '17:02', easy: '5:00-5:48', medium: '4:30-4:42', fast: '4:18-4:30', r400: '1:32-1:37' },
            { test2k: '8:30',  test3k: '13:12', test4k: '18:05', easy: '5:15-6:06', medium: '4:44-4:56', fast: '4:31-4:43', r400: '1:38-1:43' },
            { test2k: '9:00',  test3k: '13:59', test4k: '19:09', easy: '5:30-6:23', medium: '4:57-5:10', fast: '4:44-4:57', r400: '1:44-1:50' },
            { test2k: '9:30',  test3k: '14:45', test4k: '20:12', easy: '5:44-6:40', medium: '5:11-5:25', fast: '4:58-5:12', r400: '1:51-1:56' },
            { test2k: '10:00', test3k: '15:32', test4k: '21:16', easy: '5:59-6:57', medium: '5:25-5:40', fast: '5:12-5:27', r400: '1:57-2:03' },
            { test2k: '10:30', test3k: '16:18', test4k: '22:20', easy: '6:13-7:14', medium: '5:38-5:54', fast: '5:25-5:41', r400: '2:04-2:10' },
            { test2k: '11:00', test3k: '17:05', test4k: '23:23', easy: '6:28-7:31', medium: '5:52-6:08', fast: '5:39-5:56', r400: '2:11-2:17' },
            { test2k: '11:30', test3k: '17:51', test4k: '24:27', easy: '6:43-7:49', medium: '6:06-6:23', fast: '5:53-6:10', r400: '2:18-2:24' },
            { test2k: '12:00', test3k: '18:37', test4k: '25:30', easy: '6:57-8:06', medium: '6:20-6:38', fast: '6:07-6:25', r400: '2:25-2:31' },
            { test2k: '12:30', test3k: '19:24', test4k: '26:34', easy: '7:12-8:23', medium: '6:34-6:52', fast: '6:21-6:40', r400: '2:32-2:38' },
            { test2k: '13:00', test3k: '20:14', test4k: '27:38', easy: '7:26-8:40', medium: '6:48-7:07', fast: '6:35-6:54', r400: '2:39-2:46' }
        ];

        // Get pace zones from 2K test time (McMillan table lookup)
        const getPaceFromTest = (test2kTime) => {
            if (!test2kTime) return null;
            const parts = test2kTime.split(':');
            if (parts.length !== 2) return null;
            const totalMin = parseFloat(parts[0]) + parseFloat(parts[1]) / 60;
            let closest = runningPaceTable[0];
            let minDiff = Infinity;
            runningPaceTable.forEach(entry => {
                const ep = entry.test2k.split(':');
                const em = parseFloat(ep[0]) + parseFloat(ep[1]) / 60;
                const diff = Math.abs(em - totalMin);
                if (diff < minDiff) { minDiff = diff; closest = entry; }
            });
            return closest;
        };

        // Calculate personal pace zones from 5K time (main user input)
        // Zones based on McMillan / Jack Daniels formulas:
        //   Easy:   5K pace + 75-105 sec/km
        //   Tempo:  5K pace + 15-25 sec/km  (~10K race pace, lactate threshold)
        //   Fast:   ~5K race pace (fartlek hard segments)
        //   400m:   5K pace - 8-12 sec/km (VO2max reps)
        const getPaceFrom5K = (time5k) => {
            if (!time5k) return null;
            const clean = time5k.replace(/[^0-9:]/g, '');
            const parts = clean.split(':');
            if (parts.length !== 2) return null;
            const totalMin = parseFloat(parts[0]) + parseFloat(parts[1]) / 60;
            if (isNaN(totalMin) || totalMin <= 0) return null;
            const pacePerKm = totalMin / 5;
            const fmt = (m) => {
                const min = Math.floor(m);
                const sec = Math.round((m - min) * 60);
                return `${min}:${sec.toString().padStart(2, '0')}`;
            };
            return {
                easy:   `${fmt(pacePerKm + 1.25)}-${fmt(pacePerKm + 1.75)}`,
                medium: `${fmt(pacePerKm + 0.25)}-${fmt(pacePerKm + 0.45)}`,
                fast:   `${fmt(pacePerKm - 0.08)}-${fmt(pacePerKm + 0.08)}`,
                r400:   fmt((pacePerKm - 0.15) * 0.4)
            };
        };

        // Runner-specific strength workout (based on כוח לרצים.xlsx + Beit Dror plans)
        // Focuses on: posterior chain, anterior chain, abductors/adductors, core
        const generateRunnerStrengthWorkout = (level, availableEquipment, workoutDuration) => {
            const hasTRX = availableEquipment.includes('TRX / רצועות התנגדות');
            const hasGym = availableEquipment.includes('חדר כושר מלא');
            const hasDumbbells = availableEquipment.includes('משקולות חופשיות (דמבלים/קטלבלים)') || hasGym;

            // Core runner-strength exercises (from כוח לרצים.xlsx)
            const exercises = [
                // Posterior chain - critical for running economy
                { name: 'עליות תאומים (Calf Raises) - ימין ושמאל', sets: 3, reps: '15-20', rest: 45,
                  notes: 'סופר-סט: ימין → שמאל. מבודד לתאומים - מניעת פציעות שוק ואכילס.' },
                { name: 'הרמות אגן (Hip Extension / Glute Bridge)', sets: 3, reps: '15', rest: 60,
                  notes: hasDumbbells ? 'וריאציות: רגליים על הרצפה / כדור פיזיו / Hip Thrust עם משקולת' : 'וריאציות: רגליים על הרצפה / כדור פיזיו.' },
                { name: 'Kick Back עם miniband', sets: 3, reps: '15 לכל רגל', rest: 45,
                  notes: 'שרשרת אחורית - גלוטס מדיוס + המסטרינג. מניעת פציעות ברך.' },
                { name: hasDumbbells ? 'דד-ליפט חד-רגלי עם משקולת (Single Leg Deadlift)' : 'דד-ליפט חד-רגלי (Single Leg Deadlift)',
                  sets: 3, reps: '10 לכל רגל', rest: 90,
                  notes: 'חיזוק שרשרת אחורית + שיווי משקל. קריטי לרצים!' },

                // Anterior chain
                { name: level === 'מתקדם' ? 'Pistol Squat / Single Leg Squat - ימין ושמאל' : 'סקוואט עם מוט / משקולות (Squat)',
                  sets: 3, reps: '12-15', rest: 90,
                  notes: 'שרשרת קדמית. וריאציות: משקל על כתפיים, Side Squat, elevated split squat.' },
                { name: 'לאנג\'ים (Lunges)',
                  sets: 3, reps: '12 לכל רגל', rest: 60,
                  notes: 'וריאציות: עם משקל / Walking Lunge / Jump Lunge. מחקה את תנועת הריצה.' },

                // Abductors/Adductors - crucial for knee stability
                { name: 'Lateral Step עם miniband', sets: 3, reps: '15 לכל צד', rest: 45,

                            { name: 'שכיבות סמיכה יהלום (Diamond Push-ups)', sets: setsSmall, reps: '12-15', rest: 60, notes: 'טריצפס.' },
                            { name: 'פלאנק צידי', sets: 3, duration: '30-45 שניות לכל צד', rest: 45, notes: 'ליבה.' },
                            { name: 'Jump Squats', sets: 3, reps: '12-15', rest: 90, notes: 'כוח נפיץ - רגליים.' }
                        ],
                        // Advanced bodyweight (calisthenics from XLSX)
                        [
                            { name: 'Pistol Squat מלא', sets: setsLarge, reps: '6-8 לכל רגל', rest: 120, notes: 'רגל מתקדם.' },
                            { name: 'עליות מתח משיכה לא שווה', sets: setsLarge, reps: 'מקסימום', rest: 120, notes: 'גב - מתקדם.' },
                            { name: 'שכיבות סמיכה לא שוות (Uneven Push-ups)', sets: setsLarge, reps: '8-10 לכל צד', rest: 90, notes: 'חזה מתקדם.' },
                            { name: 'Dips מקבילים', sets: setsSmall, reps: '10-15', rest: 90, notes: 'חזה תחתון + טריצפס.' },
                            { name: 'L-sit על הרצפה (החזקה)', sets: 3, duration: '20-30 שניות', rest: 60, notes: 'ליבה + טריצפס.' },
                            { name: 'Pike Push-up Elevated', sets: setsSmall, reps: '10-12', rest: 90, notes: 'כתפיים מתקדם.' },
                            { name: 'Sמוק-קום (Burpees)', sets: 3, reps: '10-12', rest: 90, notes: 'כל הגוף, קרדיו.' }
                        ]
                    ];
                    exercises = bwVariations[variationIndex];
                }
            } else {
                // Specific muscle groups
                muscleGroups.forEach(group => {
                    if (group === 'בטן') {
                        if (hasTRX && exerciseLibrary['בטן'].trx) {
                            exercises.push(...exerciseLibrary['בטן'].trx.slice(0, 3));
                        } else {
                            exercises.push(...exerciseLibrary['בטן'].all.slice(0, 3));
                        }
                    } else if (exerciseLibrary[group]) {
                        let groupExercises;
                        
                        // Priority: TRX > Gym > Dumbbells > Bodyweight
                        if (hasTRX && exerciseLibrary[group].trx) {
                            groupExercises = exerciseLibrary[group].trx;
                        } else if (hasGym && exerciseLibrary[group].gym) {
                            groupExercises = exerciseLibrary[group].gym;
                        } else if (hasDumbbells && exerciseLibrary[group].dumbbells) {
                            groupExercises = exerciseLibrary[group].dumbbells;
                        } else {
                            groupExercises = exerciseLibrary[group].bodyweight || exerciseLibrary[group].all || [];
                        }
                        
                        const count = level === 'מתקדם' ? 4 : 3;
                        exercises.push(...groupExercises.slice(0, count));
                    }
                });
            }
            
            // Special case: if someone selected kettlebell equipment, add kettlebell exercises
            if (hasDumbbells && exerciseLibrary['kettlebell']) {
                const kettlebellCount = Math.floor(exercises.length * 0.3); // 30% kettlebell exercises
                const kettlebellExercises = exerciseLibrary['kettlebell'].fullbody.slice(0, kettlebellCount);
                
                // Replace some regular exercises with kettlebell
                exercises.splice(0, kettlebellCount, ...kettlebellExercises);
            }
            
            // Limit based on workout duration
            const avgTimePerExercise = 7;
            const maxExercises = Math.floor(parseInt(workoutDuration) / avgTimePerExercise);
            
            return exercises.slice(0, maxExercises);
        };

        // General strength workout for overall fitness
        const generateGeneralStrengthWorkout = (level, workoutDuration, availableEquipment) => {
            const hasGym = availableEquipment.includes('חדר כושר מלא');
            const hasDumbbells = availableEquipment.includes('משקולות חופשיות (דמבלים/קטלבלים)') || hasGym;
            
            let exercises;
            
            if (hasGym || hasDumbbells) {
                exercises = [
                    { name: 'סקוואט', sets: 3, reps: '12-15', rest: 90, notes: 'רגליים וליבה' },
                    { name: 'בשכיבה לחיצת חזה', sets: 3, reps: '10-12', rest: 90, notes: 'חזה וזרועות' },
                    { name: 'חתירה', sets: 3, reps: '10-12', rest: 90, notes: 'גב' },
                    { name: 'לאנג\'ים', sets: 3, reps: '10 לכל רגל', rest: 60, notes: 'רגליים' },
                    { name: 'פלאנק', sets: 3, duration: '45 שניות', rest: 60, notes: 'ליבה' }
                ];
            } else {
                exercises = [
                    { name: 'סקוואט עמוק', sets: 4, reps: '20', rest: 60, notes: 'רגליים' },
                    { name: 'שכיבות סמיכה', sets: 4, reps: '15', rest: 60, notes: 'חזה וזרועות' },
                    { name: 'חתירה אוסטרלית (Australian Pull-ups)', sets: 3, reps: '12', rest: 90, notes: 'גב - על מוט נמוך' },
                    { name: 'לאנג\'ים', sets: 3, reps: '12 לכל רגל', rest: 60, notes: 'רגליים' },
                    { name: 'פלאנק', sets: 3, duration: '45 שניות', rest: 60, notes: 'ליבה' }
                ];
            }
            
            if (level === 'מתקדם') {
                if (hasGym || hasDumbbells) {
                    exercises.push(
                        { name: 'דד-ליפט', sets: 4, reps: '8', rest: 120, notes: 'כל הגוף' },
                        { name: 'שכיבות סמיכה צמודות', sets: 3, reps: '12', rest: 60, notes: 'טריצפס וחזה' }
                    );
                }
            }
            
            const avgTimePerExercise = 7;
            const maxExercises = Math.floor(parseInt(workoutDuration) / avgTimePerExercise);
            return exercises.slice(0, maxExercises);
        };

        const generateCardioWorkout = (goals, level, multiplier, cardioTarget = {}, week, workoutDuration = 60, totalWeeks = 12, phase = { name: 'בסיס', key: 'base' }) => {
            // Always route to running when aerobic goal is selected
            const isRunningProgram = goals.includes('שיפור יכולת אירובית');

            if (isRunningProgram) {
                return generateRunningWorkout(cardioTarget, week, workoutDuration, goals, totalWeeks, phase);
            }
            
            // General cardio workout (non-running focused)
            const cardioDuration = parseInt(workoutDuration);
            let intensity;
            if (level === 'מתחיל') {
                intensity = 'קל-בינוני';
            } else if (level === 'בינוני') {
                intensity = 'בינוני';
            } else {
                intensity = 'בינוני-גבוה';
            }

            const cardioOptions = ['ריצה', 'אופניים', 'שחייה', 'קפיצות חבל', 'אליפטיקל'];
            let selectedCardio = cardioOptions[Math.floor(Math.random() * cardioOptions.length)];
            let notes = goals.includes('ירידה במשקל') 
                ? 'שמור על קצב קבוע, דופק 60-70% מהמקסימום'
                : 'התמקד בסיבולת, דופק 70-80% מהמקסימום';

            const exercises = [
                {
                    name: selectedCardio,
                    duration: `${cardioDuration} דקות`,
                    intensity: intensity,
                    notes: notes
                }
            ];

            if (goals.includes('שיפור יכולת אירובית') && cardioDuration >= 45) {
                exercises.push({
                    name: 'תרגילי כוח קצרים (סיום האימון)',
                    sets: 2,
                    reps: '15-20',
                    rest: 30,
                    notes: 'בחר 3-4 תרגילים: שכיבות סמיכה, סקוואט, פלאנק, לאנג\'ים - כל תרגיל 15-20 חזרות'
                });
            }

            return exercises;
        };

        // Advanced Running Workout Generator based on BC Running (מועדון ארוחת הבוקר) methodology
        // Core BC Running principles (Lydiard-based):
        // 1. הדרגתיות (Gradualism) - build slowly, no shortcuts
        // 2. מתינות (Moderation) - "train, don't strain"
        // 3. האומץ להאט (Courage to slow down) - to run faster, first learn to run SLOWER
        // 4. עקביות (Consistency) - long-term commitment builds champions
        // 5. עבודה עם הגוף (Work with the body) - listen, adapt, respect recovery
        // 6. פרטלק > אינטרוולים - creative fartlek preferred over rigid track intervals
        // 7. בסיס אירובי (Aerobic base) - foundation before quality, Lydiard method
        const generateRunningWorkout = (cardioTarget, week, workoutDuration, goals, totalWeeks = 12, phase = { name: 'בסיס', key: 'base' }) => {
            const { runningLevel, raceGoal, current5kTime, current10kTime } = cardioTarget;
            const duration = parseInt(workoutDuration);

            // Resolve personal pace zones from 5K (or 10K) time
            const paceZones = getPaceFrom5K(current5kTime) || getPaceFrom5K(current10kTime) || null;

            // BC Running 4-week cycle (Nachshon Shochat methodology):
            // Cycle: Long Run → Easy+Strides → Fartlek → Tempo/Progression/Test
            const weekInCycle = ((week - 1) % 4) + 1;

            // Phase-based workout selection (periodization):
            // Base phase: mostly easy + long run, minimal quality
            // Build phase: introduce fartlek + tempo
            // Peak phase: full quality mix
            // Taper: shorter, easy + some quality to stay sharp

            if (runningLevel === 'beginner') {
                return generateWalkToRunWorkout(week, duration);
            }

            return generateAdvancedRunningWorkout(weekInCycle, duration, runningLevel || 'intermediate', raceGoal || 'general', week, paceZones, phase, totalWeeks);
        };

        // Running Warmup Protocol (based on Ohio State / uploaded document)
        const getRunningWarmup = () => {
            return '5 דקות הליכה מהירה + תרגילי חימום: סיבובי ראש, סיבובי כתפיים לאחור, סיבובי זרועות, מעגלי ירכיים, סקוואטים בהליכה, ספיידרמן לאנג\'ים, הרמת ברכיים, בעיטות לישבן, סיבובי קרסול (10 חזרות כל תרגיל)';
        };

        // Walk-to-Run Program - Full 48-session plan (based on uploaded תוכנית מהליכה לריצה)
        // 3 sessions/week = 16 weeks total
        const generateWalkToRunWorkout = (week, duration) => {
            // Full 48-session program mapped to weeks (3 sessions/week)
            // Each entry covers one "phase" of training weeks
            const programs = [
                // Phase 1 - Weeks 1-3 (Sessions 1-9): 30s run / 2.5 min walk
                { week: 1,  intervals: 5,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה', phase: '1' },
                { week: 2,  intervals: 7,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה', phase: '1' },
                { week: 3,  intervals: 9,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '1' },
                // Phase 2 - Weeks 4-6 (Sessions 10-18): 1 min run / 2 min walk
                { week: 4,  intervals: 5,  run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '2' },
                { week: 5,  intervals: 7,  run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '2' },
                { week: 6,  intervals: 10, run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '2' },
                // Phase 3 - Weeks 7-9 (Sessions 19-27): 2-3 min run / 2 min walk
                { week: 7,  intervals: 4,  run: '2 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '3' },
                { week: 8,  intervals: 5,  run: '2.5 דקות',   walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '3' },
                { week: 9,  intervals: 6,  run: '3 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '3' },
                // Phase 4 - Weeks 10-12 (Sessions 28-36): 4-6 min run / 2 min walk
                { week: 10, intervals: 4,  run: '4 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '4' },
                { week: 11, intervals: 4,  run: '5 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '4' },
                { week: 12, intervals: 4,  run: '6 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '4' },
                // Phase 5 - Weeks 13-16 (Sessions 37-48): 7-20 min → continuous
                { week: 13, intervals: 3,  run: '8 דקות',     walk: 'דקה',      warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '5' },
                { week: 14, intervals: 2,  run: '12 דקות',    walk: 'דקה',      warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '5' },
                { week: 15, intervals: 2,  run: '18 דקות',    walk: 'דקה',      warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '5' },
                { week: 16, intervals: 1,  run: '30-40 דקות', walk: '',          warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '6' },
            ];

            const programWeek = Math.min(week, 16);
            const program = programs.find(p => p.week === programWeek) || programs[programWeek - 1] || programs[programs.length - 1];
            const warmupFull = getRunningWarmup();

            const mainText = program.phase === '6'
                ? `ריצה רציפה של ${program.run} בקצב נוח`
                : `${program.intervals} × (${program.run} ריצה קלילה + ${program.walk} הליכה)`;

            return [{
                name: `מהליכה לריצה - שבוע ${programWeek} (שלב ${program.phase}/6)`,
                duration: `כ-${duration} דקות`,
                warmup: warmupFull,
                main: mainText,
                cooldown: '5 דקות הליכה + מתיחות סטטיות: שוק, ירך קדמית, ירך אחורית',
                notes: program.phase === '6'
                    ? 'ריצה רציפה! הגעת לשלב האחרון. BC Running: "הדרגתיות ועקביות לאורך 16 שבועות - זה המפתח". ריצה בקצב שבו ניתן לנהל שיחה.'
                    : 'BC Running: "הדרגתיות, מתינות, עבודה עם הגוף". אל תמהר. הריצה צריכה להיות קלילה ונוחה - "קצב שיחה". עקביות > עצימות.',
                tips: 'אם האימון קשה מדי - חזור שבוע אחד אחורה. אם קל מדי - קדם שבוע קדימה. BC Running: "האומץ להאט הוא הצעד הראשון לרוץ מהר יותר".'
            }];
        };

        // Advanced Running Workout - BC Running (מועדון ארוחת הבוקר) methodology
        // Based on Nachshon Shochat + Lydiard periodization
        // 4-week cycle: Long Run → Easy+Strides → Fartlek → Tempo/Progression/Test
        // Phase-aware: base = more easy, build = fartlek, peak = tempo+intervals, taper = short
        const generateAdvancedRunningWorkout = (weekInCycle, duration, level, raceGoal, week, paceZones, phase = { key: 'base' }, totalWeeks = 12) => {
            const phaseKey = phase ? phase.key : 'base';

            // Every 8th week: 5K time trial
            const is5KTestWeek = (week % 8 === 0);

            // Taper phase: all workouts become short easy runs or light quality
            if (phaseKey === 'taper') {
                const taperDuration = Math.round(duration * 0.75);
                if (weekInCycle === 1) return generateEasyRunWithStrides(taperDuration, level);
                if (weekInCycle === 2) return generateEasyRunWithStrides(taperDuration, level);
                if (weekInCycle === 3) return generateFartlekWorkout(taperDuration, level, week); // light fartlek to stay sharp
                return generateProgressionRun(taperDuration, level); // short progression
            }

            // Base phase: emphasize aerobic base, minimal quality
            if (phaseKey === 'base') {
                if (weekInCycle === 1) return generateLongRun(duration, level, raceGoal);
                if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
                if (weekInCycle === 3) return generateEasyRunWithStrides(duration, level); // extra easy in base
                return generateProgressionRun(duration, level); // gentle quality
            }

            // Build phase: introduce fartlek and tempo
            if (phaseKey === 'build') {
                if (weekInCycle === 1) return generateLongRun(duration, level, raceGoal);
                if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
                if (weekInCycle === 3) return generateFartlekWorkout(duration, level, week);
                if (is5KTestWeek) return generate5KTestWorkout(duration, level);
                return generateTempoRun(duration, level, week, paceZones);
            }

            // Peak phase: full quality mix - all workout types
            // weekInCycle: 1=Long, 2=Easy+Strides, 3=Fartlek, 4=Tempo or Test
            if (weekInCycle === 1) return generateLongRun(duration, level, raceGoal);
            if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
            if (weekInCycle === 3) return generateFartlekWorkout(duration, level, week);
            if (is5KTestWeek) return generate5KTestWorkout(duration, level);
            return generateTempoRun(duration, level, week, paceZones);
        };

        // Long Run - BC Running methodology: aerobic base, "courage to slow down"
        // Nachshon Shochat: easy with gentle pickup in final third
        // BC Running target: 25-26km or 2 hours; peak weeks 32-36km
        const generateLongRun = (duration, level, raceGoal, paceZones = null) => {
            const easyPace = paceZones ? `קצב קל: ${paceZones.easy} לק"מ` : 'קצב שיחה מלא (60-70% דופק מקסימום)';
            const targetDist = level === 'advanced' ? '22-32 ק"מ' : '14-22 ק"מ';
            return [{
                name: 'ריצה ארוכה (Long Run) - עמוד התווך',
                duration: `${duration} דקות`,
                warmup: getRunningWarmup(),
                structure: 'שליש ראשון: קל מאוד (Zone 1) | שליש שני: אירובי יציב (Zone 2) | שליש אחרון: הגברה מתונה בלבד',
                pace: easyPace + ` | יעד מרחק: ${targetDist}`,
                cooldown: '5-10 דקות הליכה + מתיחות סטטיות',
                notes: level === 'advanced'
                    ? 'BC Running: הריצה הארוכה בונה את הבסיס האירובי - ה"בנק" של VO2max, שריפת שומן, סיבולת נפשית. לא ריצת מהירות. סיים בהרגשה שאפשר המשיך.'
                    : 'BC Running: "האומץ להאט" - כדי לרוץ מהר יותר, קודם ללמוד לרוץ לאט יותר. קצב שיחה מלא.',
                tips: 'נחשון שוחט: "רוץ את הארוכה לאט יותר ממה שאתה חושב שצריך". הדרגתיות + עקביות = שיפור לאורך זמן.'
            }];
        };

        // Easy Run with Strides - Nachshon Shochat + BC Running methodology
        // BC Running: strides 3-4x/week, including in warmup for quality sessions
        // מתגברות = short accelerations to improve stride mechanics and running economy
        const generateEasyRunWithStrides = (duration, level) => {
            const mainDuration = Math.max(25, duration - 10);
            const stridesCount = level === 'advanced' ? '5-6' : '4-5';
            return [{
                name: 'ריצה קלה עם מתגברות (Easy Run + Strides)',
                duration: `${duration} דקות (40-60 דקות אידיאלי)`,
                warmup: getRunningWarmup(),
                main: `${mainDuration} דקות ריצה קלה בקצב שיחה מלא (Zone 1-2)`,
                strides: `${stridesCount} מתגברות של 80-100 מטר: תאוצה הדרגתית עד 90% מהירות → 3 שניות בשיא → הגברה לאט, הליכה חזרה (90 שניות) בין כל מתגברת`,
                cooldown: '5 דקות ריצה קלה מאוד + מתיחות סטטיות',
                notes: 'BC Running: מתגברות 3-4 פעמים בשבוע (כולל בחימום לאימוני איכות). הן משפרות מכניקת צעד, כלכליות ריצה וקשר עצבי-שרירי. ריצה קלה = קצב שיחה מלא לאורך כל האימון.',
                tips: 'המתגברות אינן ספרינט! תאוצה חלקה ונוחה - כמו מטוס שממריא. הגוף לא מכנס אנרגיה אנאירובית. בשטח שטוח עם רוח גב אם אפשר.'
            }];
        };

        // Fartlek - BC Running methodology: creative, free, not on a track
        // BC Running: "פרטלק הוא אימון גמיש ויצירתי, רחוק ממלבן המסלול"
        // Combines aerobic + anaerobic, race simulations, hills, sudden bursts
        // Nachshon Shochat 3-week progression: Short → Medium → Pyramid
        const generateFartlekWorkout = (duration, level, week) => {
            const weekInCycle = ((week - 1) % 3) + 1; // 1, 2, or 3

            const fartlekVariations = [
                {
                    name: 'פרטלק קצר - "משחק מהירות" (Short Fartlek)',
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות של 80מ\' (חלק מהחימום לאימוני איכות - BC Running)',
                    main: level === 'advanced'
                        ? '10-12 × (60 שניות מהיר / 60 שניות ג\'וג קל) - עדיף בשטח טבעי, לא מסלול!'
                        : '8-10 × (60 שניות מהיר / 60 שניות ג\'וג קל) - גבעות, שבילים, פארק',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: "פרטלק = שחרור יצירתי ומהנה". ה"מהיר" = קצב 5K (מאתגר אך לא מקסימלי). ה"קל" = ג\'וג קל שמאפשר שיחה. שמור על קצב קבוע מהחזרה הראשונה לאחרונה.',
                    intensity: 'גבוהה - VO2max',
                    tip: 'BC Running: אל תגיע למסלול! שטח טבעי, גבעות, שבילים - הם הזירה הטבעית של הפרטלק. עיקרון: "train, don\'t strain".'
                },
                {
                    name: 'פרטלק בינוני - סף לקטט (Medium Fartlek)',
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות',
                    main: level === 'advanced'
                        ? '6-8 × (3 דקות מהיר-בינוני / 3 דקות קל) - שנה כיוון, כלול גבעות, הפתע את עצמך'
                        : '5-6 × (3 דקות מהיר-בינוני / 3 דקות קל) - קצב חצי מרתון',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: ה"מהיר-בינוני" = קצב 10K-חצי מרתון (ניתן לשמירה לאורך 3 דקות בכל חזרה). זה אזור הסף הלקטי - ה"מנוע" שמשפר את הריצה לאורך זמן.',
                    intensity: 'בינונית-גבוהה - Lactate Threshold',
                    tip: 'פרטלק = "משחק מהירות" שוודי. גמיש ומהנה. ניתן לשנות על פי תחושה ביום - זו חוזקתו.'
                },
                {
                    name: 'פרטלק פירמידה + ספרינטים (Pyramid Fartlek)',
                    warmup: '15-20 דקות ריצה קלה + 4-5 מתגברות',
                    main: 'פירמידה: 2→4→6→4→2 דקות (מהיר), 2-3 דקות ג\'וג קל בין כל פרק. סיום: 4×30 שניות ספרינט (א-לקטי) / 60 שניות ג\'וג',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: הפירמידה עובדת על כל טווחי הקצב. הקצב ב-2 דקות מהיר מב-6 דקות. הספרינטים הקצרים בסוף (≤30 שניות במאמץ מירבי) = אימון "א-לקטי" שמשפר מהירות טהורה לפי שיטת לידיארד.',
                    intensity: 'גבוהה-מאוד גבוהה',
                    tip: 'BC Running: שמור את הספרינטים "בטנק". הם קצרים (עד 10-30 שניות) ומירביים. זו הדרך לשפר מהירות טהורה - לא חזרות 400מ\' ארוכות!'
                }
            ];

            return [fartlekVariations[weekInCycle - 1]];
        };

        // Tempo Run - BC Running: LT training based on Pfitzinger / BC Running methodology
        // BC Running: 3-5km warmup then 6-11km tempo at LT pace; strong VO2max stimulus
        // "גירוי חזק לשיפור קצב סף חומצת החלב" (BC Running on tempo runs)
        const generateTempoRun = (duration, level, week, paceZones = null) => {
            const warmupKm = level === 'advanced' ? '3-5 ק"מ' : '2-3 ק"מ';
            const tempoKm = level === 'advanced' ? '8-12 ק"מ' : '5-8 ק"מ';
            const tempoMin = Math.round(duration * 0.6);
            const tempoPaceStr = paceZones
                ? `קצב טמפו: ${paceZones.medium} לק"מ (אחרי חימום ${warmupKm})`
                : `קצב 10K + 20-30 שניות לק"מ | "נוח-קשה" | ניתן לדבר מילים בודדות`;
            return [{
                name: 'ריצת טמפו (Tempo Run) - סף לקטט',
                duration: `${duration} דקות`,
                warmup: `${warmupKm} ריצה קלה + ` + getRunningWarmup() + ' + 3-4 מתגברות',
                main: `${tempoMin} דקות / ${tempoKm} | ${tempoPaceStr}`,
                cooldown: '10-15 דקות ריצה קלה מאוד + מתיחות ארוכות',
                notes: 'BC Running: קצב טמפו = "נוח-קשה". דופק 80-90% מקסימום. ניתן לדבר מילים בודדות אבל לא משפטים. זהו אימון סף הלקטי - מגביר את היכולת לרוץ מהר יותר עם פחות חומצת חלב.',
                tips: 'לא מהיר מדי! קצב טמפו ≠ קצב 5K. BC Running: "אינטרוולים עצימים מוגזמים פוגעים ברצי ארוכות - הטמפו הוא הנשק הסודי".'
            }];
        };

        // Progression Run - Nachshon Shochat Run #4 + BC Running "negatively split"
        // BC Running: "easy out, fast back" - builds mental strength and race pacing
        const generateProgressionRun = (duration, level) => {
            const half = Math.round(duration / 2);
            return [{
                name: 'ריצת פרוגרסיה (Negative Split / Progression Run)',
                duration: `${duration} דקות`,
                warmup: getRunningWarmup(),
                structure: level === 'advanced'
                    ? `${Math.round(duration * 0.35)} דקות קל (Zone 1-2) → ${Math.round(duration * 0.35)} דקות קצב מרתון (Zone 3) → ${Math.round(duration * 0.25)} דקות קצב חצי מרתון (Zone 4) → ק"מ אחרון: כל מה שיש!`
                    : `מחצית ראשונה (${half} דקות): ריצה קלה בקצב שיחה (Zone 1-2) → מחצית שנייה: הגברה הדרגתית, דקות אחרונות: מאמץ גבוה (Zone 3-4)`,
                cooldown: '5-10 דקות הליכה + מתיחות סטטיות',
                notes: 'BC Running: "הלוך קל - חזור מהיר". הגברה הדרגתית מלמדת ניהול קצב (Pacing) - מיומנות קריטית במרתון. לא קפיצות פתאומיות - הדרגתיות!',
                tips: 'נחשון שוחט: "הסוד הוא לא להתחיל מהר מדי. הפיתוי הגדול ביותר הוא לצאת מהר מדי. כפה על עצמך להאט בהתחלה."'
            }];
        };

        // 5K Test/Time Trial - BC Running: "מבחן כושר" every 8 weeks
        // BC Running recommends tune-up races (10K) 3-5 weeks before marathon
        const generate5KTestWorkout = (duration, level) => {
            return [{
                name: '5K מבחן / מירוץ כושר (Tune-Up Race)',
                duration: `כ-35-45 דקות (כולל חימום וצינון)`,
                warmup: '2-3 ק"מ ריצה קלה + ' + getRunningWarmup() + ' + 4-5 מתגברות 80מ\'',
                main: 'ריצה מקסימלית של 5 ק"מ - מדוד את הזמן! יצא שלילי-ספליט (נגטיב ספליט).',
                cooldown: '10-15 דקות ריצה קלה מאוד + מתיחות ארוכות (10+ דקות)',
                notes: 'BC Running: מבחן כל 8 שבועות (לא ישן יותר מדי) לבדיקת התקדמות. הקצב ב-5K משמש כבסיס לחישוב כל קצבי האימון: טמפו, פרטלק, אינטרוולים. אם השתתפת במירוץ 10K - זה עדיף!',
                tips: 'לאחר המבחן: רשום את הזמן → עדכן קצבי אימון → שיפור של 10-30 שניות כל 8 שבועות = מעולה. BC Running: "מבחן + תחרות = מוטיבציה + כיוון ברור".'
            }];
        };

        // Run Less Run Faster (RLRF) - 3 key workouts methodology
        // BC Running perspective: fewer runs but each is quality ("train, don't strain")
        // Intervals (VO2max) + Tempo (LT) + Long Run
        const generateRLRFWorkout = (workoutType, duration, level, week) => {
            if (workoutType === 'intervals') {
                const weekInCycle = ((week - 1) % 4) + 1;
                // BC Running: 600-2000m intervals at 95-100% VO2max (3-5K race pace)
                const intervalSets = [
                    '6 × 400מ\' (קצב 5K) + 400מ\' ג\'וג קל בין חזרות',
                    '4 × 800מ\' (קצב 5K-10K) + 400מ\' ג\'וג',
                    '3 × 1200מ\' (קצב 10K) + 400מ\' ג\'וג',
                    '5 × 600מ\' (קצב 5K) + 300מ\' ג\'וג'
                ];
                return [{
                    name: 'ריצת אינטרוולים (RLRF Workout 1 / VO2max)',
                    warmup: '10-15 דקות ריצה קלה + מתיחות דינמיות + 4 מתגברות',
                    main: intervalSets[weekInCycle - 1],
                    cooldown: '10-15 דקות ריצה קלה',
                    notes: 'RLRF: 3 אימונים מרכזיים בשבוע = כל אחד חייב להיות איכותי. BC Running: אינטרוולים 600-2000מ\' ב-95-100% VO2max (קצב תחרות 3-5K). גירוי חזק לשיפור VO2max.',
                    tips: 'BC Running: "רבים מפריזים במינון ובתדירות של אינטרוולים עצימים עבור רצי ארוכות". RLRF פותר זאת: רק אימון אחד של אינטרוולים שבועי, אך הוא איכותי.'
                }];
            } else if (workoutType === 'tempo') {
                return [{
                    name: 'ריצת טמפו (RLRF Workout 2 / Lactate Threshold)',
                    warmup: '2-3 ק"מ ריצה קלה + מתגברות',
                    main: `${Math.round(duration * 0.6)} דקות / 6-11 ק"מ ריצת טמפו (קצב 10K + 20 שניות לק"מ)`,
                    cooldown: '10 דקות ריצה קלה',
                    notes: 'ריצת טמפו = מאמץ "נוח-קשה". דופק 80-90% מקסימום. ניתן לדבר מילים בודדות. BC Running: "גירוי חזק לשיפור קצב סף חומצת החלב". חימום: 3-5 ק"מ לפני הטמפו.',
                    tips: 'BC Running + RLRF: הטמפו הוא "הנשק הסודי" לרצי ארוכות. יעיל יותר מחזרות 400מ\' לרצי מרתון.'
                }];
            }
            return generateLongRun(duration, level, null);
        };

        // Main App
        function FitnessApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const traineeId = urlParams.get('trainee');

            if (traineeId) {
                return <TraineeView traineeId={traineeId} />;
            } else {
                return <TrainerApp />;
            }
        }

        // Trainer App
        function TrainerApp() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                const auth = sessionStorage.getItem('trainerAuth');
                if (auth === 'true') {
                    setIsAuthenticated(true);
                }
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === storage.TRAINER_PASSWORD) {
                    setIsAuthenticated(true);
                    sessionStorage.setItem('trainerAuth', 'true');
                    setError('');
                } else {
                    setError('סיסמה שגויה');
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">🔒</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">כניסת מאמן</h1>
                                <p className="text-gray-600">הזן סיסמה לגישה למערכת</p>
                            </div>
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="סיסמה"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>
                                {error && (
                                    <div className="text-red-600 text-sm text-center">{error}</div>
                                )}
                                <button
                                    type="submit"
                                    className="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-xl transition"
                                >
                                    כניסה
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return <TrainerDashboard />;
        }

        // Trainer Dashboard
        function TrainerDashboard() {
            const [trainees, setTrainees] = useState([]);
            const [showCreateForm, setShowCreateForm] = useState(false);
            const [selectedTrainee, setSelectedTrainee] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadTrainees();
            }, []);

            const loadTrainees = async () => {
                setLoading(true);
                const data = await storage.getTrainees();
                setTrainees(data);
                setLoading(false);
            };

            const refreshTrainees = async () => {
                await loadTrainees();
            };

            const handleLogout = () => {
                sessionStorage.removeItem('trainerAuth');
                window.location.reload();
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-2xl font-bold text-gray-700">טוען נתונים...</div>
                        </div>
                    </div>
                );
            }

            if (selectedTrainee) {
                return (
                    <TraineeDetailView 
                        trainee={selectedTrainee} 
                        onBack={() => {
                            setSelectedTrainee(null);
                            refreshTrainees();
                        }}
                    />
                );
            }

            if (showCreateForm) {
                return (
                    <CreateTraineePlan 
                        onBack={() => setShowCreateForm(false)}
                        onComplete={() => {
                            setShowCreateForm(false);
                            refreshTrainees();
                        }}
                    />
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold">דשבורד מאמן 🎯</h1>
                                <p className="text-purple-100 mt-1">ניהול מתאמנים ותוכניות אימון</p>
                            </div>
                            <button
                                onClick={handleLogout}
                                className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition"
                            >
                                התנתק
                            </button>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto p-6">
                        <div className="mb-6">
                            <button
                                onClick={() => setShowCreateForm(true)}
                                className="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg flex items-center gap-2"
                            >
                                <span className="text-xl">➕</span>
                                צור תוכנית למתאמן חדש
                            </button>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-2xl font-bold text-gray-800 mb-6">המתאמנים שלי ({trainees.length})</h2>
                            
                            {trainees.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <div className="text-6xl mb-4">📭</div>
                                    <p className="text-xl">אין עדיין מתאמנים במערכת</p>
                                    <p className="text-sm mt-2">לחץ על "צור תוכנית למתאמן חדש" כדי להתחיל</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {trainees.map(trainee => {
                                        const totalWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) => 
                                            sum + week.workouts.length, 0
                                        );
                                        const completedWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) => 
                                            sum + week.workouts.filter(w => w.completed).length, 0
                                        );
                                        const progress = Math.round((completedWorkouts / totalWorkouts) * 100);
                                        
                                        const hasNewFeedback = trainee.workoutPlan.weeks.some(week => 
                                            week.workouts.some(w => w.feedback && w.feedbackSentToTrainer && !w.feedbackRead)
                                        );

                                        return (
                                            <div
                                                key={trainee.id}
                                                onClick={() => setSelectedTrainee(trainee)}
                                                className="bg-gray-50 hover:bg-gray-100 p-6 rounded-xl transition-all cursor-pointer relative"
                                            >
                                                {hasNewFeedback && (
                                                    <div className="absolute top-3 left-3 w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                                                )}
                                                <div className="text-3xl mb-2">👤</div>
                                                <div className="font-bold text-gray-800 text-lg mb-1">{trainee.name}</div>
                                                <div className="text-sm text-gray-600 mb-3">
                                                    {trainee.email}
                                                </div>
                                                <div className="mb-2">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <div className="flex-1 bg-gray-200 rounded-full h-2">
                                                            <div
                                                                className="bg-purple-500 h-2 rounded-full"
                                                                style={{ width: `${progress}%` }}
                                                            />
                                                        </div>
                                                        <span className="text-sm font-semibold text-purple-600">{progress}%</span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Create Trainee Plan Form
        function CreateTraineePlan({ onBack, onComplete }) {
            const [step, setStep] = useState('form'); // 'form' or 'preview'
            const [generatedPlan, setGeneratedPlan] = useState(null);
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                age: '',
                gender: '',
                height: '',
                weight: '',
                activityLevel: '',
                workoutDuration: '', // in minutes
                goals: [],
                muscleGroups: [],
                availableEquipment: [], // equipment available for training
                // Running-specific fields
                runningLevel: '', // beginner, intermediate, advanced
                weeklyMileage: '', // current km per week
                raceGoal: '', // marathon, half-marathon, 10k, 5k, general fitness
                currentPace: '', // e.g., "5:30 per km"
                current5kTime: '',
                current10kTime: '',
                currentHalfTime: '',
                currentMarathonTime: '',
                injuryHistory: '',
                cardioTarget: {
                    hasDistanceGoal: false,
                    distance: '',
                    hasPaceGoal: false,
                    pace: ''
                }
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleGoalToggle = (goal) => {
                setFormData(prev => ({
                    ...prev,
                    goals: prev.goals.includes(goal)
                        ? prev.goals.filter(g => g !== goal)
                        : [...prev.goals, goal]
                }));
            };

            const handleMuscleGroupToggle = (group) => {
                setFormData(prev => ({
                    ...prev,
                    muscleGroups: prev.muscleGroups.includes(group)
                        ? prev.muscleGroups.filter(g => g !== group)
                        : [...prev.muscleGroups, group]
                }));
            };

            const handleCardioTargetChange = (field, value) => {
                setFormData(prev => ({
                    ...prev,
                    cardioTarget: {
                        ...prev.cardioTarget,
                        [field]: value
                    }
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                const workoutPlan = generateWorkoutPlan(formData);
                setGeneratedPlan(workoutPlan);
                setStep('preview');
            };

            const handleSavePlan = async () => {
                const trainee = {
                    id: Date.now().toString(),
                    ...formData,
                    workoutPlan: generatedPlan,
                    createdAt: new Date().toISOString()
                };

                try {
                    await storage.saveTrainee(trainee);
                    onComplete();
                } catch (error) {
                    console.error('Error saving trainee:', error);
                    alert('שגיאה בשמירת מתאמן. אנא נסה שוב.');
                }
            };

            const handleRegeneratePlan = () => {
                const workoutPlan = generateWorkoutPlan(formData);
                setGeneratedPlan(workoutPlan);
            };

            if (step === 'preview') {
                return (
                    <PlanPreviewEditor 
                        formData={formData}
                        workoutPlan={generatedPlan}
                        onBack={() => setStep('form')}
                        onSave={handleSavePlan}
                        onRegenerate={handleRegeneratePlan}
                        onUpdatePlan={setGeneratedPlan}
                    />
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 py-8 px-4">
                    <div className="max-w-2xl mx-auto">
                        <button
                            onClick={onBack}
                            className="mb-6 text-purple-600 hover:text-purple-700 font-semibold flex items-center gap-2"
                        >
                            ← חזרה

            );

                    // Add slash before query parameter
                    return `${fullUrl}/?trainee=${trainee.id}`;
                }
                // Fallback to current location
                const baseUrl = `${window.location.origin}${window.location.pathname}`;
                return `${baseUrl}?trainee=${trainee.id}`;

                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => handleWorkoutComplete(selectedWeek, index)}
                                                className={`px-4 py-2 rounded-lg font-semibold transition ${
                                                    workout.completed
                                                        ? 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                        : 'bg-green-500 text-white hover:bg-green-600'
                                                }`}
                                            >
                                                {workout.completed ? 'ביטול' : 'סיימתי'}
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setSelectedWorkout(workout);
                                                    setShowFeedbackModal(true);
                                                }}
                                                className="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg font-semibold hover:bg-purple-200 transition"
                                            >
                                                פידבק
                                            </button>
                                        </div>
                                    </div>

                                    {/* Exercises */}
                                    <div className="space-y-3">
                                        {workout.exercises.map((exercise, exIndex) => (
                                            <div key={exIndex} className="bg-gray-50 p-4 rounded-lg">
                                                <div className="font-semibold text-gray-800 mb-2">{exercise.name}</div>
                                                <div className="text-gray-600 text-sm space-y-1">
                                                    {exercise.warmup && <div><strong>חימום:</strong> {exercise.warmup}</div>}
                                                    {exercise.main && <div><strong>עיקרי:</strong> {exercise.main}</div>}
                                                    {exercise.structure && <div><strong>מבנה:</strong> {exercise.structure}</div>}
                                                    {exercise.progression && <div><strong>התקדמות:</strong> {exercise.progression}</div>}
                                                    {exercise.strides && <div><strong>מתגברות:</strong> {exercise.strides}</div>}
                                                    {exercise.cooldown && <div><strong>התאוששות:</strong> {exercise.cooldown}</div>}
                                                    {exercise.pace && <div><strong>קצב:</strong> {exercise.pace}</div>}
                                                    {exercise.intensity && <div><strong>עצימות:</strong> {exercise.intensity}</div>}
                                                    {exercise.sets && <div>סטים: {exercise.sets}</div>}
                                                    {exercise.reps && <div>חזרות: {exercise.reps}</div>}
                                                    {exercise.duration && <div>משך: {exercise.duration}</div>}
                                                    {exercise.rest && <div>מנוחה: {exercise.rest} שניות</div>}
                                                    {exercise.recommendedWeight && (
                                                        <div className="bg-green-100 p-2 rounded mt-2 border border-green-300">
                                                            <strong className="text-green-800">💪 משקל מומלץ: {exercise.recommendedWeight}</strong>
                                                        </div>
                                                    )}
                                                    {exercise.weightNote && (
                                                        <div className="text-green-700 text-xs mt-1">
                                                            📊 {exercise.weightNote}
                                                        </div>
                                                    )}
                                                    {exercise.notes && <div className="text-purple-600 mt-2">💡 {exercise.notes}</div>}
                                                    {exercise.tips && <div className="text-blue-600 mt-2">✨ {exercise.tips}</div>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {workout.difficulty && (
                                        <div className="mt-4 p-4 bg-blue-50 rounded-lg">
                                            <div className="font-semibold text-blue-900 mb-1">הפידבק שלך:</div>
                                            <div className="text-blue-800">רמת קושי: {workout.difficulty}</div>
                                            {workout.feedback && <div className="text-blue-700 mt-1">{workout.feedback}</div>}
                                            {workout.feedbackSentToTrainer && (
                                                <div className="text-green-600 text-sm mt-2">✓ נשלח למאמן</div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    {showFeedbackModal && (
                        <FeedbackModal
                            workout={selectedWorkout}
                            onClose={() => {
                                setShowFeedbackModal(false);
                                setSelectedWorkout(null);
                            }}
                            onSubmit={handleFeedbackSubmit}
                        />
                    )}
                </div>
            );
        }

        // Feedback Modal
        function FeedbackModal({ workout, onClose, onSubmit }) {
            const [difficulty, setDifficulty] = useState(workout.difficulty || '');
            const [feedback, setFeedback] = useState(workout.feedback || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(difficulty, feedback);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                        <h3 className="text-2xl font-bold text-gray-800 mb-4">פידבק על האימון</h3>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 font-semibold mb-2">רמת קושי</label>
                                <div className="space-y-2">
                                    {['קל מדי', 'מתאים', 'קשה מדי'].map(level => (
                                        <label key={level} className="flex items-center gap-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                            <input
                                                type="radio"
                                                name="difficulty"
                                                value={level}
                                                checked={difficulty === level}
                                                onChange={(e) => setDifficulty(e.target.value)}
                                                required
                                                className="w-5 h-5 text-purple-600"
                                            />
                                            <span className="text-gray-700">{level}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-gray-700 font-semibold mb-2">הערות למאמן (אופציונלי)</label>
                                <textarea
                                    value={feedback}
                                    onChange={(e) => setFeedback(e.target.value)}
                                    rows="4"
                                    placeholder="איך היה האימון? יש משהו שתרצה לשתף?"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>

                            <div className="flex gap-3">
                                <button
                                    type="submit"
                                    className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition"
                                >
                                    שלח למאמן
                                </button>
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-xl transition"
                                >
                                    ביטול
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FitnessApp />, document.getElementById('root'));
    </script>
</body>
</html>
