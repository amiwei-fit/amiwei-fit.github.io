    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBsZHawi8LZnUeAtXuwB-O38h8-zznokqo",
            authDomain: "amiwei-trainer.firebaseapp.com",
            projectId: "amiwei-trainer",
            storageBucket: "amiwei-trainer.firebasestorage.app",
            messagingSenderId: "695230405102",
            appId: "1:695230405102:web:184b4a8ae261e0da8a56ff"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        console.log('✅ Firebase initialized!');

        // Storage functions
        const storage = {
            TRAINER_PASSWORD: '1234',
            
            getTrainees: async () => {
                try {
                    const snapshot = await db.collection('trainees').orderBy('createdAt', 'desc').get();
                    return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } catch (error) {
                    console.error('Error getting trainees:', error);
                    return [];
                }
            },
            
            saveTrainee: async (trainee) => {
                try {
                    const traineeData = {
                        ...trainee,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('trainees').doc(trainee.id).set(traineeData);
                    console.log('✅ Trainee saved:', trainee.id);
                    return trainee;
                } catch (error) {
                    console.error('Error saving trainee:', error);
                    alert('שגיאה בשמירת מתאמן. אנא נסה שוב.');
                    throw error;
                }
            },
            
            updateTrainee: async (traineeId, updates) => {
                try {
                    const updateData = {
                        ...updates,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await db.collection('trainees').doc(traineeId).update(updateData);
                    const doc = await db.collection('trainees').doc(traineeId).get();
                    if (doc.exists) {
                        console.log('✅ Trainee updated:', traineeId);
                        return { id: doc.id, ...doc.data() };
                    }
                    return null;
                } catch (error) {
                    console.error('Error updating trainee:', error);
                    return null;
                }
            },
            
            getTrainee: async (traineeId) => {
                try {
                    const doc = await db.collection('trainees').doc(traineeId).get();
                    if (doc.exists) {
                        console.log('✅ Trainee loaded:', traineeId);
                        return { id: doc.id, ...doc.data() };
                    }
                    console.log('❌ Trainee not found:', traineeId);
                    return null;
                } catch (error) {
                    console.error('Error getting trainee:', error);
                    return null;
                }
            },
            
            deleteTrainee: async (traineeId) => {
                try {
                    await db.collection('trainees').doc(traineeId).delete();
                    console.log('✅ Trainee deleted:', traineeId);
                } catch (error) {
                    console.error('Error deleting trainee:', error);
                    throw error;
                }
            }
        };

        // 1RM Percentage Table based on Repetitions
        const rm1PercentageTable = {
            1: 100, 2: 97, 3: 94, 4: 92, 5: 89, 6: 86, 7: 83, 8: 81, 9: 78, 10: 75,
            11: 73, 12: 71, 13: 70, 14: 68, 15: 67, 16: 65, 17: 64, 18: 63, 19: 61, 20: 60,
            21: 59, 22: 58, 23: 57, 24: 56, 25: 55, 26: 54, 27: 53, 28: 52, 29: 51, 30: 50
        };

        // Calculate recommended weight based on 1RM and target reps
        const calculateRecommendedWeight = (oneRM, targetReps) => {
            if (!oneRM || targetReps > 30) return null;
            const percentage = rm1PercentageTable[targetReps] || 50;
            return Math.round(oneRM * (percentage / 100));
        };

        // Get 1RM for exercise type
        const get1RMForExercise = (exerciseName, userData) => {
            if (!userData.knows1RM) return null;
            
            const name = exerciseName.toLowerCase();
            if (name.includes('סקוואט') || name.includes('squat')) {
                return userData.squat1RM;
            }
            if (name.includes('שכיבה') && (name.includes('לחיצת') || name.includes('חזה')) || name.includes('bench')) {
                return userData.bench1RM;
            }
            if (name.includes('דד-ליפט') || name.includes('deadlift')) {
                return userData.deadlift1RM;
            }
            if (name.includes('כתף') && name.includes('לחיצ') || name.includes('overhead') || name.includes('press')) {
                return userData.overheadPress1RM;
            }
            return null;
        };

        // Add weight recommendations to exercises
        const addWeightRecommendations = (exercises, userData, week) => {
            return exercises.map(exercise => {
                const oneRM = get1RMForExercise(exercise.name, userData);
                
                if (oneRM && exercise.reps && typeof exercise.reps === 'number') {
                    // Progressive overload: increase intensity every 2 weeks
                    const weekMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.025); // 2.5% every 2 weeks
                    const adjustedReps = Math.max(1, Math.round(exercise.reps / weekMultiplier));
                    const recommendedWeight = calculateRecommendedWeight(oneRM, adjustedReps);
                    
                    if (recommendedWeight) {
                        return {
                            ...exercise,
                            recommendedWeight: `${recommendedWeight} ק"ג`,
                            weightNote: `מבוסס על ${rm1PercentageTable[adjustedReps]}% מ-1RM (${oneRM} ק"ג). שבוע ${week}: ${adjustedReps} חזרות בעומס זה.`
                        };
                    }
                }
                
                // For exercises with rep ranges (like "8-10")
                if (oneRM && exercise.reps && typeof exercise.reps === 'string') {
                    const match = exercise.reps.match(/(\d+)-(\d+)/);
                    if (match) {
                        const maxReps = parseInt(match[2]);
                        const weekMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.025);
                        const adjustedReps = Math.max(1, Math.round(maxReps / weekMultiplier));
                        const recommendedWeight = calculateRecommendedWeight(oneRM, adjustedReps);
                        
                        if (recommendedWeight) {
                            return {
                                ...exercise,
                                recommendedWeight: `${recommendedWeight} ק"ג`,
                                weightNote: `מבוסס על ${rm1PercentageTable[adjustedReps]}% מ-1RM. התחל עם משקל זה ונסה להגיע ל-${exercise.reps} חזרות.`
                            };
                        }
                    }
                }
                
                return exercise;
            });
        };

        // Workout generation algorithm
        const generateWorkoutPlan = (userData) => {
            const { weight, height, age, gender, activityLevel, workoutDuration, goals, muscleGroups, cardioTarget, weeklyWorkouts } = userData;
            
            // For muscle building - only strength training
            const isMuscleBuilding = goals.includes('עלייה במסת שריר');
            
            let duration, workoutsPerWeek;
            
            if (isMuscleBuilding) {
                duration = 4; // 4 week cycles for muscle building
                workoutsPerWeek = parseInt(weeklyWorkouts) || 4;
            } else {
                duration = goals.includes('ירידה במשקל') ? 6 : 4;
                
                if (activityLevel === 'מתחיל') workoutsPerWeek = 3;
                else if (activityLevel === 'בינוני') workoutsPerWeek = 4;
                else workoutsPerWeek = 5;
            }

            const weeks = [];
            const hasAerobicGoal = goals.includes('שיפור יכולת אירובית');
            
            for (let week = 1; week <= duration; week++) {
                const weekPlan = {
                    weekNumber: week,
                    workouts: []
                };

                const intensityMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.1);

                for (let day = 1; day <= workoutsPerWeek; day++) {
                    let workout;
                    
                    if (isMuscleBuilding) {
                        // Only strength training for muscle building
                        const exercises = generateStrengthWorkout(goals, activityLevel, intensityMultiplier, muscleGroups, workoutDuration, userData.availableEquipment || []);
                        const exercisesWithWeights = addWeightRecommendations(exercises, userData, week);
                        
                        workout = {
                            day: day,
                            type: 'כוח',
                            exercises: exercisesWithWeights,
                            completed: false,
                            feedback: null,
                            difficulty: null
                        };
                    } else if (hasAerobicGoal) {
                        // For runners - cardio focused with strength components
                        
                        if (workoutsPerWeek <= 3) {
                            // 3 or fewer workouts: All running + 2 have 10-15 min strength at the end
                            const hasStrengthComponent = (day === 1 || day === 2);
                            
                            if (hasStrengthComponent) {
                                // Running workout with 10-15 min runner strength at the end
                                const runningExercises = generateCardioWorkout(goals, activityLevel, intensityMultiplier, cardioTarget, week, workoutDuration);
                                const strengthExercises = generateRunnerStrengthWorkout(activityLevel, userData.availableEquipment || [], '15');
                                
                                workout = {
                                    day: day,
                                    type: 'אירובי + כוח',
                                    exercises: [
                                        ...runningExercises,
                                        { name: '━━━ חיזוק לרצים (10-15 דקות) ━━━', sets: 0, reps: '', rest: 0, notes: 'מעבר לתרגילי חיזוק' },
                                        ...strengthExercises
                                    ],
                                    completed: false,
                                    feedback: null,
                                    difficulty: null
                                };
                            } else {
                                // Pure running workout
                                workout = {
                                    day: day,
                                    type: 'אירובי',
                                    exercises: generateCardioWorkout(goals, activityLevel, intensityMultiplier, cardioTarget, week, workoutDuration),
                                    completed: false,
                                    feedback: null,
                                    difficulty: null
                                };
                            }
                        } else if (workoutsPerWeek >= 5) {
                            // 5+ workouts: 2 are 40-min strength workouts, rest are running
                            const isFullStrengthDay = (day === 2 || day === 5);
                            
                            if (isFullStrengthDay) {
                                // Full 40-minute runner-specific strength workout
                                const exercises = generateRunnerStrengthWorkout(activityLevel, userData.availableEquipment || [], '40');
                                
                                workout = {
                                    day: day,
                                    type: 'כוח לרצים',
                                    exercises: exercises,
                                    completed: false,
                                    feedback: null,
                                    difficulty: null
                                };
                            } else {
                                // Running workout
                                workout = {
                                    day: day,
                                    type: 'אירובי',
                                    exercises: generateCardioWorkout(goals, activityLevel, intensityMultiplier, cardioTarget, week, workoutDuration),
                                    completed: false,
                                    feedback: null,
                                    difficulty: null
                                };
                            }
                        } else {
                            // 4 workouts: 1 full strength, 3 running
                            const isStrengthDay = (day === 2);
                            
                            if (isStrengthDay) {
                                // 40-minute runner-specific strength workout
                                const exercises = generateRunnerStrengthWorkout(activityLevel, userData.availableEquipment || [], '40');
                                
                                workout = {
                                    day: day,
                                    type: 'כוח לרצים',
                                    exercises: exercises,
                                    completed: false,
                                    feedback: null,
                                    difficulty: null
                                };
                            } else {
                                // Running workout
                                workout = {
                                    day: day,
                                    type: 'אירובי',
                                    exercises: generateCardioWorkout(goals, activityLevel, intensityMultiplier, cardioTarget, week, workoutDuration),
                                    completed: false,
                                    feedback: null,
                                    difficulty: null
                                };
                            }
                        }
                    } else {
                        if (day % 2 === 1) {
                            const exercises = generateStrengthWorkout(goals, activityLevel, intensityMultiplier, muscleGroups, workoutDuration, userData.availableEquipment || []);
                            const exercisesWithWeights = addWeightRecommendations(exercises, userData, week);
                            
                            workout = {
                                day: day,
                                type: 'כוח',
                                exercises: exercisesWithWeights,
                                completed: false,
                                feedback: null,
                                difficulty: null
                            };
                        } else {
                            workout = {
                                day: day,
                                type: 'אירובי',
                                exercises: generateCardioWorkout(goals, activityLevel, intensityMultiplier, cardioTarget, week, workoutDuration),
                                completed: false,
                                feedback: null,
                                difficulty: null
                            };
                        }
                    }
                    
                    weekPlan.workouts.push(workout);
                }
                
                weeks.push(weekPlan);
            }

            return {
                duration: duration,
                workoutsPerWeek: workoutsPerWeek,
                workoutDuration: workoutDuration,
                weeks: weeks,
                createdAt: new Date().toISOString(),
                muscleGroups: muscleGroups || [],
                cardioTarget: cardioTarget || {}
            };
        };

        const generateStrengthWorkout = (goals, level, multiplier, muscleGroups = [], workoutDuration = 60, availableEquipment = []) => {
            let exercises = [];
            
            // Check if this is for a runner (aerobic goal)
            const isRunner = goals.includes('שיפור יכולת אירובית');
            
            if (isRunner) {
                // Runner-specific strength training - focus on injury prevention and running economy
                exercises = generateRunnerStrengthWorkout(level, availableEquipment, workoutDuration);
                return exercises;
            }
            
            // Strength training for muscle building
            const isMuscleBuilding = goals.includes('עלייה במסת שריר');
            
            if (isMuscleBuilding) {
                return generateMuscleBuildingWorkout(muscleGroups, level, workoutDuration, availableEquipment);
            }
            
            // Default general fitness workout
            return generateGeneralStrengthWorkout(level, workoutDuration, availableEquipment);
        };

        // Runner-specific strength workout
        const generateRunnerStrengthWorkout = (level, availableEquipment, workoutDuration) => {
            const exercises = [
                // שרשרת אחורית
                { name: 'עליות תאומים (Calf Raises)', sets: 3, reps: '15-20', rest: 45, notes: 'מבודד לתאומים - חיזוק שוקיים למניעת פציעות' },
                { name: 'הרמות אגן (Hip Extension)', sets: 3, reps: '15', rest: 60, notes: 'וריאציות: רגליים על הרצפה / כדור פיזיו' },
                { name: 'Kick Back עם miniband', sets: 3, reps: '15 לכל רגל', rest: 45, notes: 'שרשרת אחורית - גלוטס והמסטרינג' },
                { name: 'דד-ליפט חד-רגלי (Single Leg Deadlift)', sets: 3, reps: '10 לכל רגל', rest: 90, notes: 'חיזוק שרשרת אחורית + איזון' },
                
                // שרשרת קדמית
                { name: 'סקוואט (וריאציות)', sets: 3, reps: '12-15', rest: 90, notes: 'משקל על הכתפיים / pistol squat / elevated single leg split squat' },
                { name: 'לאנג\'ים', sets: 3, reps: '12 לכל רגל', rest: 60, notes: 'וריאציות: עם משקל / walking lunge / jump lunge' },
                
                // מרחיקים ומקרבים
                { name: 'Lateral Step עם miniband', sets: 3, reps: '15 לכל צד', rest: 45, notes: 'מרחיקים - מניעת פציעות ברך' },
                { name: 'Clamshell עם miniband', sets: 3, reps: '15 לכל צד', rest: 45, notes: 'מרחיקים - חיזוק גלוטס חיצוני' },
                { name: 'Adduction עם miniband', sets: 3, reps: '15', rest: 45, notes: 'מקרבים - יציבות פנימית' },
                
                // ליבה
                { name: 'פלאנק', sets: 3, duration: '45-60 שניות', rest: 60, notes: 'חיזוק ליבה - קריטי לריצה יעילה' },
                { name: 'פלאנק צדדי', sets: 3, duration: '30 שניות לכל צד', rest: 45, notes: 'יציבות צדדית' },
                { name: 'Crunches', sets: 3, reps: '20', rest: 45, notes: 'חיזוק בטן' },
                
                // חזה עליון
                { name: 'שכיבות סמיכה', sets: 3, reps: '15-20', rest: 60, notes: 'חיזוק חזה וזרועות' }
            ];
            
            if (level === 'מתקדם') {
                exercises.push(
                    { name: 'בוקס סטפ-אפ', sets: 3, reps: '10 לכל רגל', rest: 60, notes: 'מחזק את כוח הדחיפה בריצה' }
                );
            }
            
            const avgTimePerExercise = 6;
            const maxExercises = Math.floor(parseInt(workoutDuration) / avgTimePerExercise);
            return exercises.slice(0, maxExercises);
        };

        // Professional muscle building workout based on equipment and muscle groups
        const generateMuscleBuildingWorkout = (muscleGroups, level, workoutDuration, availableEquipment) => {
            const hasGym = availableEquipment.includes('חדר כושר מלא');
            const hasDumbbells = availableEquipment.includes('משקולות חופשיות (דמבלים/קטלבלים)') || hasGym;
            const hasTRX = availableEquipment.includes('TRX / רצועות התנגדות');
            const hasPullupBar = availableEquipment.includes('מתח, מקבילים');
            const bodyweightOnly = availableEquipment.includes('משקל גוף בלבד') && !hasDumbbells && !hasGym;
            
            let exercises = [];
            
            // Define exercises by muscle group and equipment
            const exerciseLibrary = {
                'חזה': {
                    gym: [
                        { name: 'בשכיבה לחיצת חזה עם מוט (Flat Bench Press)', sets: 4, reps: '8-10', rest: 120, notes: 'אחיזה מעבר לרוחב כתפיים. הורדה לקו הפטמות' },
                        { name: 'בשכיבה משופעת לחיצת חזה עם מוט (Incline Bench Press)', sets: 3, reps: '10-12', rest: 90, notes: 'שיפוע 30 מעלות. הורדה מתחת לעצם הבריח' },
                        { name: 'בשכיבה בשיפוע שלילי לחיצת חזה עם מוט (Decline Bench Press)', sets: 3, reps: '10-12', rest: 90, notes: 'סיבים תחתונים. הורדה לחלק התחתון של החזה' },
                        { name: 'פתיחות (פליי) בכבל קרוס (Cable Flys)', sets: 3, reps: '12-15', rest: 60, notes: 'מתיחה מקסימלית. מרפקים בכפיפה קלה' },
                        { name: 'דיפס לחזה רחב (Wide Grip Dips)', sets: 3, reps: '8-12', rest: 90, notes: 'נטייה קדימה. מרפקים החוצה' }
                    ],
                    dumbbells: [
                        { name: 'בשכיבה לחיצת חזה עם דמבלים (Dumbbell Bench Press)', sets: 4, reps: '10-12', rest: 90, notes: 'הורדה מעגלית לצד הגוף. אמות אנכיות' },
                        { name: 'בשכיבה משופעת לחיצת חזה עם דמבלים (Incline Dumbbell Press)', sets: 3, reps: '10-12', rest: 90, notes: 'שיפוע 30 מעלות. סיבים עליונים' },
                        { name: 'בשכיבה פתיחות עם דמבלים (Flat Dumbbell Flys)', sets: 3, reps: '12-15', rest: 60, notes: 'כפיפה קלה במרפקים. זרוע מקבילה לקרקע' },
                        { name: 'בשכיבה משופעת פתיחות (Incline Dumbbell Flys)', sets: 3, reps: '12-15', rest: 60, notes: 'סיבים עליונים. מרפקים בקו הכתף' }
                    ],
                    trx: [
                        { name: 'TRX לחיצת חזה (Chest Press)', sets: 4, reps: '12-15', rest: 90, notes: 'גב לרצועות - מצוין לייצוב' },
                        { name: 'TRX לחיצת חזה ביד אחת', sets: 3, reps: '10 לכל יד', rest: 90, notes: 'מתקדם - דורש יציבות גבוהה' },
                        { name: 'TRX פרפר (Flys)', sets: 3, reps: '12-15', rest: 60, notes: 'גב לרצועות - מתיחת חזה' }
                    ],
                    bodyweight: [
                        { name: 'שכיבות סמיכה (Push-ups)', sets: 4, reps: '15-20', rest: 60, notes: 'וריאציות: רגולר, רחב, צמוד' },
                        { name: 'שכיבות סמיכה משופעות (Incline Push-ups)', sets: 3, reps: '15-20', rest: 60, notes: 'על משטח גבוה' },
                        { name: 'שכיבות סמיכה עם קפיצה (Plyometric Push-ups)', sets: 3, reps: '8-12', rest: 90, notes: 'למתקדמים - כוח נפיץ' },
                        { name: 'דיפס על מקבילים לחזה', sets: 3, reps: '10-15', rest: 90, notes: 'נטייה קדימה לדגש חזה' }
                    ]
                },
                'גב': {
                    gym: [
                        { name: 'בישיבה משיכת פולי עליון באחיזה רחבה (Wide Grip Lat Pulldown)', sets: 4, reps: '8-10', rest: 120, notes: 'אחיזה רחבה. משיכה לכיוון הגוף' },
                        { name: 'בישיבה משיכת פולי עליון באחיזה צרה (Close Grip Lat Pulldown)', sets: 4, reps: '10-12', rest: 90, notes: 'ברוחב כתפיים. משיכה לעצם הבריח' },
                        { name: 'בישיבה חתירה במכונה (Seated Rowing Machine)', sets: 4, reps: '10-12', rest: 90, notes: 'תמיכה מלאה לחזה. ידיות אנכיות' },
                        { name: 'בישיבה חתירה בפולי תחתון (Seated Cable Row)', sets: 3, reps: '10-12', rest: 60, notes: 'משיכה לחלק התחתון של הבטן' },
                        { name: 'בהטיית גו חתירה עם מוט (Barbell Bent Over Row)', sets: 4, reps: '8-10', rest: 90, notes: 'הטיה 45 מעלות. משיכה לבטן התחתון' },
                        { name: 'דד-ליפט (Deadlift)', sets: 4, reps: '5-8', rest: 180, notes: 'מלך התרגילים. מוט קרוב לשוק' }
                    ],

                    { name: 'לאנג\'ים', sets: 3, reps: '12 לכל רגל', rest: 60, notes: 'רגליים' },
                    { name: 'פלאנק', sets: 3, duration: '45 שניות', rest: 60, notes: 'ליבה' }
                ];
            }
            
            if (level === 'מתקדם') {
                if (hasGym || hasDumbbells) {
                    exercises.push(
                        { name: 'דד-ליפט', sets: 4, reps: '8', rest: 120, notes: 'כל הגוף' },
                        { name: 'שכיבות סמיכה צמודות', sets: 3, reps: '12', rest: 60, notes: 'טריצפס וחזה' }
                    );
                }
            }
            
            const avgTimePerExercise = 7;
            const maxExercises = Math.floor(parseInt(workoutDuration) / avgTimePerExercise);
            return exercises.slice(0, maxExercises);
        };

        const generateCardioWorkout = (goals, level, multiplier, cardioTarget = {}, week, workoutDuration = 60) => {
            // Check if this is a running-focused program
            const isRunningProgram = goals.includes('שיפור יכולת אירובית') && cardioTarget.runningLevel;
            
            if (isRunningProgram) {
                return generateRunningWorkout(cardioTarget, week, workoutDuration, goals);
            }
            
            // General cardio workout (non-running focused)
            const cardioDuration = parseInt(workoutDuration);
            let intensity;
            if (level === 'מתחיל') {
                intensity = 'קל-בינוני';
            } else if (level === 'בינוני') {
                intensity = 'בינוני';
            } else {
                intensity = 'בינוני-גבוה';
            }

            const cardioOptions = ['ריצה', 'אופניים', 'שחייה', 'קפיצות חבל', 'אליפטיקל'];
            let selectedCardio = cardioOptions[Math.floor(Math.random() * cardioOptions.length)];
            let notes = goals.includes('ירידה במשקל') 
                ? 'שמור על קצב קבוע, דופק 60-70% מהמקסימום'
                : 'התמקד בסיבולת, דופק 70-80% מהמקסימום';

            const exercises = [
                {
                    name: selectedCardio,
                    duration: `${cardioDuration} דקות`,
                    intensity: intensity,
                    notes: notes
                }
            ];

            if (goals.includes('שיפור יכולת אירובית') && cardioDuration >= 45) {
                exercises.push({
                    name: 'תרגילי כוח קצרים (סיום האימון)',
                    sets: 2,
                    reps: '15-20',
                    rest: 30,
                    notes: 'בחר 3-4 תרגילים: שכיבות סמיכה, סקוואט, פלאנק, לאנג\'ים - כל תרגיל 15-20 חזרות'
                });
            }

            return exercises;
        };

        // Advanced Running Workout Generator based on BC Running methodology
        const generateRunningWorkout = (cardioTarget, week, workoutDuration, goals) => {
            const { runningLevel, raceGoal, weeklyMileage } = cardioTarget;
            const duration = parseInt(workoutDuration);
            
            // Determine workout type based on week pattern (following BC Running principles)
            // Week pattern: Long Run, Easy Run, Quality/Interval, Progression/Tempo
            const workoutPattern = week % 4;
            
            if (runningLevel === 'beginner') {
                // Walk-to-Run program based on uploaded document
                return generateWalkToRunWorkout(week, duration);
            } else if (runningLevel === 'intermediate' || runningLevel === 'advanced') {
                // Advanced running programs based on BC Running methodology
                return generateAdvancedRunningWorkout(workoutPattern, duration, runningLevel, raceGoal, week);
            }
            
            // Fallback to basic cardio
            return [{
                name: 'ריצה קלה',
                duration: `${duration} דקות`,
                intensity: 'קצב שיחה - אירובי',
                notes: 'ריצה בקצב שבו אפשר לנהל שיחה. התמקד בטכניקה ונשימה.'
            }];
        };

        // Walk-to-Run Program (based on uploaded document)
        const generateWalkToRunWorkout = (week, duration) => {
            // Progressive walk-run intervals based on the uploaded 48-week program
            const programs = [
                // Weeks 1-2
                { week: 1, intervals: 5, run: '30 שניות', walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה' },
                { week: 2, intervals: 7, run: '30 שניות', walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה' },
                // Weeks 3-6
                { week: 3, intervals: 4, run: '30 שניות', walk: '2.5 דקות', warmup: '2 דקות ריצה + דקה הליכה', cooldown: '5 דקות' },
                { week: 4, intervals: 6, run: '40 שניות', walk: '2:20 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות' },
                { week: 5, intervals: 9, run: '40 שניות', walk: '2:20 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות' },
                { week: 6, intervals: 5, run: '40 שניות', walk: '2:20 דקות', warmup: '3 דקות ריצה + דקה הליכה', cooldown: '5 דקות' },
                // Weeks 7-12
                { week: 7, intervals: 5, run: '1:20 דקות', walk: '2:40 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות' },
                { week: 8, intervals: 6, run: '1:20 דקות', walk: '2:40 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות' },
                { week: 9, intervals: 4, run: '1:20 דקות', walk: '2:40 דקות', warmup: 'דקה ריצה + דקה הליכה', cooldown: '5 דקות' },
                { week: 10, intervals: 7, run: 'דקה', walk: '2 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות' },
                { week: 11, intervals: 10, run: 'דקה', walk: '2 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות' },
                { week: 12, intervals: 5, run: 'דקה', walk: '2 דקות', warmup: '5 דקות ריצה + דקה הליכה', cooldown: '5 דקות' },
            ];
            
            // Select appropriate week (cycle through if beyond 12 weeks)
            const programWeek = ((week - 1) % 12) + 1;
            const program = programs.find(p => p.week === programWeek) || programs[0];
            
            return [{
                name: `תוכנית מהליכה לריצה - שבוע ${programWeek}`,
                duration: `כ-${duration} דקות`,
                warmup: program.warmup,
                main: `${program.intervals} פעמים: ${program.run} ריצה קלילה, ${program.walk} הליכה`,
                cooldown: program.cooldown,
                notes: 'עקרון ההדרגתיות הוא המפתח. אל תמהר, תן לגוף להסתגל. הריצה צריכה להיות קלילה ונוחה.'
            }];
        };

        // Advanced Running Workout based on BC Running methodology
        const generateAdvancedRunningWorkout = (workoutPattern, duration, level, raceGoal, week) => {
            const isAdvanced = level === 'advanced';
            
            switch(workoutPattern) {
                case 0: // Long Run (following BC Running principles)
                    return generateLongRun(duration, level, raceGoal);
                    
                case 1: // Easy Run with Strides
                    return generateEasyRunWithStrides(duration, level);
                    
                case 2: // Quality/Interval Workout (Fartlek style from BC Running)
                    return generateFartlekWorkout(duration, level, week);
                    
                case 3: // Progression Run
                    return generateProgressionRun(duration, level);
                    
                default:
                    return generateEasyRunWithStrides(duration, level);
            }
        };

        // Long Run - based on BC Running methodology
        const generateLongRun = (duration, level, raceGoal) => {
            const notes = level === 'advanced' 
                ? 'ריצה ארוכה וקלה בטווח האירובי. התחל איטי. ביום טוב - הגברה מתונה בשליש האחרון. המטרה: בניית סיבולת והתמדה.'
                : 'ריצה ארוכה בקצב נוח. צריך להיות מסוגל לנהל שיחה לאורך כל הריצה. קח מים אם צריך.';
            
            return [{
                name: 'ריצה ארוכה (Long Run)',
                duration: `${duration} דקות`,
                pace: 'קצב אירובי נוח (60-70% מקסימום)',
                structure: level === 'advanced' 
                    ? 'שליש ראשון: איטי, שליש שני: קצב יציב, שליש אחרון: הגברה מתונה (אופציונלי)'
                    : 'קצב קבוע ונוח לאורך כל הריצה',
                notes: notes,
                tips: 'עקרון "ארוכה ארוכה אבל כמה ארוכה?" - אל תגזים! צריך לסיים בהרגשה טובה.'
            }];
        };

        // Easy Run with Strides - BC Running style
        const generateEasyRunWithStrides = (duration, level) => {
            const mainDuration = duration - 10;
            return [{
                name: 'ריצה קלה עם מתגברות',
                warmup: `${mainDuration} דקות ריצה קלה`,
                pace: 'קצב שיחה - בקצב שבו ניתן לנהל שיחה',
                strides: '4-6 מתגברות של 80-100 מטר',
                notes: 'בסוף הריצה הקלה: מתגברות במישור עם רוח בגב. הליכה חזרה בין המתגברות. המתגברות משפרות את הטכניקה והכלכליות.',
                tips: 'המתגברות הן לא ספרינט! זה תאוצה הדרגתית עד ל-90% ממהירות מקסימלית.'
            }];
        };

        // Fartlek Workout - based on BC Running and Nachshon Shochat methodology
        const generateFartlekWorkout = (duration, level, week) => {
            const weekInCycle = (week % 3) + 1;
            
            const fartlekVariations = [
                {
                    name: 'פרטלק קצר ומהיר',
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות',
                    main: '8-12 פעמים: 60 שניות מהר, 60 שניות לאט',
                    cooldown: '10 דקות ריצה קלה',
                    notes: 'קצב קבוע לאורך האימון. אל תפתח מהר מדי! ה"מהר" זה קצב 10K, ה"לאט" זה ג\'וג קל.',
                    intensity: 'גבוהה'
                },
                {
                    name: 'פרטלק בינוני',
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות',
                    main: '6-8 פעמים: 3 דקות מהיר-בינוני, 3 דקות קל',
                    cooldown: '10 דקות ריצה קלה',
                    notes: 'קצב "מהיר-בינוני" זה קצב חצי מרתון בקירוב. ניתן לקיים במאמץ לאורך כל החזרות.',
                    intensity: 'בינונית-גבוהה'
                },
                {
                    name: 'פרטלק פירמידה',
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות',
                    main: '2 דקות - 4 דקות - 6 דקות - 4 דקות - 2 דקות (מהר), 2-3 דקות ג\'וג קל ביניהם. סיום: 4×30 שניות מהר, 60 שניות ג\'וג',
                    cooldown: '10 דקות ריצה קלה',
                    notes: 'פרטלק מגוון ומהנה. הפירמידה מאפשרת עבודה על טווחי קצב שונים.',
                    intensity: 'גבוהה-מאוד גבוהה'
                }
            ];
            
            return [fartlekVariations[weekInCycle - 1]];
        };

        // Progression Run - BC Running methodology
        const generateProgressionRun = (duration, level) => {
            return [{
                name: 'פרוגרשן ראן (Progression Run)',
                structure: 'התחל בריצה קלה, הגבר הדרגתית כל 5-10 דקות',
                duration: `${duration} דקות`,
                progression: level === 'advanced'
                    ? 'שליש ראשון: קצב אירובי קל → שליש שני: קצב מרתון → שליש אחרון: קצב חצי מרתון או מהר יותר'
                    : 'התחל בקצב נוח, סיים בקצב שעדיין מאתגר אבל נשלט',
                notes: 'הלוך בריצה קלה, חזור בהגברה הדרגתית. בקילומטר האחרון - תן הכל! זהו אימון שמשלב סיבולת ומהירות.',
                tips: 'הסוד הוא לא להתחיל מהר מדי. "רוצו את הלאט לאט יותר כדי לרוץ את המהר מהר יותר"'
            }];
        };

        // Main App
        function FitnessApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const traineeId = urlParams.get('trainee');

            if (traineeId) {
                return <TraineeView traineeId={traineeId} />;
            } else {
                return <TrainerApp />;
            }
        }

        // Trainer App
        function TrainerApp() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                const auth = sessionStorage.getItem('trainerAuth');
                if (auth === 'true') {
                    setIsAuthenticated(true);
                }
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === storage.TRAINER_PASSWORD) {
                    setIsAuthenticated(true);
                    sessionStorage.setItem('trainerAuth', 'true');
                    setError('');
                } else {
                    setError('סיסמה שגויה');
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">🔒</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">כניסת מאמן</h1>
                                <p className="text-gray-600">הזן סיסמה לגישה למערכת</p>
                            </div>
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="סיסמה"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>
                                {error && (
                                    <div className="text-red-600 text-sm text-center">{error}</div>
                                )}
                                <button
                                    type="submit"
                                    className="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-xl transition"
                                >
                                    כניסה
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return <TrainerDashboard />;
        }

        // Trainer Dashboard
        function TrainerDashboard() {
            const [trainees, setTrainees] = useState([]);
            const [showCreateForm, setShowCreateForm] = useState(false);
            const [selectedTrainee, setSelectedTrainee] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadTrainees();
            }, []);

            const loadTrainees = async () => {
                setLoading(true);
                const data = await storage.getTrainees();
                setTrainees(data);
                setLoading(false);
            };

            const refreshTrainees = async () => {
                await loadTrainees();
            };

            const handleLogout = () => {
                sessionStorage.removeItem('trainerAuth');
                window.location.reload();
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-2xl font-bold text-gray-700">טוען נתונים...</div>
                        </div>
                    </div>
                );
            }

            if (selectedTrainee) {
                return (
                    <TraineeDetailView 
                        trainee={selectedTrainee} 
                        onBack={() => {
                            setSelectedTrainee(null);
                            refreshTrainees();
                        }}
                    />
                );
            }

            if (showCreateForm) {
                return (
                    <CreateTraineePlan 
                        onBack={() => setShowCreateForm(false)}
                        onComplete={() => {
                            setShowCreateForm(false);
                            refreshTrainees();
                        }}
                    />
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold">דשבורד מאמן 🎯</h1>
                                <p className="text-purple-100 mt-1">ניהול מתאמנים ותוכניות אימון</p>
                            </div>
                            <button
                                onClick={handleLogout}
                                className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition"
                            >
                                התנתק
                            </button>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto p-6">
                        <div className="mb-6">
                            <button
                                onClick={() => setShowCreateForm(true)}
                                className="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg flex items-center gap-2"
                            >
                                <span className="text-xl">➕</span>
                                צור תוכנית למתאמן חדש
                            </button>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-2xl font-bold text-gray-800 mb-6">המתאמנים שלי ({trainees.length})</h2>
                            
                            {trainees.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <div className="text-6xl mb-4">📭</div>
                                    <p className="text-xl">אין עדיין מתאמנים במערכת</p>
                                    <p className="text-sm mt-2">לחץ על "צור תוכנית למתאמן חדש" כדי להתחיל</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {trainees.map(trainee => {
                                        const totalWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) => 
                                            sum + week.workouts.length, 0
                                        );
                                        const completedWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) => 
                                            sum + week.workouts.filter(w => w.completed).length, 0
                                        );
                                        const progress = Math.round((completedWorkouts / totalWorkouts) * 100);
                                        
                                        const hasNewFeedback = trainee.workoutPlan.weeks.some(week => 
                                            week.workouts.some(w => w.feedback && w.feedbackSentToTrainer && !w.feedbackRead)
                                        );

                                        return (
                                            <div
                                                key={trainee.id}
                                                onClick={() => setSelectedTrainee(trainee)}
                                                className="bg-gray-50 hover:bg-gray-100 p-6 rounded-xl transition-all cursor-pointer relative"
                                            >
                                                {hasNewFeedback && (
                                                    <div className="absolute top-3 left-3 w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                                                )}
                                                <div className="text-3xl mb-2">👤</div>
                                                <div className="font-bold text-gray-800 text-lg mb-1">{trainee.name}</div>
                                                <div className="text-sm text-gray-600 mb-3">
                                                    {trainee.email}
                                                </div>
                                                <div className="mb-2">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <div className="flex-1 bg-gray-200 rounded-full h-2">
                                                            <div
                                                                className="bg-purple-500 h-2 rounded-full"
                                                                style={{ width: `${progress}%` }}
                                                            />
                                                        </div>
                                                        <span className="text-sm font-semibold text-purple-600">{progress}%</span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Create Trainee Plan Form
        function CreateTraineePlan({ onBack, onComplete }) {
            const [step, setStep] = useState('form'); // 'form' or 'preview'
            const [generatedPlan, setGeneratedPlan] = useState(null);
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                age: '',
                gender: '',
                height: '',
                weight: '',
                activityLevel: '',
                workoutDuration: '', // in minutes
                goals: [],
                muscleGroups: [],
                availableEquipment: [], // equipment available for training
                // Running-specific fields
                runningLevel: '', // beginner, intermediate, advanced
                weeklyMileage: '', // current km per week
                raceGoal: '', // marathon, half-marathon, 10k, 5k, general fitness
                currentPace: '', // e.g., "5:30 per km"
                current5kTime: '',
                current10kTime: '',
                currentHalfTime: '',
                currentMarathonTime: '',
                injuryHistory: '',
                cardioTarget: {
                    hasDistanceGoal: false,
                    distance: '',
                    hasPaceGoal: false,
                    pace: ''
                }
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleGoalToggle = (goal) => {
                setFormData(prev => ({
                    ...prev,
                    goals: prev.goals.includes(goal)
                        ? prev.goals.filter(g => g !== goal)
                        : [...prev.goals, goal]
                }));
            };

            const handleMuscleGroupToggle = (group) => {
                setFormData(prev => ({
                    ...prev,
                    muscleGroups: prev.muscleGroups.includes(group)
                        ? prev.muscleGroups.filter(g => g !== group)
                        : [...prev.muscleGroups, group]
                }));
            };

            const handleCardioTargetChange = (field, value) => {
                setFormData(prev => ({
                    ...prev,
                    cardioTarget: {
                        ...prev.cardioTarget,
                        [field]: value
                    }
                }));
            };

            const handleSubmit = (e) => {

        // Trainee Detail View (for trainer)
        function TraineeDetailView({ trainee, onBack }) {
            const [selectedWeek, setSelectedWeek] = useState(0);
            const [showShareModal, setShowShareModal] = useState(false);
            const [emailBody, setEmailBody] = useState('');
            const [websiteUrl, setWebsiteUrl] = useState('');
            const [showUrlInput, setShowUrlInput] = useState(false);

            // Load saved website URL from localStorage on mount
            useEffect(() => {
                const savedUrl = localStorage.getItem('trainerWebsiteUrl');
                if (savedUrl) {
                    setWebsiteUrl(savedUrl);
                }
            }, []);

            // Save website URL to localStorage whenever it changes
            useEffect(() => {
                if (websiteUrl && websiteUrl.trim()) {
                    localStorage.setItem('trainerWebsiteUrl', websiteUrl.trim());
                }
            }, [websiteUrl]);

            const currentWeek = trainee.workoutPlan.weeks[selectedWeek];
            const totalWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) => 
                sum + week.workouts.length, 0
            );
            const completedWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) => 
                sum + week.workouts.filter(w => w.completed).length, 0
            );
            const progress = Math.round((completedWorkouts / totalWorkouts) * 100);

            // Generate trainee link - use custom URL if provided, otherwise use current location
            const getTraineeLink = () => {
                if (websiteUrl && websiteUrl.trim()) {
                    const url = websiteUrl.trim();
                    // Make sure URL starts with http:// or https://
                    const fullUrl = url.match(/^https?:\/\//) ? url : `https://${url}`;
                    // Add slash before query parameter
                    return `${fullUrl}/?trainee=${trainee.id}`;

                            {currentWeek.workouts.map((workout, index) => (
                                <div key={index} className="bg-white rounded-2xl shadow-lg p-6">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex items-center gap-4">
                                            <div className={`text-4xl ${workout.type === 'כוח' ? '🏋️' : '🏃'}`}></div>
                                            <div>
                                                <h3 className="text-xl font-bold text-gray-800">
                                                    יום {workout.day} - אימון {workout.type}
                                                </h3>
                                                {workout.completed && (
                                                    <span className="inline-block bg-green-100 text-green-800 text-sm px-3 py-1 rounded-full mt-1">
                                                        ✓ הושלם
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => handleWorkoutComplete(selectedWeek, index)}
                                                className={`px-4 py-2 rounded-lg font-semibold transition ${
                                                    workout.completed
                                                        ? 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                        : 'bg-green-500 text-white hover:bg-green-600'
                                                }`}
                                            >
                                                {workout.completed ? 'ביטול' : 'סיימתי'}
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setSelectedWorkout(workout);
                                                    setShowFeedbackModal(true);
                                                }}
                                                className="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg font-semibold hover:bg-purple-200 transition"
                                            >
                                                פידבק
                                            </button>
                                        </div>
                                    </div>

                                    {/* Exercises */}
                                    <div className="space-y-3">
                                        {workout.exercises.map((exercise, exIndex) => (
                                            <div key={exIndex} className="bg-gray-50 p-4 rounded-lg">
                                                <div className="font-semibold text-gray-800 mb-2">{exercise.name}</div>
                                                <div className="text-gray-600 text-sm space-y-1">
                                                    {exercise.warmup && <div><strong>חימום:</strong> {exercise.warmup}</div>}
                                                    {exercise.main && <div><strong>עיקרי:</strong> {exercise.main}</div>}
                                                    {exercise.structure && <div><strong>מבנה:</strong> {exercise.structure}</div>}
                                                    {exercise.progression && <div><strong>התקדמות:</strong> {exercise.progression}</div>}
                                                    {exercise.strides && <div><strong>מתגברות:</strong> {exercise.strides}</div>}
                                                    {exercise.cooldown && <div><strong>התאוששות:</strong> {exercise.cooldown}</div>}
                                                    {exercise.pace && <div><strong>קצב:</strong> {exercise.pace}</div>}
                                                    {exercise.intensity && <div><strong>עצימות:</strong> {exercise.intensity}</div>}
                                                    {exercise.sets && <div>סטים: {exercise.sets}</div>}
                                                    {exercise.reps && <div>חזרות: {exercise.reps}</div>}
                                                    {exercise.duration && <div>משך: {exercise.duration}</div>}
                                                    {exercise.rest && <div>מנוחה: {exercise.rest} שניות</div>}
                                                    {exercise.recommendedWeight && (
                                                        <div className="bg-green-100 p-2 rounded mt-2 border border-green-300">
                                                            <strong className="text-green-800">💪 משקל מומלץ: {exercise.recommendedWeight}</strong>
                                                        </div>
                                                    )}
                                                    {exercise.weightNote && (
                                                        <div className="text-green-700 text-xs mt-1">
                                                            📊 {exercise.weightNote}
                                                        </div>
                                                    )}
                                                    {exercise.notes && <div className="text-purple-600 mt-2">💡 {exercise.notes}</div>}
                                                    {exercise.tips && <div className="text-blue-600 mt-2">✨ {exercise.tips}</div>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {workout.difficulty && (
                                        <div className="mt-4 p-4 bg-blue-50 rounded-lg">
                                            <div className="font-semibold text-blue-900 mb-1">הפידבק שלך:</div>
                                            <div className="text-blue-800">רמת קושי: {workout.difficulty}</div>
                                            {workout.feedback && <div className="text-blue-700 mt-1">{workout.feedback}</div>}
                                            {workout.feedbackSentToTrainer && (
                                                <div className="text-green-600 text-sm mt-2">✓ נשלח למאמן</div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    {showFeedbackModal && (
                        <FeedbackModal
                            workout={selectedWorkout}
                            onClose={() => {
                                setShowFeedbackModal(false);
                                setSelectedWorkout(null);
                            }}
                            onSubmit={handleFeedbackSubmit}
                        />
                    )}
                </div>
            );
        }

        // Feedback Modal
        function FeedbackModal({ workout, onClose, onSubmit }) {
            const [difficulty, setDifficulty] = useState(workout.difficulty || '');
            const [feedback, setFeedback] = useState(workout.feedback || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(difficulty, feedback);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                        <h3 className="text-2xl font-bold text-gray-800 mb-4">פידבק על האימון</h3>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 font-semibold mb-2">רמת קושי</label>
                                <div className="space-y-2">
                                    {['קל מדי', 'מתאים', 'קשה מדי'].map(level => (
                                        <label key={level} className="flex items-center gap-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                            <input
                                                type="radio"
                                                name="difficulty"
                                                value={level}
                                                checked={difficulty === level}
                                                onChange={(e) => setDifficulty(e.target.value)}
                                                required
                                                className="w-5 h-5 text-purple-600"
                                            />
                                            <span className="text-gray-700">{level}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-gray-700 font-semibold mb-2">הערות למאמן (אופציונלי)</label>
                                <textarea
                                    value={feedback}
                                    onChange={(e) => setFeedback(e.target.value)}
                                    rows="4"
                                    placeholder="איך היה האימון? יש משהו שתרצה לשתף?"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>

                            <div className="flex gap-3">
                                <button
                                    type="submit"
                                    className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition"
                                >
                                    שלח למאמן
                                </button>
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-xl transition"
                                >
                                    ביטול
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<FitnessApp />, document.getElementById('root'));
    </script>
</body>
</html>
