        const getCooldownBlock = () => [
            { name: '━━━ 🧘 מתיחות לשחרור (10-15 דקות) ━━━', sets: 0, reps: '', rest: 0, notes: 'בצע בסיום האימון — מוריד דופק בהדרגה ומשחרר שרירים עייפים' },
            { name: 'מתיחות סטטיות לשחרור', duration: '10-15 דקות', notes: '30-45 שניות כל מתיחה: המסטרינג | גלוטס | פריפורמיס | קואדריצפס | היפ פלקסור (Couch Stretch) | שרירי חזה ואמות | כתפיים | גב עליון | Child\'s Pose | Cat-Cow | Pigeon Pose' },
        ];

        // Maps current continuous running ability (minutes) to starting week in the walk-to-run program
        const getWalkToRunStartWeek = (continuousMinutes) => {
            if (continuousMinutes >= 30) return 16;
            if (continuousMinutes >= 18) return 15;
            if (continuousMinutes >= 12) return 14;
            if (continuousMinutes >= 8)  return 13;
            if (continuousMinutes >= 6)  return 12;
            if (continuousMinutes >= 5)  return 11;
            if (continuousMinutes >= 4)  return 10;
            if (continuousMinutes >= 3)  return 9;
            if (continuousMinutes >= 2)  return 7;
            if (continuousMinutes >= 1)  return 4;
            return 1;
        };

        // Walk-to-Run Program - Full 48-session plan (based on uploaded תוכנית מהליכה לריצה)
        // 3 sessions/week = 16 weeks total
        const generateWalkToRunWorkout = (week, duration) => {
            // Full 48-session program mapped to weeks (3 sessions/week)
            // Each entry covers one "phase" of training weeks
            const programs = [
                // Phase 1 - Weeks 1-3 (Sessions 1-9): 30s run / 2.5 min walk
                { week: 1,  intervals: 5,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה', phase: '1' },
                { week: 2,  intervals: 7,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה', phase: '1' },
                { week: 3,  intervals: 9,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '1' },
                // Phase 2 - Weeks 4-6 (Sessions 10-18): 1 min run / 2 min walk
                { week: 4,  intervals: 5,  run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '2' },
                { week: 5,  intervals: 7,  run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '2' },
                { week: 6,  intervals: 10, run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '2' },
                // Phase 3 - Weeks 7-9 (Sessions 19-27): 2-3 min run / 2 min walk
                { week: 7,  intervals: 4,  run: '2 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '3' },
                { week: 8,  intervals: 5,  run: '2.5 דקות',   walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '3' },
                { week: 9,  intervals: 6,  run: '3 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '3' },
                // Phase 4 - Weeks 10-12 (Sessions 28-36): 4-6 min run / 2 min walk
                { week: 10, intervals: 4,  run: '4 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '4' },
                { week: 11, intervals: 4,  run: '5 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '4' },
                { week: 12, intervals: 4,  run: '6 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '4' },
                // Phase 5 - Weeks 13-16 (Sessions 37-48): 7-20 min → continuous
                { week: 13, intervals: 3,  run: '8 דקות',     walk: 'דקה',      warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '5' },
                { week: 14, intervals: 2,  run: '12 דקות',    walk: 'דקה',      warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '5' },
                { week: 15, intervals: 2,  run: '18 דקות',    walk: 'דקה',      warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '5' },
                { week: 16, intervals: 1,  run: '30-40 דקות', walk: '',          warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '6' },
            ];

            const programWeek = Math.min(week, 16);
            const program = programs.find(p => p.week === programWeek) || programs[programWeek - 1] || programs[programs.length - 1];
            const warmupFull = getRunningWarmup();

            const mainText = program.phase === '6'
                ? `ריצה רציפה של ${program.run} בקצב נוח`
                : `${program.intervals} × (${program.run} ריצה קלילה + ${program.walk} הליכה)`;

            return [{
                name: `מהליכה לריצה - שבוע ${programWeek} (שלב ${program.phase}/6)`,
                duration: `כ-${duration} דקות`,
                warmup: warmupFull,
                main: mainText,
                cooldown: '5 דקות הליכה + מתיחות סטטיות: שוק, ירך קדמית, ירך אחורית',
                notes: program.phase === '6'
                    ? 'ריצה רציפה! הגעת לשלב האחרון. BC Running: "הדרגתיות ועקביות לאורך 16 שבועות - זה המפתח". ריצה בקצב שבו ניתן לנהל שיחה.'
                    : 'BC Running: "הדרגתיות, מתינות, עבודה עם הגוף". אל תמהר. הריצה צריכה להיות קלילה ונוחה - "קצב שיחה". עקביות > עצימות.',
                tips: 'אם האימון קשה מדי - חזור שבוע אחד אחורה. אם קל מדי - קדם שבוע קדימה. BC Running: "האומץ להאט הוא הצעד הראשון לרוץ מהר יותר".'
            }];
        };

        // Advanced Running Workout - BC Running (מועדון ארוחת הבוקר) methodology
        // Based on Nachshon Shochat + Lydiard periodization
        // 4-week cycle: Long Run → Easy+Strides → Fartlek → Tempo/Progression/Test
        // Phase-aware: base = more easy, build = fartlek, peak = tempo+intervals, taper = short
        const generateAdvancedRunningWorkout = (weekInCycle, duration, level, raceGoal, week, paceZones, phase = { key: 'base' }, totalWeeks = 12, runningSessionIdx = 0) => {
            const phaseKey = phase ? phase.key : 'base';

            // Secondary runs in the week → vary by session index:
            // idx=1: easy recovery | idx=2: progression (secondary quality) | idx=3+: easy again
            if (runningSessionIdx === 1) {
                return generateEasyRunWithStrides(Math.round(duration * 0.85), level);
            }
            if (runningSessionIdx === 2) {
                return generateProgressionRun(Math.round(duration * 0.90), level);
            }
            if (runningSessionIdx > 2) {
                return generateEasyRunWithStrides(Math.round(duration * 0.80), level);
            }

            // Every 8th week: 5K time trial
            const is5KTestWeek = (week % 8 === 0);

            // Taper phase: all workouts become short easy runs or light quality
            if (phaseKey === 'taper') {
                const taperDuration = Math.round(duration * 0.75);
                if (weekInCycle === 1) return generateEasyRunWithStrides(taperDuration, level);
                if (weekInCycle === 2) return generateEasyRunWithStrides(taperDuration, level);
                if (weekInCycle === 3) return generateFartlekWorkout(taperDuration, level, week); // light fartlek to stay sharp
                return generateProgressionRun(taperDuration, level); // short progression
            }

            // Long run gets 50-70% more time than the base easy run
            const longRunDur = Math.round(duration * (level === 'advanced' ? 1.7 : 1.5));

            // Base phase: emphasize aerobic base, minimal quality
            if (phaseKey === 'base') {
                if (weekInCycle === 1) return generateLongRun(longRunDur, level, raceGoal, paceZones);
                if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
                if (weekInCycle === 3) return generateEasyRunWithStrides(duration, level); // extra easy in base
                return generateProgressionRun(duration, level); // gentle quality
            }

            // Build phase: introduce fartlek and tempo
            if (phaseKey === 'build') {
                if (weekInCycle === 1) return generateLongRun(longRunDur, level, raceGoal, paceZones);
                if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
                if (weekInCycle === 3) return generateFartlekWorkout(duration, level, week);
                if (is5KTestWeek) return generate5KTestWorkout(duration, level);
                return generateTempoRun(duration, level, week, paceZones);
            }

            // Peak phase: full quality mix - all workout types
            // weekInCycle: 1=Long, 2=Easy+Strides, 3=Fartlek, 4=Tempo or Test
            if (weekInCycle === 1) return generateLongRun(longRunDur, level, raceGoal, paceZones);
            if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
            if (weekInCycle === 3) return generateFartlekWorkout(duration, level, week);
            if (is5KTestWeek) return generate5KTestWorkout(duration, level);
            return generateTempoRun(duration, level, week, paceZones);
        };

        // Long Run - BC Running methodology: aerobic base, "courage to slow down"
        // Nachshon Shochat: easy with gentle pickup in final third
        const generateLongRun = (duration, level, raceGoal, paceZones = null) => {
            const easyPace = paceZones ? `קצב קל: ${paceZones.easy} לק"מ` : 'קצב שיחה מלא (60-70% דופק מקסימום)';
            // Running time = total duration minus ~10 min warmup walking/dynamic
            const runTime = Math.max(20, duration - 10);
            const t1 = Math.round(runTime * 0.33);
            const t2 = Math.round(runTime * 0.34);
            const t3 = runTime - t1 - t2;
            // Calculate distance from actual pace, not hardcoded
            const distKm = calcRunDistKm(runTime, paceZones, level);
            const targetDist = `${Math.floor(distKm * 0.9)}-${Math.ceil(distKm * 1.1)} ק"מ`;
            return [{
                name: 'ריצה ארוכה (Long Run) - עמוד התווך',
                duration: `${duration} דקות (ריצה: ${runTime} דקות + חימום/צינון)`,
                warmup: getRunningWarmup(),
                structure: `${t1} דקות: קל מאוד (Zone 1 — קצב שיחה מלא) | ${t2} דקות: אירובי יציב (Zone 2) | ${t3} דקות: הגברה מתונה`,
                pace: easyPace + ` | יעד מרחק: ${targetDist}`,
                cooldown: '5-7 דקות הליכה + מתיחות סטטיות',
                notes: level === 'advanced'
                    ? 'BC Running: הריצה הארוכה בונה את הבסיס האירובי - ה"בנק" של VO2max, שריפת שומן, סיבולת נפשית. לא ריצת מהירות. סיים בהרגשה שאפשר המשיך.'
                    : 'BC Running: "האומץ להאט" - כדי לרוץ מהר יותר, קודם ללמוד לרוץ לאט יותר. קצב שיחה מלא.',
                tips: 'נחשון שוחט: "רוץ את הארוכה לאט יותר ממה שאתה חושב שצריך". הדרגתיות + עקביות = שיפור לאורך זמן.'
            }];
        };

        // Easy Run with Strides - Nachshon Shochat + BC Running methodology
        // BC Running: strides 3-4x/week, including in warmup for quality sessions
        // מתגברות = short accelerations to improve stride mechanics and running economy
        const generateEasyRunWithStrides = (duration, level) => {
            const mainDuration = Math.max(25, duration - 10);
            const stridesCount = level === 'advanced' ? '5-6' : '4-5';
            return [{
                name: 'ריצה קלה עם מתגברות (Easy Run + Strides)',
                duration: `${duration} דקות (40-60 דקות אידיאלי)`,
                warmup: getRunningWarmup(),
                main: `${mainDuration} דקות ריצה קלה בקצב שיחה מלא (Zone 1-2)`,
                strides: `${stridesCount} מתגברות של 80-100 מטר: תאוצה הדרגתית עד 90% מהירות → 3 שניות בשיא → הגברה לאט, הליכה חזרה (90 שניות) בין כל מתגברת`,
                cooldown: '5 דקות ריצה קלה מאוד + מתיחות סטטיות',
                notes: 'BC Running: מתגברות 3-4 פעמים בשבוע (כולל בחימום לאימוני איכות). הן משפרות מכניקת צעד, כלכליות ריצה וקשר עצבי-שרירי. ריצה קלה = קצב שיחה מלא לאורך כל האימון.',
                tips: 'המתגברות אינן ספרינט! תאוצה חלקה ונוחה - כמו מטוס שממריא. הגוף לא מכנס אנרגיה אנאירובית. בשטח שטוח עם רוח גב אם אפשר.'
            }];
        };

        // Fartlek - BC Running methodology: creative, free, not on a track
        // BC Running: "פרטלק הוא אימון גמיש ויצירתי, רחוק ממלבן המסלול"
        // Combines aerobic + anaerobic, race simulations, hills, sudden bursts
        // Nachshon Shochat 3-week progression: Short → Medium → Pyramid
        const generateFartlekWorkout = (duration, level, week) => {
            const weekInCycle = ((week - 1) % 3) + 1; // 1, 2, or 3

            const fartlekVariations = [
                {
                    name: 'פרטלק קצר - "משחק מהירות" (Short Fartlek)',
                    duration: `${duration} דקות`,
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות של 80מ\' (חלק מהחימום לאימוני איכות - BC Running)',
                    main: level === 'advanced'
                        ? '10-12 × (60 שניות מהיר / 60 שניות ג\'וג קל) - עדיף בשטח טבעי, לא מסלול!'
                        : '8-10 × (60 שניות מהיר / 60 שניות ג\'וג קל) - גבעות, שבילים, פארק',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: "פרטלק = שחרור יצירתי ומהנה". ה"מהיר" = קצב 5K (מאתגר אך לא מקסימלי). ה"קל" = ג\'וג קל שמאפשר שיחה. שמור על קצב קבוע מהחזרה הראשונה לאחרונה.',
                    intensity: 'גבוהה - VO2max',
                    tips: 'BC Running: אל תגיע למסלול! שטח טבעי, גבעות, שבילים - הם הזירה הטבעית של הפרטלק. עיקרון: "train, don\'t strain".'
                },
                {
                    name: 'פרטלק בינוני - סף לקטט (Medium Fartlek)',
                    duration: `${duration} דקות`,
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות',
                    main: level === 'advanced'
                        ? '6-8 × (3 דקות מהיר-בינוני / 3 דקות קל) - שנה כיוון, כלול גבעות, הפתע את עצמך'
                        : '5-6 × (3 דקות מהיר-בינוני / 3 דקות קל) - קצב חצי מרתון',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: ה"מהיר-בינוני" = קצב 10K-חצי מרתון (ניתן לשמירה לאורך 3 דקות בכל חזרה). זה אזור הסף הלקטי - ה"מנוע" שמשפר את הריצה לאורך זמן.',
                    intensity: 'בינונית-גבוהה - Lactate Threshold',
                    tips: 'פרטלק = "משחק מהירות" שוודי. גמיש ומהנה. ניתן לשנות על פי תחושה ביום - זו חוזקתו.'
                },
                {
                    name: 'פרטלק פירמידה + ספרינטים (Pyramid Fartlek)',
                    duration: `${duration} דקות`,
                    warmup: '15-20 דקות ריצה קלה + 4-5 מתגברות',
                    main: 'פירמידה: 2→4→6→4→2 דקות (מהיר), 2-3 דקות ג\'וג קל בין כל פרק. סיום: 4×30 שניות ספרינט (א-לקטי) / 60 שניות ג\'וג',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: הפירמידה עובדת על כל טווחי הקצב. הקצב ב-2 דקות מהיר מב-6 דקות. הספרינטים הקצרים בסוף (≤30 שניות במאמץ מירבי) = אימון "א-לקטי" שמשפר מהירות טהורה לפי שיטת לידיארד.',
                    intensity: 'גבוהה-מאוד גבוהה',
                    tips: 'BC Running: שמור את הספרינטים "בטנק". הם קצרים (עד 10-30 שניות) ומירביים. זו הדרך לשפר מהירות טהורה - לא חזרות 400מ\' ארוכות!'
                }
            ];

            return [fartlekVariations[weekInCycle - 1]];
        };

        // Tempo Run - BC Running: LT training based on Pfitzinger / BC Running methodology
        // BC Running: 3-5km warmup then 6-11km tempo at LT pace; strong VO2max stimulus
        // "גירוי חזק לשיפור קצב סף חומצת החלב" (BC Running on tempo runs)
        const generateTempoRun = (duration, level, week, paceZones = null) => {
            const warmupKm = level === 'advanced' ? '3-5 ק"מ' : '2-3 ק"מ';
            const tempoKm = level === 'advanced' ? '8-12 ק"מ' : '5-8 ק"מ';
            const tempoMin = Math.round(duration * 0.6);
            const tempoPaceStr = paceZones
                ? `קצב טמפו: ${paceZones.medium} לק"מ (אחרי חימום ${warmupKm})`
                : `קצב 10K + 20-30 שניות לק"מ | "נוח-קשה" | ניתן לדבר מילים בודדות`;
            return [{
                name: 'ריצת טמפו (Tempo Run) - סף לקטט',
                duration: `${duration} דקות`,
                warmup: `${warmupKm} ריצה קלה + ` + getRunningWarmup() + ' + 3-4 מתגברות',
                main: `${tempoMin} דקות / ${tempoKm} | ${tempoPaceStr}`,
                cooldown: '10-15 דקות ריצה קלה מאוד + מתיחות ארוכות',
                notes: 'BC Running: קצב טמפו = "נוח-קשה". דופק 80-90% מקסימום. ניתן לדבר מילים בודדות אבל לא משפטים. זהו אימון סף הלקטי - מגביר את היכולת לרוץ מהר יותר עם פחות חומצת חלב.',
                tips: 'לא מהיר מדי! קצב טמפו ≠ קצב 5K. BC Running: "אינטרוולים עצימים מוגזמים פוגעים ברצי ארוכות - הטמפו הוא הנשק הסודי".'
            }];
        };

        // Progression Run - Nachshon Shochat Run #4 + BC Running "negatively split"
        // BC Running: "easy out, fast back" - builds mental strength and race pacing
        const generateProgressionRun = (duration, level) => {
            const half = Math.round(duration / 2);
            return [{
                name: 'ריצת פרוגרסיה (Negative Split / Progression Run)',
                duration: `${duration} דקות`,
                warmup: getRunningWarmup(),
                structure: level === 'advanced'
                    ? `${Math.round(duration * 0.35)} דקות קל (Zone 1-2) → ${Math.round(duration * 0.35)} דקות קצב מרתון (Zone 3) → ${Math.round(duration * 0.25)} דקות קצב חצי מרתון (Zone 4) → ק"מ אחרון: כל מה שיש!`
                    : `מחצית ראשונה (${half} דקות): ריצה קלה בקצב שיחה (Zone 1-2) → מחצית שנייה: הגברה הדרגתית, דקות אחרונות: מאמץ גבוה (Zone 3-4)`,
                cooldown: '5-10 דקות הליכה + מתיחות סטטיות',
                notes: 'BC Running: "הלוך קל - חזור מהיר". הגברה הדרגתית מלמדת ניהול קצב (Pacing) - מיומנות קריטית במרתון. לא קפיצות פתאומיות - הדרגתיות!',
                tips: 'נחשון שוחט: "הסוד הוא לא להתחיל מהר מדי. הפיתוי הגדול ביותר הוא לצאת מהר מדי. כפה על עצמך להאט בהתחלה."'
            }];
        };

        // 5K Test/Time Trial - BC Running: "מבחן כושר" every 8 weeks
        // BC Running recommends tune-up races (10K) 3-5 weeks before marathon
        const generate5KTestWorkout = (duration, level) => {
            return [{
                name: '5K מבחן / מירוץ כושר (Tune-Up Race)',
                duration: `כ-35-45 דקות (כולל חימום וצינון)`,
                warmup: '2-3 ק"מ ריצה קלה + ' + getRunningWarmup() + ' + 4-5 מתגברות 80מ\'',
                main: 'ריצה מקסימלית של 5 ק"מ - מדוד את הזמן! יצא שלילי-ספליט (נגטיב ספליט).',
                cooldown: '10-15 דקות ריצה קלה מאוד + מתיחות ארוכות (10+ דקות)',
                notes: 'BC Running: מבחן כל 8 שבועות (לא ישן יותר מדי) לבדיקת התקדמות. הקצב ב-5K משמש כבסיס לחישוב כל קצבי האימון: טמפו, פרטלק, אינטרוולים. אם השתתפת במירוץ 10K - זה עדיף!',
                tips: 'לאחר המבחן: רשום את הזמן → עדכן קצבי אימון → שיפור של 10-30 שניות כל 8 שבועות = מעולה. BC Running: "מבחן + תחרות = מוטיבציה + כיוון ברור".'
            }];
        };

        // Run Less Run Faster (RLRF) - 3 key workouts methodology
        // BC Running perspective: fewer runs but each is quality ("train, don't strain")
        // Intervals (VO2max) + Tempo (LT) + Long Run
        const generateRLRFWorkout = (workoutType, duration, level, week) => {
            if (workoutType === 'intervals') {
                const weekInCycle = ((week - 1) % 4) + 1;
                // BC Running: 600-2000m intervals at 95-100% VO2max (3-5K race pace)
                const intervalSets = [
                    '6 × 400מ\' (קצב 5K) + 400מ\' ג\'וג קל בין חזרות',
                    '4 × 800מ\' (קצב 5K-10K) + 400מ\' ג\'וג',
                    '3 × 1200מ\' (קצב 10K) + 400מ\' ג\'וג',
                    '5 × 600מ\' (קצב 5K) + 300מ\' ג\'וג'
                ];
                return [{
                    name: 'ריצת אינטרוולים (RLRF Workout 1 / VO2max)',
                    warmup: '10-15 דקות ריצה קלה + מתיחות דינמיות + 4 מתגברות',
                    main: intervalSets[weekInCycle - 1],
                    cooldown: '10-15 דקות ריצה קלה',
                    notes: 'RLRF: 3 אימונים מרכזיים בשבוע = כל אחד חייב להיות איכותי. BC Running: אינטרוולים 600-2000מ\' ב-95-100% VO2max (קצב תחרות 3-5K). גירוי חזק לשיפור VO2max.',
                    tips: 'BC Running: "רבים מפריזים במינון ובתדירות של אינטרוולים עצימים עבור רצי ארוכות". RLRF פותר זאת: רק אימון אחד של אינטרוולים שבועי, אך הוא איכותי.'
                }];
            } else if (workoutType === 'tempo') {
                return [{
                    name: 'ריצת טמפו (RLRF Workout 2 / Lactate Threshold)',
                    warmup: '2-3 ק"מ ריצה קלה + מתגברות',
                    main: `${Math.round(duration * 0.6)} דקות / 6-11 ק"מ ריצת טמפו (קצב 10K + 20 שניות לק"מ)`,
                    cooldown: '10 דקות ריצה קלה',
                    notes: 'ריצת טמפו = מאמץ "נוח-קשה". דופק 80-90% מקסימום. ניתן לדבר מילים בודדות. BC Running: "גירוי חזק לשיפור קצב סף חומצת החלב". חימום: 3-5 ק"מ לפני הטמפו.',
                    tips: 'BC Running + RLRF: הטמפו הוא "הנשק הסודי" לרצי ארוכות. יעיל יותר מחזרות 400מ\' לרצי מרתון.'
                }];
            }
            return generateLongRun(duration, level, null);
        };

        // Main App
        function FitnessApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const traineeId = urlParams.get('trainee');
            const groupId = urlParams.get('group');

            if (traineeId) {
                return <TraineeView traineeId={traineeId} />;
            } else if (groupId) {
                return <GroupProgramPage groupId={groupId} />;
            } else {
                return <TrainerApp />;
            }
        }

        // Trainer Management Section (admin only)
        function TrainerManagementSection({ onBack }) {
            const [trainers, setTrainers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showAddForm, setShowAddForm] = useState(false);
            const [newName, setNewName] = useState('');
            const [newUsername, setNewUsername] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [newAllowedAI, setNewAllowedAI] = useState('groq_gemini');
            const [saving, setSaving] = useState(false);
            const [formError, setFormError] = useState('');
            const [createdCredentials, setCreatedCredentials] = useState(null);
            const [showApiKeyHelp, setShowApiKeyHelp] = useState(false);
            const [editingTrainer, setEditingTrainer] = useState(null);
            const [editName, setEditName] = useState('');
            const [editUsername, setEditUsername] = useState('');
            const [editPassword, setEditPassword] = useState('');
            const [editAllowedAI, setEditAllowedAI] = useState('groq_gemini');
            const [editSaving, setEditSaving] = useState(false);
            const [editError, setEditError] = useState('');

            useEffect(() => { loadTrainers(); }, []);

            const loadTrainers = async () => {
                setLoading(true);
                const data = await trainerStorage.getTrainers();
                setTrainers(data);
                setLoading(false);
            };

            const handleAddTrainer = async (e) => {
                e.preventDefault();
                setFormError('');
                if (!newName.trim() || !newUsername.trim() || !newPassword.trim()) {
                    setFormError('יש למלא את כל השדות');
                    return;
                }
                if (newUsername.includes('@') || newUsername.includes(' ')) {
                    setFormError('שם המשתמש לא יכול לכלול @ או רווח');
                    return;
                }
                setSaving(true);
                try {
                    // Use Firebase Auth REST API directly — avoids secondary app auth interference
                    const apiKey = firebase.app().options.apiKey;
                    const signUpRes = await fetch(
                        `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: newUsername.trim() + TRAINER_EMAIL_SUFFIX,
                                password: newPassword,
                                returnSecureToken: true
                            })
                        }
                    );
                    const signUpData = await signUpRes.json();
                    let uid;
                    if (!signUpRes.ok) {
                        const errorMsg = signUpData.error?.message || '';
                        if (errorMsg === 'EMAIL_EXISTS') {
                            // Try to sign in — if same password works and no Firestore doc exists,
                            // it's an orphaned account from a previous failed creation attempt
                            const signInRes = await fetch(
                                `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${apiKey}`,
                                {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        email: newUsername.trim() + TRAINER_EMAIL_SUFFIX,
                                        password: newPassword,
                                        returnSecureToken: true
                                    })
                                }
                            );
                            const signInData = await signInRes.json();
                            if (!signInRes.ok) {
                                // Wrong password or other error — genuinely taken
                                throw Object.assign(new Error('Email already in use'), { code: 'auth/email-already-in-use' });
                            }
                            const orphanUid = signInData.localId;
                            const existingDoc = await db.collection('trainees').doc('trainer_' + orphanUid).get();
                            if (existingDoc.exists) {
                                // Firestore doc also exists — genuinely taken
                                throw Object.assign(new Error('Email already in use'), { code: 'auth/email-already-in-use' });
                            }
                            // Orphaned account: Auth exists but no Firestore doc — recover it
                            uid = orphanUid;
                        } else {
                            throw new Error(errorMsg || 'שגיאה ביצירת חשבון');
                        }
                    } else {
                        uid = signUpData.localId;
                    }
                    // Save trainer data in Firestore — admin auth is completely unaffected
                    const trainerId = 'trainer_' + uid;
                    await trainerStorage.saveTrainer({
                        id: trainerId,
                        uid,
                        name: newName.trim(),
                        username: newUsername.trim(),
                        allowedAI: newAllowedAI
                    });
                    setCreatedCredentials({ name: newName.trim(), username: newUsername.trim(), password: newPassword, allowedAI: newAllowedAI });
                    setNewName(''); setNewUsername(''); setNewPassword(''); setNewAllowedAI('both');
                    setShowAddForm(false);
                    await loadTrainers();
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') {
                        setFormError('שם המשתמש כבר קיים במערכת');
                    } else {
                        setFormError('שגיאה ביצירת מאמן: ' + err.message);
                    }
                } finally {
                    setSaving(false);
                }
            };

            const handleDeleteTrainer = async (trainer) => {
                if (!window.confirm(`למחוק את המאמן "${trainer.name}" (${trainer.username})?\nהמאמן לא יוכל יותר להתחבר.`)) return;
                try {
                    await trainerStorage.deleteTrainer(trainer.id);
                    await loadTrainers();
                } catch (err) {
                    alert('שגיאה במחיקת מאמן: ' + err.message);
                }
            };

            const openEditTrainer = (trainer) => {
                setEditingTrainer(trainer);
                setEditName(trainer.name);
                setEditUsername(trainer.username);
                setEditPassword('');
                setEditAllowedAI(trainer.allowedAI || 'groq_gemini');
                setEditError('');
            };

            const handleEditTrainer = async (e) => {
                e.preventDefault();
                setEditError('');
                if (!editName.trim()) { setEditError('יש למלא שם'); return; }
                setEditSaving(true);
                try {
                    const usernameChanged = editUsername.trim() !== editingTrainer.username;
                    if (usernameChanged) {
                        if (!editPassword.trim()) { setEditError('לשינוי שם משתמש נדרשת סיסמה חדשה'); setEditSaving(false); return; }
                        if (editUsername.includes('@') || editUsername.includes(' ')) { setEditError('שם משתמש לא יכול לכלול @ או רווח'); setEditSaving(false); return; }
                        // Create new Firebase Auth account with new username
                        const apiKey = firebase.app().options.apiKey;
                        const signUpRes = await fetch(
                            `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ email: editUsername.trim() + TRAINER_EMAIL_SUFFIX, password: editPassword, returnSecureToken: true })
                            }
                        );
                        const signUpData = await signUpRes.json();
                        if (!signUpRes.ok) {
                            const msg = signUpData.error?.message || '';
                            if (msg === 'EMAIL_EXISTS') throw new Error('שם המשתמש כבר קיים במערכת');
                            throw new Error(msg || 'שגיאה ביצירת חשבון');
                        }
                        const newUid = signUpData.localId;
                        const newTrainerId = 'trainer_' + newUid;
                        await db.collection('trainees').doc(newTrainerId).set({
                            uid: newUid,
                            name: editName.trim(),
                            username: editUsername.trim(),
                            allowedAI: editAllowedAI,
                            isTrainer: true,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        await trainerStorage.deleteTrainer(editingTrainer.id);
                        setCreatedCredentials({ name: editName.trim(), username: editUsername.trim(), password: editPassword, allowedAI: editAllowedAI });
                    } else {
                        // Only name or AI permissions changed — simple Firestore update
                        await trainerStorage.updateTrainer(editingTrainer.id, { name: editName.trim(), allowedAI: editAllowedAI });
                    }
                    setEditingTrainer(null);
                    await loadTrainers();
                } catch (err) {
                    setEditError('שגיאה: ' + err.message);
                } finally {
                    setEditSaving(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-4xl mx-auto">
                            <button onClick={onBack} className="mb-4 text-white hover:text-purple-100 font-semibold flex items-center gap-2">
                                ← חזרה לדשבורד
                            </button>
                            <div className="flex justify-between items-start">
                                <div>
                                    <h1 className="text-2xl font-bold">👨‍💼 ניהול מאמנים</h1>
                                    <p className="text-purple-100 mt-1">הוסף מאמנים ונהל את הרשאות ה-AI שלהם</p>
                                </div>
                                <button
                                    onClick={() => setShowApiKeyHelp(!showApiKeyHelp)}
                                    className="bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-xl font-semibold transition flex items-center gap-2 text-sm"
                                >
                                    🔑 איך מקבלים מפתח API?
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto p-6">
                        {showApiKeyHelp && (
                            <div className="bg-blue-50 border-2 border-blue-300 rounded-2xl p-6 mb-6" dir="rtl">
                                <div className="flex justify-between items-start mb-4">
                                    <h3 className="text-lg font-bold text-blue-900">🔑 איך מקבלים מפתח API ומזינים אותו במערכת?</h3>
                                    <button onClick={() => setShowApiKeyHelp(false)} className="text-blue-500 hover:text-blue-700 text-xl font-bold">✕</button>
                                </div>
                                <div className="space-y-5 text-sm text-blue-900">
                                    <div className="bg-white rounded-xl p-4 border border-blue-200">
                                        <div className="font-bold text-green-700 mb-2">✨ Gemini (Google) — חינמי, מומלץ</div>
                                        <ol className="list-decimal list-inside space-y-1 text-gray-700">
                                            <li>היכנס לאתר: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-medium">aistudio.google.com/apikey</a></li>
                                            <li>התחבר עם חשבון Google</li>
                                            <li>לחץ על "Create API Key"</li>
                                            <li>העתק את המפתח שנוצר</li>
                                            <li>בדשבורד: לחץ "הגדרות" ← הדבק את המפתח בשדה "מפתח Gemini API"</li>
                                        </ol>
                                        <div className="mt-2 text-xs text-gray-500">⚠️ המגבלה החינמית: 250–1,000 בקשות ביום, 10–15 בקשות לדקה</div>
                                    </div>
                                    <div className="bg-white rounded-xl p-4 border border-blue-200">
                                        <div className="font-bold text-amber-700 mb-2">⚡ Groq — חינמי לחלוטין, מהיר מאוד</div>
                                        <ol className="list-decimal list-inside space-y-1 text-gray-700">
                                            <li>היכנס לאתר: <a href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-medium">console.groq.com/keys</a></li>
                                            <li>צור חשבון חינמי (אין צורך בכרטיס אשראי)</li>
                                            <li>לחץ "Create API Key"</li>
                                            <li>העתק את המפתח</li>
                                            <li>בדשבורד: לחץ "הגדרות" ← הדבק בשדה "מפתח Groq API"</li>
                                        </ol>
                                    </div>
                                    <div className="bg-white rounded-xl p-4 border border-blue-200">
                                        <div className="font-bold text-indigo-700 mb-2">🤖 Claude (Anthropic) — בתשלום</div>
                                        <ol className="list-decimal list-inside space-y-1 text-gray-700">
                                            <li>היכנס לאתר: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer" className="text-blue-600 underline font-medium">console.anthropic.com</a></li>
                                            <li>צור חשבון ושים כרטיס אשראי</li>
                                            <li>לחץ "Create Key"</li>
                                            <li>העתק את המפתח</li>
                                            <li>בדשבורד: לחץ "הגדרות" ← הדבק בשדה "מפתח Claude API"</li>
                                        </ol>
                                    </div>
                                    <div className="bg-yellow-50 border border-yellow-300 rounded-xl p-3 text-xs text-yellow-800">
                                        💡 <strong>חשוב:</strong> המפתחות נשמרים רק בדפדפן שלך (localStorage) ולא נשלחים לשרת. כל מאמן שמזין את המפתח שלו בהגדרות יוכל להשתמש ביצירת תוכניות עם AI.
                                    </div>
                                </div>
                            </div>
                        )}
                        {createdCredentials && (
                            <div className="bg-green-50 border-2 border-green-400 rounded-2xl p-6 mb-6" dir="rtl">
                                <h3 className="text-lg font-bold text-green-800 mb-3">✅ מאמן נוצר בהצלחה!</h3>
                                <p className="text-green-700 mb-3">שלח למאמן את פרטי הגישה הבאים:</p>
                                <div className="bg-white rounded-xl p-4 border border-green-300 font-mono text-sm space-y-1">
                                    <div><span className="text-gray-500">שם:</span> <strong>{createdCredentials.name}</strong></div>
                                    <div><span className="text-gray-500">שם משתמש:</span> <strong dir="ltr">{createdCredentials.username}</strong></div>
                                    <div><span className="text-gray-500">סיסמה:</span> <strong dir="ltr">{createdCredentials.password}</strong></div>
                                    <div><span className="text-gray-500">הרשאות AI:</span> <strong>{createdCredentials.allowedAI === 'all' || createdCredentials.allowedAI === 'both' ? 'Groq + Gemini + Claude' : createdCredentials.allowedAI === 'groq_gemini' ? 'Groq + Gemini' : createdCredentials.allowedAI === 'groq' ? 'Groq בלבד' : createdCredentials.allowedAI === 'gemini' ? 'Gemini בלבד' : 'Groq + Gemini'}</strong></div>
                                </div>
                                <button
                                    onClick={() => setCreatedCredentials(null)}
                                    className="mt-4 text-sm text-green-600 hover:text-green-800 underline"
                                >
                                    סגור
                                </button>
                            </div>
                        )}

                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-gray-800">מאמנים ({trainers.length})</h2>
                            <button
                                onClick={() => setShowAddForm(true)}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-xl transition flex items-center gap-2"
                            >
                                <span>➕</span> הוסף מאמן
                            </button>
                        </div>

                        {loading ? (
                            <div className="text-center py-12 text-gray-500">טוען...</div>
                        ) : trainers.length === 0 ? (
                            <div className="bg-white rounded-2xl shadow p-12 text-center text-gray-400">
                                <div className="text-5xl mb-4">👨‍💼</div>
                                <p className="text-lg font-medium">אין מאמנים עדיין</p>
                                <p className="text-sm mt-1">לחץ על "הוסף מאמן" כדי להוסיף את המאמן הראשון</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {trainers.map(trainer => (
                                    <div key={trainer.id} className="bg-white rounded-2xl shadow p-5 flex items-center justify-between" dir="rtl">
                                        <div>
                                            <div className="font-bold text-gray-800 text-lg">{trainer.name}</div>
                                            <div className="text-sm text-gray-500 mt-0.5" dir="ltr">{trainer.username}</div>
                                            <div className="mt-2">
                                                {(trainer.allowedAI === 'all' || trainer.allowedAI === 'both') ? (
                                                    <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-medium">⚡✨🤖 Groq + Gemini + Claude</span>
                                                ) : trainer.allowedAI === 'groq_gemini' ? (
                                                    <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">⚡✨ Groq + Gemini</span>
                                                ) : trainer.allowedAI === 'groq' ? (
                                                    <span className="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-full font-medium">⚡ Groq בלבד</span>
                                                ) : trainer.allowedAI === 'gemini' ? (
                                                    <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">✨ Gemini בלבד</span>
                                                ) : (
                                                    <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">⚡✨ Groq + Gemini</span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => openEditTrainer(trainer)}
                                                className="text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-2 rounded-lg transition text-sm font-medium"
                                            >
                                                ✏️ ערוך
                                            </button>
                                            <button
                                                onClick={() => handleDeleteTrainer(trainer)}
                                                className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition text-sm font-medium"
                                            >
                                                מחק
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {editingTrainer && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full" dir="rtl">
                                    <h2 className="text-xl font-bold text-gray-800 mb-6">עריכת מאמן: {editingTrainer.name}</h2>
                                    <form onSubmit={handleEditTrainer} className="space-y-4">
                                        <div>
                                            <label className="block text-gray-700 font-semibold mb-1">שם מלא</label>
                                            <input type="text" value={editName} onChange={e => setEditName(e.target.value)} required
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-semibold mb-1">שם משתמש (לכניסה)</label>
                                            <input type="text" value={editUsername}
                                                onChange={e => setEditUsername(e.target.value.toLowerCase().replace(/[@ ]/g, ''))}
                                                required dir="ltr"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-mono" />
                                            {editUsername !== editingTrainer.username && (

        // Trainer App
        function TrainerApp() {
            const [authUser, setAuthUser] = useState(undefined); // undefined = loading
            const [trainerUser, setTrainerUser] = useState(null); // sub-trainer logged in via Firestore
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        // Check if this user is a sub-trainer (has a record in trainers collection)
                        const trainerDoc = await trainerStorage.getTrainerByUid(user.uid);
                        if (trainerDoc) {
                            setTrainerUser(trainerDoc);
                        } else if (user.email && user.email.endsWith(TRAINER_EMAIL_SUFFIX)) {
                            // Orphaned trainer account (no Firestore doc) — sign out immediately
                            await auth.signOut();
                            setTrainerUser(null);
                            setAuthUser(null);
                            return;
                        } else {
                            setTrainerUser(null); // admin
                        }
                    } else {
                        setTrainerUser(null);
                    }
                    setAuthUser(user);
                });
                return () => unsubscribe();
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    // Determine the Firebase Auth email to use
                    const loginEmail = username.includes('@')
                        ? username // admin uses their real email
                        : username.trim() + TRAINER_EMAIL_SUFFIX; // sub-trainer uses constructed email
                    await auth.signInWithEmailAndPassword(loginEmail, password);
                } catch (err) {
                    if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                        setError('שם משתמש לא נמצא');
                    } else if (err.code === 'auth/wrong-password') {
                        setError('סיסמה שגויה');
                    } else if (err.code === 'auth/invalid-email') {
                        setError('שם משתמש לא תקין');
                    } else {
                        setError('שגיאת כניסה: ' + err.message);
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
                setTrainerUser(null);
            };

            // Still loading auth state
            if (authUser === undefined) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center">
                        <div className="text-white text-xl">טוען...</div>
                    </div>
                );
            }

            if (!authUser) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">🔒</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">כניסת מאמן</h1>
                                <p className="text-gray-600">כניסה עם שם משתמש וסיסמה</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input
                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        placeholder="שם משתמש"
                                        required
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        dir="ltr"
                                    />
                                </div>
                                <div>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="סיסמה"
                                        required
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>
                                {error && (
                                    <div className="text-red-600 text-sm text-center">{error}</div>
                                )}
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold py-3 px-6 rounded-xl transition"
                                >
                                    {loading ? 'מתחבר...' : 'כניסה'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const isAdmin = authUser && !trainerUser;
            const allowedAI = trainerUser ? (trainerUser.allowedAI || 'both') : 'both';

            return (
                <TrainerContext.Provider value={{ isAdmin, trainerUser, allowedAI }}>
                    <TrainerDashboard onLogout={handleLogout} />
                </TrainerContext.Provider>
            );
        }

        // Trainer Dashboard
        function TrainerDashboard({ onLogout }) {
            const { isAdmin, trainerUser } = React.useContext(TrainerContext);
            const [trainees, setTrainees] = useState([]);
            const [showCreateForm, setShowCreateForm] = useState(false);
            const [sourceTrainee, setSourceTrainee] = useState(null);
            const [draftTrainee, setDraftTrainee] = useState(null);
            const [selectedTrainee, setSelectedTrainee] = useState(null);
            const [editingTrainee, setEditingTrainee] = useState(null);
            const [continuationTrainee, setContinuationTrainee] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showArchive, setShowArchive] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [showTrainerManagement, setShowTrainerManagement] = useState(false);
            const [settingsApiKey, setSettingsApiKey] = useState(() => localStorage.getItem('claudeApiKey') || '');
            const [settingsGeminiKey, setSettingsGeminiKey] = useState(() => localStorage.getItem('geminiApiKey') || '');
            const [settingsGroqKey, setSettingsGroqKey] = useState(() => localStorage.getItem('groqApiKey') || '');
            const [settingsTrainerContext, setSettingsTrainerContext] = useState(() => localStorage.getItem('trainerContext') || '');
            const [settingsProxyUrl, setSettingsProxyUrl] = useState(() => localStorage.getItem('anthropicProxyUrl') || '');
            const [settingsCurrentPw, setSettingsCurrentPw] = useState('');
            const [settingsNewPw, setSettingsNewPw] = useState('');
            const [settingsConfirmPw, setSettingsConfirmPw] = useState('');
            const [settingsPwError, setSettingsPwError] = useState('');
            const [settingsPwSuccess, setSettingsPwSuccess] = useState('');
            const [settingsPwLoading, setSettingsPwLoading] = useState(false);
            const [showGroupPrograms, setShowGroupPrograms] = useState(false);
            const [showApiKeyHelp, setShowApiKeyHelp] = useState(false);

            useEffect(() => {
                loadTrainees();
            }, []);

            const loadTrainees = async () => {
                setLoading(true);
                try {
                    const data = await storage.getTrainees(trainerUser?.uid);
                    setTrainees(data);
                } catch (error) {
                    console.error('loadTrainees failed:', error);
                    setTrainees([]);
                } finally {
                    setLoading(false);
                }
            };

            const refreshTrainees = async () => {
                await loadTrainees();
            };

            const handleArchive = async (e, traineeId) => {
                e.stopPropagation();
                try {
                    await storage.archiveTrainee(traineeId);
                    await refreshTrainees();
                } catch (error) {
                    alert('שגיאה בהעברה לארכיון');
                }
            };

            const handleRestore = async (e, traineeId) => {
                e.stopPropagation();
                try {
                    await storage.restoreTrainee(traineeId);
                    await refreshTrainees();
                } catch (error) {
                    alert('שגיאה בשחזור מתאמן');
                }
            };

            const handleDelete = async (e, trainee) => {
                e.stopPropagation();
                if (window.confirm(`למחוק את "${trainee.name}" לצמיתות?\nפעולה זו אינה הפיכה.`)) {
                    try {
                        await storage.deleteTrainee(trainee.id);
                        await refreshTrainees();
                    } catch (error) {
                        alert('שגיאה במחיקת מתאמן');
                    }
                }
            };

            const handleDeleteDraft = async (e, draft) => {
                e.stopPropagation();
                if (window.confirm(`למחוק את הטיוטה של "${draft.name || 'ללא שם'}"?`)) {
                    try {
                        await storage.deleteTrainee(draft.id);
                        await refreshTrainees();
                    } catch (error) {
                        alert('שגיאה במחיקת טיוטה');
                    }
                }
            };

            const handleOpenDraft = (draft) => {
                setDraftTrainee(draft);
                setShowCreateForm(true);
            };

            const handleSaveSettings = () => {
                localStorage.setItem('claudeApiKey', settingsApiKey.trim());
                localStorage.setItem('geminiApiKey', settingsGeminiKey.trim());
                localStorage.setItem('groqApiKey', settingsGroqKey.trim());
                localStorage.setItem('trainerContext', settingsTrainerContext.trim());
                localStorage.setItem('anthropicProxyUrl', settingsProxyUrl.trim());
                setShowSettings(false);
            };

            const handleChangeTrainerPassword = async (e) => {
                e.preventDefault();
                setSettingsPwError('');
                setSettingsPwSuccess('');
                if (settingsNewPw !== settingsConfirmPw) {
                    setSettingsPwError('הסיסמאות החדשות אינן תואמות');
                    return;
                }
                if (settingsNewPw.length < 6) {
                    setSettingsPwError('הסיסמה חייבת להכיל לפחות 6 תווים');
                    return;
                }
                setSettingsPwLoading(true);
                try {
                    const user = auth.currentUser;
                    const credential = firebase.auth.EmailAuthProvider.credential(user.email, settingsCurrentPw);
                    await user.reauthenticateWithCredential(credential);
                    await user.updatePassword(settingsNewPw);
                    setSettingsPwSuccess('הסיסמה שונתה בהצלחה!');
                    setSettingsCurrentPw('');
                    setSettingsNewPw('');
                    setSettingsConfirmPw('');
                } catch (err) {
                    if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                        setSettingsPwError('הסיסמה הנוכחית שגויה');
                    } else if (err.code === 'auth/weak-password') {
                        setSettingsPwError('הסיסמה חלשה מדי — יש להשתמש ב-6 תווים לפחות');
                    } else {
                        setSettingsPwError('שגיאה בשינוי הסיסמה. נסה שוב.');
                    }
                } finally {
                    setSettingsPwLoading(false);
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-2xl font-bold text-gray-700">טוען נתונים...</div>
                        </div>
                    </div>
                );
            }

            if (showTrainerManagement) {
                return (
                    <TrainerManagementSection
                        onBack={() => setShowTrainerManagement(false)}
                    />
                );
            }

            if (showGroupPrograms) {
                return (
                    <GroupProgramsSection
                        trainees={trainees}
                        onBack={() => setShowGroupPrograms(false)}
                    />
                );
            }

            if (continuationTrainee) {
                return (
                    <BuildContinuationPlan
                        trainee={continuationTrainee}
                        onBack={() => setContinuationTrainee(null)}
                        onComplete={() => {
                            setContinuationTrainee(null);
                            refreshTrainees();
                        }}
                    />
                );
            }

            if (editingTrainee) {
                return (
                    <EditTraineePlan
                        trainee={editingTrainee}
                        onBack={() => setEditingTrainee(null)}
                        onComplete={() => {
                            setEditingTrainee(null);
                            refreshTrainees();
                        }}
                    />
                );
            }

            if (selectedTrainee) {
                return (
                    <TraineeDetailView
                        trainee={selectedTrainee}
                        onBack={() => {
                            setSelectedTrainee(null);
                            refreshTrainees();
                        }}
                        onEditPlan={(trainee) => {
                            setSelectedTrainee(null);
                            setEditingTrainee(trainee);
                        }}
                        onContinuationPlan={(trainee) => {
                            setSelectedTrainee(null);
                            setContinuationTrainee(trainee);
                        }}
                    />
                );
            }

            if (showCreateForm) {
                return (
                    <CreateTraineePlan
                        onBack={() => { setShowCreateForm(false); setSourceTrainee(null); setDraftTrainee(null); }}
                        onComplete={() => {
                            setShowCreateForm(false);
                            setSourceTrainee(null);
                            setDraftTrainee(null);
                            refreshTrainees();
                        }}
                        sourceTrainee={sourceTrainee}
                        draftTrainee={draftTrainee}
                        trainees={trainees}
                    />
                );
            }

            const draftTrainees = trainees.filter(t => t.isDraft && !t.archived);
            const activeTrainees = trainees.filter(t => !t.archived && !t.isDraft);
            const archivedTrainees = trainees.filter(t => t.archived);
            const displayTrainees = showArchive ? archivedTrainees : activeTrainees;

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold">דשבורד מאמן 🎯</h1>
                                <p className="text-purple-100 mt-1">ניהול מתאמנים ותוכניות אימון</p>
                            </div>
                            <div className="flex gap-2 flex-wrap justify-end">
                                <button
                                    onClick={() => setShowApiKeyHelp(!showApiKeyHelp)}
                                    className="bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2 text-sm"
                                >
                                    🔑 איך מקבלים מפתח API?
                                </button>
                                <button
                                    onClick={() => setShowSettings(true)}
                                    className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition"
                                    title="הגדרות"
                                >
                                    ⚙️ הגדרות
                                </button>
                                <button
                                    onClick={onLogout}
                                    className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition"
                                >
                                    התנתק
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto p-6">
                        {showApiKeyHelp && (
                            <div className="bg-blue-50 border-2 border-blue-300 rounded-2xl p-6 mb-6" dir="rtl">
                                <div className="flex justify-between items-start mb-4">
                                    <h3 className="text-lg font-bold text-blue-900">🔑 איך מקבלים מפתח API ומזינים אותו במערכת?</h3>
                                    <button onClick={() => setShowApiKeyHelp(false)} className="text-blue-500 hover:text-blue-700 text-xl font-bold">✕</button>
                                </div>
                                <div className="space-y-5 text-sm text-blue-900">
                                    <div className="bg-white rounded-xl p-4 border border-blue-200">
                                        <div className="font-bold text-green-700 mb-2">✨ Gemini (Google) — חינמי, מומלץ</div>
                                        <ol className="list-decimal list-inside space-y-1 text-gray-700">
