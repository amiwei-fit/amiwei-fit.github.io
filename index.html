                                        <p className="text-xs text-green-600 mt-2">✓ {settingsTrainerContext.length} תווים — הקשר אישי הוגדר</p>
                                    )}
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={handleSaveSettings}
                                        className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-xl transition"
                                    >
                                        שמור
                                    </button>
                                    <button
                                        onClick={() => setShowSettings(false)}
                                        className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-xl transition"
                                    >
                                        ביטול
                                    </button>
                                </div>

                                <hr className="my-6 border-gray-200" />

                                <div className="mb-2">
                                    <h3 className="text-lg font-bold text-gray-800 mb-1">🔒 שינוי סיסמה</h3>
                                    <p className="text-sm text-gray-500 mb-4">שנה את הסיסמה שבה אתה מתחבר למערכת.</p>
                                    <form onSubmit={handleChangeTrainerPassword} className="space-y-3">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-1">סיסמה נוכחית</label>
                                            <input
                                                type="password"
                                                value={settingsCurrentPw}
                                                onChange={e => setSettingsCurrentPw(e.target.value)}
                                                required
                                                placeholder="הכנס סיסמה נוכחית"
                                                className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-1">סיסמה חדשה</label>
                                            <input
                                                type="password"
                                                value={settingsNewPw}
                                                onChange={e => setSettingsNewPw(e.target.value)}
                                                required
                                                placeholder="לפחות 6 תווים"
                                                className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-1">אימות סיסמה חדשה</label>
                                            <input
                                                type="password"
                                                value={settingsConfirmPw}
                                                onChange={e => setSettingsConfirmPw(e.target.value)}
                                                required
                                                placeholder="הכנס שוב את הסיסמה החדשה"
                                                className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"
                                            />
                                        </div>
                                        {settingsPwError && (
                                            <p className="text-sm text-red-600 font-medium">{settingsPwError}</p>
                                        )}
                                        {settingsPwSuccess && (
                                            <p className="text-sm text-green-600 font-medium">{settingsPwSuccess}</p>
                                        )}
                                        <button
                                            type="submit"
                                            disabled={settingsPwLoading}
                                            className="w-full bg-gray-800 hover:bg-gray-900 disabled:opacity-60 text-white font-semibold py-2.5 px-6 rounded-xl transition"
                                        >
                                            {settingsPwLoading ? '⏳ מעדכן...' : '🔒 עדכן סיסמה'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Create Trainee Plan Form
        function CreateTraineePlan({ onBack, onComplete, sourceTrainee, draftTrainee, trainees = [] }) {
            const { allowedAI, trainerUser } = React.useContext(TrainerContext);
            const [step, setStep] = useState('form'); // 'form' or 'preview'
            const [generatedPlan, setGeneratedPlan] = useState(null);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiError, setAiError] = useState(null);
            const [planInputMode, setPlanInputMode] = useState('build'); // 'build' or 'import'
            const [importPlanText, setImportPlanText] = useState('');
            const [importLoading, setImportLoading] = useState(false);
            const [importError, setImportError] = useState(null);
            const [draftId, setDraftId] = useState(draftTrainee ? draftTrainee.id : null);
            const [draftSaving, setDraftSaving] = useState(false);
            const [draftSavedMsg, setDraftSavedMsg] = useState('');
            const [freeText, setFreeText] = useState('');
            const [freeTextError, setFreeTextError] = useState(null);
            const claudeApiKey = (allowedAI === 'all' || allowedAI === 'both') ? (localStorage.getItem('claudeApiKey') || '') : '';
            const geminiApiKey = (allowedAI === 'groq_gemini' || allowedAI === 'all' || allowedAI === 'both' || allowedAI === 'gemini') ? (localStorage.getItem('geminiApiKey') || '') : '';
            const groqApiKey = (allowedAI === 'groq' || allowedAI === 'groq_gemini' || allowedAI === 'all' || allowedAI === 'both') ? (localStorage.getItem('groqApiKey') || '') : '';
            const claudeViaProxy = !!(localStorage.getItem('anthropicProxyUrl') && (allowedAI === 'all' || allowedAI === 'both'));
            const hasAiProvider = !!(claudeApiKey || claudeViaProxy || geminiApiKey || groqApiKey);

            const [formData, setFormData] = useState(() => {
                if (sourceTrainee) {
                    // Duplicate mode: copy all training fields, clear personal identity
                    const { workoutPlan, id, createdAt, traineePasswordHash, archived, updatedAt, ...trainingFields } = sourceTrainee;
                    return { ...trainingFields, name: '', email: '', phone: '' };
                }
                if (draftTrainee) {
                    // Draft mode: restore all saved fields
                    const { isDraft, id, savedAt, traineePasswordHash, archived, updatedAt, createdAt, ...draftFields } = draftTrainee;
                    return { ...draftFields };
                }
                return {
                name: '',
                email: '',
                phone: '',
                age: '',
                gender: '',
                height: '',
                weight: '',
                activityLevel: '',
                workoutDuration: '', // in minutes
                goals: [],
                muscleGroups: [],
                availableEquipment: [], // equipment available for training
                // Running-specific fields
                runningLevel: '', // beginner, intermediate, advanced
                weeklyMileage: '', // current km per week
                maxContinuousDistance: '', // max km runner can run without stopping
                raceGoal: '', // marathon, half-marathon, 10k, 5k, general fitness
                currentPace: '', // e.g., "5:30 per km"
                current5kTime: '',
                current10kTime: '',
                currentHalfTime: '',
                currentMarathonTime: '',
                injuryHistory: '',
                planWeeks: '',
                customInstructions: '',
                cardioTarget: {
                    hasDistanceGoal: false,
                    distance: '',
                    hasPaceGoal: false,
                    pace: ''
                }
            }
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleGoalToggle = (goal) => {
                setFormData(prev => ({
                    ...prev,
                    goals: prev.goals.includes(goal)
                        ? prev.goals.filter(g => g !== goal)
                        : [...prev.goals, goal]
                }));
            };

            const handleMuscleGroupToggle = (group) => {
                setFormData(prev => ({
                    ...prev,
                    muscleGroups: prev.muscleGroups.includes(group)
                        ? prev.muscleGroups.filter(g => g !== group)
                        : [...prev.muscleGroups, group]
                }));
            };

            const handleCardioTargetChange = (field, value) => {
                setFormData(prev => ({
                    ...prev,
                    cardioTarget: {
                        ...prev.cardioTarget,
                        [field]: value
                    }
                }));
            };

            const parseAndImportPlan = async () => {
                if (!importPlanText.trim()) {
                    setImportError('אנא הכנס תוכנית אימונים לייבוא');
                    return;
                }
                const proxyUrl = localStorage.getItem('anthropicProxyUrl') || '';
                if (!claudeApiKey && !proxyUrl) {
                    setImportError('נדרש מפתח API של Claude או כתובת פרוקסי להמרת התוכנית. הגדר אחד מהם בהגדרות.');
                    return;
                }
                if (!formData.name) {
                    setImportError('אנא הכנס לפחות את שם המתאמן');
                    return;
                }
                setImportLoading(true);
                setImportError(null);
                try {
                    const proxyUrl = localStorage.getItem('anthropicProxyUrl') || '';
                    const apiEndpoint = proxyUrl
                        ? `${proxyUrl.replace(/\/$/, '')}/v1/messages`
                        : 'https://api.anthropic.com/v1/messages';
                    const extraHeaders = proxyUrl ? {} : { 'anthropic-dangerous-allow-browser': 'true' };

                    const systemPrompt = `You are a fitness data parser. Convert the provided training plan (which may be in any format: table, free text, Hebrew/English) into a structured JSON workout plan.

You must respond ONLY with a valid JSON object matching this exact structure (no markdown, no explanations, just pure JSON):
{
  "duration": <number of weeks>,
  "workoutsPerWeek": <number>,
  "workoutDuration": <minutes per session or 60 if unknown>,
  "weeks": [
    {
      "weekNumber": 1,
      "phase": "בסיס",
      "workouts": [
        {
          "day": "יום א'",
          "type": "כוח",
          "completed": false,
          "feedback": null,
          "difficulty": null,
          "feedbackRead": false,
          "feedbackSentToTrainer": false,
          "exercises": [
            {
              "name": "exercise name in Hebrew",
              "sets": 3,
              "reps": "10",
              "rest": 90,
              "notes": "optional coaching note in Hebrew"
            }
          ]
        }
      ]
    }
  ],
  "createdAt": "${new Date().toISOString()}",
  "muscleGroups": [],
  "cardioTarget": {}
}

Rules:
- All exercise names, phases, day names, notes MUST be in Hebrew
- Day names: יום א', יום ב', יום ג', יום ד', יום ה', יום ו', שבת
- Workout types in Hebrew: כוח / ריצה קלה / ריצה טמפו / אינטרוול / מנוחה פעילה / ריצה
- For running workouts: name describes the run (e.g. "ריצה קלה 30 דקות"), sets: 1, reps: "30 דק'"
- exercises array must never be empty
- If a workout week appears only once in the plan but the plan says it repeats, generate all weeks
- If unclear how many weeks, default to the number of weeks visible in the plan`;

                    const userMessage = `המר את תוכנית האימונים הבאה לפורמט JSON. המתאמן: ${formData.name || 'לא צוין'}.\n\nתוכנית האימונים:\n${importPlanText}`;

                    const response = await fetch(apiEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', ...(claudeApiKey ? { 'x-api-key': claudeApiKey } : {}), 'anthropic-version': '2023-06-01', ...extraHeaders },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-6',
                            max_tokens: 8000,
                            system: systemPrompt,
                            messages: [{ role: 'user', content: userMessage }]
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `שגיאת API: ${response.status}`);
                    }

                    const data = await response.json();
                    const rawText = data.content?.[0]?.text || '';
                    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error('לא התקבלה תוכנית תקינה מה-AI');

                    const plan = JSON.parse(jsonMatch[0]);

                    // Attach video URLs and add warmup/cooldown blocks
                    if (plan.weeks && Array.isArray(plan.weeks)) {
                        plan.weeks.forEach(week => {
                            if (week.workouts) {
                                week.workouts.forEach(workout => {
                                    if (workout.exercises) {
                                        workout.exercises = workout.exercises.map(ex => ({
                                            ...ex,
                                            videoUrl: ex.videoUrl || getDefaultExerciseVideoUrl(ex.name)
                                        }));
                                        const hasWarmup = workout.exercises.some(ex => ex.name && ex.name.includes('חימום ומתיחות דינמיות'));
                                        const hasCooldown = workout.exercises.some(ex => ex.name && ex.name.includes('מתיחות לשחרור'));
                                        if (!hasWarmup) workout.exercises = [...getWarmupBlock(), ...workout.exercises];
                                        if (!hasCooldown) workout.exercises = [...workout.exercises, ...getCooldownBlock()];
                                    }
                                });
                            }
                        });
                    }

                    setGeneratedPlan(plan);
                    setStep('preview');
                } catch (err) {
                    const msg = err.message || '';
                    const lowerMsg = msg.toLowerCase();
                    if (lowerMsg.includes('failed to fetch') || lowerMsg === 'load failed' || lowerMsg.includes('networkerror') || lowerMsg.includes('network error') || lowerMsg.includes('fetch')) {
                        setImportError('שגיאת חיבור לשרת AI. ודא שמפתח ה-API תקין ושחיבור האינטרנט פעיל.');
                    } else {
                        setImportError(msg || 'שגיאה בניתוח התוכנית');
                    }
                } finally {
                    setImportLoading(false);
                }
            };

            const handleFreeTextGenerate = async (provider = 'claude') => {
                if (!formData.name.trim()) { setFreeTextError('אנא הכנס שם מתאמן'); return; }
                if (!freeText.trim()) { setFreeTextError('אנא הכנס תיאור של המתאמן'); return; }
                setFreeTextError(null);
                setAiLoading(true);
                try {
                    const approvedExercises = getAllExerciseNames(formData.availableEquipment || []);
                    const similarExercises = findSimilarTraineesExercises(formData, trainees);
                    const plan = provider === 'gemini'
                        ? await generatePlanWithGemini(formData, geminiApiKey, { naturalDescription: freeText, approvedExercises, similarExercises })
                        : provider === 'groq'
                        ? await generatePlanWithGroq(formData, groqApiKey, { naturalDescription: freeText, approvedExercises, similarExercises })
                        : await generatePlanWithClaude(formData, claudeApiKey, { naturalDescription: freeText, approvedExercises, similarExercises });
                    setGeneratedPlan(plan);
                    setStep('preview');
                } catch (err) {
                    const msg = err.message || '';
                    const lowerMsg = msg.toLowerCase();
                    if (lowerMsg.includes('failed to fetch') || lowerMsg === 'load failed' || lowerMsg.includes('networkerror') || lowerMsg.includes('network error') || lowerMsg.includes('fetch')) {
                        setFreeTextError('שגיאת חיבור לשרת AI. ודא שמפתח ה-API תקין ושחיבור האינטרנט פעיל.');
                    } else if (lowerMsg.includes('quota') || lowerMsg.includes('rate limit') || lowerMsg.includes('exceeded') || lowerMsg.includes('resource_exhausted') || lowerMsg.includes('429')) {
                        setFreeTextError(getGeminiQuotaErrorMsg(msg));
                    } else {
                        setFreeTextError(msg || 'שגיאה ביצירת תוכנית');
                    }
                } finally {
                    setAiLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();

                let workoutPlan;
                if (sourceTrainee) {
                    // Duplicate mode: deep-copy the source plan and reset all completion/feedback state
                    workoutPlan = JSON.parse(JSON.stringify(sourceTrainee.workoutPlan));
                    workoutPlan.weeks.forEach(week => {
                        week.workouts.forEach(workout => {
                            workout.completed = false;
                            workout.feedback = null;
                            workout.difficulty = null;
                            workout.feedbackRead = false;
                            workout.feedbackSentToTrainer = false;
                        });
                    });
                } else {
                    workoutPlan = generateWorkoutPlan(formData);
                }
                setGeneratedPlan(workoutPlan);
                setStep('preview');
            };

            const handleSaveDraft = async () => {
                if (!formData.name && !formData.email && !formData.phone) {
                    alert('אנא הכנס לפחות שם, אימייל או טלפון לפני שמירת טיוטה');
                    return;
                }
                setDraftSaving(true);
                try {
                    const id = draftId || crypto.randomUUID();
                    if (draftId) {
                        await storage.updateTrainee(id, { ...formData, isDraft: true, workoutPlan: null, savedAt: new Date().toISOString() });
                    } else {
                        await storage.saveTrainee({ id, ...formData, isDraft: true, workoutPlan: null, savedAt: new Date().toISOString(), trainerId: trainerUser?.uid || null });
                        setDraftId(id);
                    }
                    setDraftSavedMsg('הטיוטה נשמרה ✓');
                    setTimeout(() => setDraftSavedMsg(''), 3000);
                } catch (err) {
                    alert('שגיאה בשמירת טיוטה: ' + (err.message || ''));
                } finally {
                    setDraftSaving(false);
                }
            };

            const handleSavePlan = async () => {
                const id = draftId || crypto.randomUUID();
                try {
                    if (draftId) {
                        await storage.updateTrainee(id, { ...formData, workoutPlan: generatedPlan, isDraft: false, savedAt: null });
                    } else {
                        await storage.saveTrainee({ id, ...formData, workoutPlan: generatedPlan, isDraft: false, trainerId: trainerUser?.uid || null });
                    }
                    onComplete();
                } catch (error) {
                    console.error('Error saving trainee:', error);
                    alert('שגיאה בשמירת מתאמן. אנא נסה שוב.');
                }
            };

            const handleRegeneratePlan = (systemPrompt) => {
                const updatedFormData = { ...formData, _systemPrompt: systemPrompt || formData.customInstructions || '' };
                const workoutPlan = generateWorkoutPlan(updatedFormData);
                setGeneratedPlan(workoutPlan);
            };

            const handleAiGenerate = async (e, provider = 'claude') => {
                e.preventDefault();
                setAiError(null);
                setAiLoading(true);
                try {
                    const approvedExercises = getAllExerciseNames(formData.availableEquipment || []);
                    const similarExercises = findSimilarTraineesExercises(formData, trainees);
                    const plan = provider === 'gemini'
                        ? await generatePlanWithGemini(formData, geminiApiKey, { approvedExercises, similarExercises })
                        : provider === 'groq'
                        ? await generatePlanWithGroq(formData, groqApiKey, { approvedExercises, similarExercises })
                        : await generatePlanWithClaude(formData, claudeApiKey, { approvedExercises, similarExercises });
                    setGeneratedPlan(plan);
                    setStep('preview');
                } catch (err) {
                    const msg = err.message || '';
                    const lowerMsg = msg.toLowerCase();
                    if (lowerMsg.includes('failed to fetch') || lowerMsg === 'load failed' || lowerMsg.includes('networkerror') || lowerMsg.includes('network error') || lowerMsg.includes('fetch')) {
                        setAiError('שגיאת חיבור לשרת AI. ודא שמפתח ה-API תקין בהגדרות ושחיבור האינטרנט פעיל.');
                    } else if (lowerMsg.includes('quota') || lowerMsg.includes('rate limit') || lowerMsg.includes('exceeded') || lowerMsg.includes('resource_exhausted') || lowerMsg.includes('429')) {
                        setAiError(getGeminiQuotaErrorMsg(msg));
                    } else {
                        setAiError(msg || 'שגיאה ביצירת תוכנית עם AI');
                    }
                } finally {
                    setAiLoading(false);
                }
            };

            if (step === 'preview') {
                return (
                    <PlanPreviewEditor
                        formData={formData}
                        workoutPlan={generatedPlan}
                        onBack={() => setStep('form')}
                        onSave={handleSavePlan}
                        onRegenerate={handleRegeneratePlan}
                        onAiRegenerate={(claudeApiKey || claudeViaProxy) && !sourceTrainee ? async (sp) => {
                            setAiLoading(true);
                            try {
                                const updatedForm = { ...formData, customInstructions: sp || formData.customInstructions || '' };
                                const approvedExercises = getAllExerciseNames(formData.availableEquipment || []);
                                const similarExercises = findSimilarTraineesExercises(formData, trainees);
                                const plan = await generatePlanWithClaude(updatedForm, claudeApiKey, { approvedExercises, similarExercises });
                                setGeneratedPlan(plan);
                            } catch(e) { alert('שגיאה ביצירת תוכנית: ' + (e.message || '')); }
                            finally { setAiLoading(false); }
                        } : null}
                        onAiRegenerateGemini={geminiApiKey && !sourceTrainee ? async (sp) => {
                            setAiLoading(true);
                            try {
                                const updatedForm = { ...formData, customInstructions: sp || formData.customInstructions || '' };
                                const approvedExercises = getAllExerciseNames(formData.availableEquipment || []);
                                const similarExercises = findSimilarTraineesExercises(formData, trainees);
                                const plan = await generatePlanWithGemini(updatedForm, geminiApiKey, { approvedExercises, similarExercises });
                                setGeneratedPlan(plan);
                            } catch(e) { alert('שגיאה ביצירת תוכנית: ' + (e.message || '')); }
                            finally { setAiLoading(false); }
                        } : null}
                        onAiRegenerateGroq={groqApiKey && !sourceTrainee ? async (sp) => {
                            setAiLoading(true);
                            try {
                                const updatedForm = { ...formData, customInstructions: sp || formData.customInstructions || '' };
                                const approvedExercises = getAllExerciseNames(formData.availableEquipment || []);
                                const similarExercises = findSimilarTraineesExercises(formData, trainees);
                                const plan = await generatePlanWithGroq(updatedForm, groqApiKey, { approvedExercises, similarExercises });
                                setGeneratedPlan(plan);
                            } catch(e) { alert('שגיאה ביצירת תוכנית: ' + (e.message || '')); }
                            finally { setAiLoading(false); }
                        } : null}
                        aiRegenerateLoading={aiLoading}
                        onUpdatePlan={setGeneratedPlan}
                    />
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 py-8 px-4">
                    <div className="max-w-2xl mx-auto">
                        <div className="flex justify-between items-center mb-6">
                            <button
                                onClick={() => {
                                    const hasData = formData.name || formData.email || formData.phone;
                                    if (hasData && !draftId && !sourceTrainee) {
                                        const choice = window.confirm('יש לך נתונים לא שמורים.\nלחץ "אישור" לשמירת טיוטה לפני היציאה, או "ביטול" ליציאה ללא שמירה.');
                                        if (choice) { handleSaveDraft().then(() => onBack()); return; }
                                    }
                                    onBack();
                                }}
                                className="text-purple-600 hover:text-purple-700 font-semibold flex items-center gap-2"
                            >
                                ← חזרה
                            </button>
                            {!sourceTrainee && (
                                <div className="flex items-center gap-2">
                                    {draftSavedMsg && <span className="text-green-600 text-sm font-medium">{draftSavedMsg}</span>}
                                    <button
                                        type="button"
                                        onClick={handleSaveDraft}
                                        disabled={draftSaving}
                                        className="flex items-center gap-1 text-sm px-3 py-2 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 rounded-lg font-medium transition disabled:opacity-60"
                                    >
                                        {draftSaving ? '⏳' : '💾'} {draftId ? 'עדכן טיוטה' : 'שמור טיוטה'}
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="bg-white rounded-2xl shadow-xl p-8">
                            <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">
                                {sourceTrainee ? 'שכפול תוכנית למתאמן חדש' : draftTrainee ? 'המשך יצירת תוכנית' : 'יצירת תוכנית למתאמן'}
                            </h2>

                            {!sourceTrainee && hasAiProvider && (
                                <div className="flex bg-gray-100 rounded-xl p-1 mb-6">
                                    <button
                                        type="button"
                                        onClick={() => setPlanInputMode('build')}
                                        className={`flex-1 py-2 px-2 rounded-lg font-semibold transition text-sm ${planInputMode === 'build' ? 'bg-white shadow text-purple-700' : 'text-gray-500 hover:text-gray-700'}`}
                                    >
                                        🏋️ טופס מפורט
                                    </button>
                                    <button

        // Edit Existing Trainee Plan
        function EditTraineePlan({ trainee, onBack, onComplete }) {
            const { allowedAI } = React.useContext(TrainerContext);
            const [currentPlan, setCurrentPlan] = useState(trainee.workoutPlan);
            const [traineeName, setTraineeName] = useState(trainee.name || '');
            const [saving, setSaving] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const claudeApiKey = (allowedAI === 'all' || allowedAI === 'both') ? (localStorage.getItem('claudeApiKey') || '') : '';
            const geminiApiKey = (allowedAI === 'groq_gemini' || allowedAI === 'all' || allowedAI === 'both' || allowedAI === 'gemini') ? (localStorage.getItem('geminiApiKey') || '') : '';
            const groqApiKey = (allowedAI === 'groq' || allowedAI === 'groq_gemini' || allowedAI === 'all' || allowedAI === 'both') ? (localStorage.getItem('groqApiKey') || '') : '';
            const claudeViaProxy = !!(localStorage.getItem('anthropicProxyUrl') && (allowedAI === 'all' || allowedAI === 'both'));

            const handleSavePlan = async () => {
                setSaving(true);
                try {
                    const updates = { workoutPlan: currentPlan };
                    if (traineeName.trim() && traineeName.trim() !== trainee.name) {
                        updates.name = traineeName.trim();
                    }
                    await storage.updateTrainee(trainee.id, updates);
                    onComplete();
                } catch (error) {
                    console.error('Error updating plan:', error);
                    alert('שגיאה בשמירת התוכנית. אנא נסה שוב.');
                } finally {
                    setSaving(false);
                }
            };

            const handleRegeneratePlan = (systemPrompt) => {
                const updatedFormData = { ...trainee, _systemPrompt: systemPrompt || '' };
                const newPlan = generateWorkoutPlan(updatedFormData);
                setCurrentPlan(newPlan);
            };

            const handleAiRegenerate = async (changeRequest) => {
                if (!changeRequest || !changeRequest.trim()) {
                    alert('אנא תאר את השינוי הרצוי לפני שתלחץ על הכפתור');
                    return;
                }
                setAiLoading(true);
                try {
                    const newPlan = await editPlanWithClaude(currentPlan, trainee, changeRequest, claudeApiKey);
                    setCurrentPlan(newPlan);
                } catch (err) {
                    const msg = err.message || '';
                    const lowerMsg = msg.toLowerCase();
                    if (lowerMsg.includes('failed to fetch') || lowerMsg === 'load failed' || lowerMsg.includes('networkerror') || lowerMsg.includes('network error') || lowerMsg.includes('fetch')) {
                        alert('שגיאת חיבור לשרת AI. ודא שמפתח ה-API תקין ושחיבור האינטרנט פעיל.');
                    } else {
                        alert('שגיאה בעריכת תוכנית עם AI: ' + (msg || 'שגיאה לא ידועה'));
                    }
                } finally {
                    setAiLoading(false);
                }
            };

            const handleAiRegenerateGemini = async (changeRequest) => {
                if (!changeRequest || !changeRequest.trim()) {
                    alert('אנא תאר את השינוי הרצוי לפני שתלחץ על הכפתור');
                    return;
                }
                setAiLoading(true);
                try {
                    const newPlan = await editPlanWithGemini(currentPlan, trainee, changeRequest, geminiApiKey);
                    setCurrentPlan(newPlan);
                } catch (err) {
                    const msg = err.message || '';
                    const lowerMsg = msg.toLowerCase();
                    if (lowerMsg.includes('failed to fetch') || lowerMsg === 'load failed' || lowerMsg.includes('networkerror') || lowerMsg.includes('network error') || lowerMsg.includes('fetch')) {
                        alert('שגיאת חיבור לשרת AI. ודא שמפתח ה-API תקין ושחיבור האינטרנט פעיל.');
                    } else if (lowerMsg.includes('quota') || lowerMsg.includes('rate limit') || lowerMsg.includes('exceeded') || lowerMsg.includes('resource_exhausted') || lowerMsg.includes('429')) {
                        alert(getGeminiQuotaErrorMsg(msg));
                    } else {
                        alert('שגיאה בעריכת תוכנית עם Gemini: ' + (msg || 'שגיאה לא ידועה'));
                    }
                } finally {
                    setAiLoading(false);
                }
            };

            const handleAiRegenerateGroq = async (changeRequest) => {
                if (!changeRequest || !changeRequest.trim()) {
                    alert('אנא תאר את השינוי הרצוי לפני שתלחץ על הכפתור');
                    return;
                }
                setAiLoading(true);
                try {
                    const newPlan = await editPlanWithGroq(currentPlan, trainee, changeRequest, groqApiKey);
                    setCurrentPlan(newPlan);
                } catch (err) {
                    alert('שגיאה בעריכת תוכנית עם Groq: ' + (err.message || 'שגיאה לא ידועה'));
                } finally {
                    setAiLoading(false);
                }
            };

            return (
                <PlanPreviewEditor
                    formData={{ ...trainee, name: traineeName }}
                    workoutPlan={currentPlan}
                    onBack={onBack}
                    onSave={handleSavePlan}
                    onRegenerate={handleRegeneratePlan}
                    onAiRegenerate={(claudeApiKey || claudeViaProxy) ? handleAiRegenerate : null}
                    onAiRegenerateGemini={geminiApiKey ? handleAiRegenerateGemini : null}
                    onAiRegenerateGroq={groqApiKey ? handleAiRegenerateGroq : null}
                    aiRegenerateLoading={aiLoading}
                    onUpdatePlan={setCurrentPlan}
                    isEditMode={true}
                    saving={saving}
                    editableName={traineeName}
                    onNameChange={setTraineeName}
                />

            const previousPlan   = trainee.workoutPlan;
            const planNumber     = ((trainee.planHistory || []).length) + 2; // Plan #2, #3...
            const prevDuration   = previousPlan ? (previousPlan.duration || 0) : 0;
            // Week offset: continuation starts where previous plan ended
            const continuationFromWeek = prevDuration + 1;

            const [planDuration, setPlanDuration]               = React.useState('');
            const [customInstructions, setCustomInstructions]   = React.useState(trainee.customInstructions || '');
            const [generatedPlan, setGeneratedPlan]             = React.useState(null);
            const [step, setStep]                               = React.useState('settings');
            const [saving, setSaving]                           = React.useState(false);

            const handleGenerate = () => {
                const planData = {
                    ...trainee,
                    planWeeks: planDuration || undefined,
                    customInstructions,
                    continuationFromWeek
                };
                const newPlan = generateWorkoutPlan(planData);
                setGeneratedPlan({ ...newPlan, planNumber });
                setStep('preview');
            };

            const handleSave = async () => {
                setSaving(true);
                try {
                    const history = trainee.planHistory || [];
                    const archivedPlan = {
                        ...previousPlan,
                        archivedAt: new Date().toISOString(),
                        planNumber: planNumber - 1
                    };
                    await storage.updateTrainee(trainee.id, {
                        workoutPlan: generatedPlan,
                        planHistory: [...history, archivedPlan]
                    });
                    onComplete();
                } catch (error) {
                    console.error('Error saving continuation plan:', error);
                    alert('שגיאה בשמירת התוכנית. אנא נסה שוב.');
                } finally {
                    setSaving(false);

                const planData = {
                    ...trainee,
                    planWeeks: planDuration || undefined,
                    customInstructions: systemPrompt || customInstructions,
                    continuationFromWeek

                setGeneratedPlan({ ...generateWorkoutPlan(planData), planNumber });

• ${trainee.workoutPlan.duration} שבועות

🎯 לצפייה בתוכנית המלאה, לחץ כאן:
${traineeLink}

בהצלחה! 🔥`;
                                                    const whatsappText = encodeURIComponent(message);

        // Trainee View (accessed via link)
        function TraineeView({ traineeId }) {
            const [trainee, setTrainee] = useState(null);
            const [selectedWeek, setSelectedWeek] = useState(0);
            const [showFeedbackModal, setShowFeedbackModal] = useState(false);
            const [selectedWorkout, setSelectedWorkout] = useState(null);
            const [loading, setLoading] = useState(true);

            // Password protection state
            const [isAuthed, setIsAuthed] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState('');
            const [passwordLoading, setPasswordLoading] = useState(false);

            // Change password state
            const [showChangePassword, setShowChangePassword] = useState(false);
            const [currentPwInput, setCurrentPwInput] = useState('');
            const [newPwInput, setNewPwInput] = useState('');
            const [newPwConfirm, setNewPwConfirm] = useState('');
            const [changePwError, setChangePwError] = useState('');
            const [changePwSuccess, setChangePwSuccess] = useState('');

            useEffect(() => {
                loadTrainee();
            }, [traineeId]);

            const loadTrainee = async () => {
                setLoading(true);
                const data = await storage.getTrainee(traineeId);
                setTrainee(data);
                setLoading(false);
            };

            const handlePasswordSubmit = async (e) => {
                e.preventDefault();
                setPasswordError('');
                setPasswordLoading(true);
                try {
                    const enteredHash = await hashPassword(passwordInput);
                    // If no hash stored yet, use default
                    const storedHash = trainee.traineePasswordHash || await hashPassword(DEFAULT_TRAINEE_PASSWORD);
                    if (enteredHash === storedHash) {
                        setIsAuthed(true);
                    } else {
                        setPasswordError('סיסמה שגויה');
                    }
                } finally {
                    setPasswordLoading(false);
                }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                setChangePwError('');
                setChangePwSuccess('');
                if (newPwInput !== newPwConfirm) {
                    setChangePwError('הסיסמאות אינן תואמות');
                    return;
                }
                if (newPwInput.length < 4) {
                    setChangePwError('הסיסמה חייבת להכיל לפחות 4 תווים');
                    return;
                }
                const currentHash = await hashPassword(currentPwInput);
                const storedHash = trainee.traineePasswordHash || await hashPassword(DEFAULT_TRAINEE_PASSWORD);
                if (currentHash !== storedHash) {
                    setChangePwError('הסיסמה הנוכחית שגויה');
                    return;
                }
                const newHash = await hashPassword(newPwInput);
                const ok = await storage.updateTraineePassword(traineeId, newHash);
                if (ok) {
                    setTrainee(prev => ({ ...prev, traineePasswordHash: newHash }));
                    setChangePwSuccess('הסיסמה שונתה בהצלחה!');
                    setCurrentPwInput('');
                    setNewPwInput('');
                    setNewPwConfirm('');
                    setTimeout(() => { setShowChangePassword(false); setChangePwSuccess(''); }, 2000);
                } else {
                    setChangePwError('שגיאה בשמירת הסיסמה');
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <h1 className="text-2xl font-bold text-gray-800">טוען תוכנית...</h1>
                        </div>
                    </div>
                );
            }

            if (!trainee) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4">❌</div>
                            <h1 className="text-2xl font-bold text-gray-800">תוכנית לא נמצאה</h1>
                            <p className="text-gray-600 mt-2">הקישור אינו תקף או שהתוכנית נמחקה</p>
                        </div>
                    </div>
                );
            }

            // Password gate
            if (!isAuthed) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">🏋️</div>
                                <h1 className="text-2xl font-bold text-gray-800 mb-1">שלום, {trainee.name}!</h1>
                                <p className="text-gray-600">הזן סיסמה לצפייה בתוכנית האימונים שלך</p>
                            </div>
                            <form onSubmit={handlePasswordSubmit} className="space-y-4">
                                <input
                                    type="password"
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                    placeholder="סיסמה (ברירת מחדל: 1234)"
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                                {passwordError && (
                                    <div className="text-red-600 text-sm text-center">{passwordError}</div>
                                )}
                                <button
                                    type="submit"
                                    disabled={passwordLoading}
                                    className="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold py-3 px-6 rounded-xl transition"
                                >
                                    {passwordLoading ? 'בודק...' : 'כניסה'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const currentWeek = trainee.workoutPlan.weeks[selectedWeek];

            const handleWorkoutComplete = async (weekIndex, workoutIndex) => {
                const updatedTrainee = { ...trainee };
                const workout = updatedTrainee.workoutPlan.weeks[weekIndex].workouts[workoutIndex];
                const nowCompleted = !workout.completed;
                workout.completed = nowCompleted;
                workout.completedAt = nowCompleted ? new Date().toISOString() : null;

                const saved = await storage.updateTrainee(trainee.id, updatedTrainee);
                if (saved) {
                    setTrainee(saved);
                }
            };

            const handleFeedbackSubmit = async (difficulty, feedback) => {
                const updatedTrainee = { ...trainee };
                const workout = updatedTrainee.workoutPlan.weeks[selectedWeek].workouts.find(
                    w => w.day === selectedWorkout.day
                );
                workout.difficulty = difficulty;
                workout.feedback = feedback;
                workout.feedbackSentToTrainer = true;
                workout.feedbackRead = false;
                workout.feedbackSentAt = new Date().toISOString();
                
                const saved = await storage.updateTrainee(trainee.id, updatedTrainee);
                if (saved) {
                    setTrainee(saved);
                }
                setShowFeedbackModal(false);
                setSelectedWorkout(null);
            };

            const completedWorkouts = trainee.workoutPlan.weeks.reduce((total, week) => 
                total + week.workouts.filter(w => w.completed).length, 0
            );
            const totalWorkouts = trainee.workoutPlan.weeks.reduce((total, week) => 
                total + week.workouts.length, 0
            );
            const progressPercentage = Math.round((completedWorkouts / totalWorkouts) * 100);

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto flex justify-between items-start">
                            <div>
                                <h1 className="text-2xl font-bold">שלום, {trainee.name}! 💪</h1>
                                <p className="text-purple-100 mt-1">תוכנית האימונים האישית שלך</p>
                            </div>
                            <button
                                onClick={() => setShowChangePassword(true)}
                                className="bg-white bg-opacity-20 hover:bg-opacity-30 text-white text-sm px-3 py-1 rounded-lg transition"
                            >
                                שנה סיסמה
                            </button>
                        </div>
                    </div>

                    {showChangePassword && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                                <h2 className="text-xl font-bold text-gray-800 mb-6">שינוי סיסמה</h2>
                                <form onSubmit={handleChangePassword} className="space-y-4">
                                    <input
                                        type="password"
                                        value={currentPwInput}
                                        onChange={(e) => setCurrentPwInput(e.target.value)}
                                        placeholder="סיסמה נוכחית"
                                        required
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                    />
                                    <input
                                        type="password"
                                        value={newPwInput}
                                        onChange={(e) => setNewPwInput(e.target.value)}
                                        placeholder="סיסמה חדשה"
                                        required
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                    />
                                    <input
                                        type="password"
                                        value={newPwConfirm}
                                        onChange={(e) => setNewPwConfirm(e.target.value)}
                                        placeholder="אימות סיסמה חדשה"
                                        required
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                    />
                                    {changePwError && <div className="text-red-600 text-sm text-center">{changePwError}</div>}
                                    {changePwSuccess && <div className="text-green-600 text-sm text-center">{changePwSuccess}</div>}
                                    <div className="flex gap-3">
                                        <button
                                            type="button"
                                            onClick={() => { setShowChangePassword(false); setChangePwError(''); setChangePwSuccess(''); }}
                                            className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-xl transition"
                                        >
                                            ביטול
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition"
                                        >
                                            שמור
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="max-w-6xl mx-auto p-6">
                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">התקדמות כללית</h2>
                            <div className="flex items-center gap-4 mb-3">
                                <div className="flex-1 bg-gray-200 rounded-full h-4">
                                    <div
                                        className="bg-gradient-to-r from-purple-500 to-indigo-500 h-4 rounded-full transition-all"
                                        style={{ width: `${progressPercentage}%` }}
                                    />
                                </div>
                                <span className="text-2xl font-bold text-purple-600">{progressPercentage}%</span>
                            </div>
                            <p className="text-gray-600">השלמת {completedWorkouts} מתוך {totalWorkouts} אימונים</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">בחר שבוע</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                                {trainee.workoutPlan.weeks.map((week, index) => {
                                    const weekCompleted = week.workouts.filter(w => w.completed).length;
                                    const weekTotal = week.workouts.length;
                                    return (
                                        <button
                                            key={index}
                                            onClick={() => setSelectedWeek(index)}
                                            className={`p-4 rounded-xl font-semibold transition-all ${
                                                selectedWeek === index
                                                    ? 'bg-purple-600 text-white shadow-lg scale-105'
                                                    : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                            }`}
                                        >
                                            <div>שבוע {index + 1}</div>
                                            <div className="text-sm mt-1">{weekCompleted}/{weekTotal}</div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="space-y-4">
                            {currentWeek.workouts.map((workout, index) => (
                                <div key={index} className="bg-white rounded-2xl shadow-lg p-6">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex items-center gap-4">
                                            <div className={`text-4xl ${workout.type === 'כוח' ? '🏋️' : '🏃'}`}></div>
                                            <div>
                                                <h3 className="text-xl font-bold text-gray-800">
                                                    יום {workout.day} - אימון {workout.type}
                                                </h3>
                                                {workout.completed && !trainee.workoutPlan?.disableCompletionTracking && (
                                                    <span className="inline-block bg-green-100 text-green-800 text-sm px-3 py-1 rounded-full mt-1">
                                                        ✓ הושלם
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        {!trainee.workoutPlan?.disableCompletionTracking && (
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => handleWorkoutComplete(selectedWeek, index)}
                                                className={`px-4 py-2 rounded-lg font-semibold transition ${
                                                    workout.completed
                                                        ? 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                        : 'bg-green-500 text-white hover:bg-green-600'
                                                }`}
                                            >
                                                {workout.completed ? 'ביטול' : 'סיימתי'}
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setSelectedWorkout(workout);
                                                    setShowFeedbackModal(true);
                                                }}
                                                className="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg font-semibold hover:bg-purple-200 transition"
                                            >
                                                פידבק
                                            </button>
                                        </div>
                                        )}
                                    </div>

                                    {/* Exercises */}
                                    <div className="space-y-3">
                                        {workout.exercises.map((exercise, exIndex) => (
                                            <div key={exIndex} className="bg-gray-50 p-4 rounded-lg">
                                                <div className="font-semibold text-gray-800 mb-2">{exercise.name}</div>
                                                <div className="text-gray-600 text-sm space-y-1">
                                                    {exercise.warmup && <div><strong>חימום:</strong> {exercise.warmup}</div>}
                                                    {exercise.main && <div><strong>עיקרי:</strong> {exercise.main}</div>}
                                                    {exercise.structure && <div><strong>מבנה:</strong> {exercise.structure}</div>}
                                                    {exercise.progression && <div><strong>התקדמות:</strong> {exercise.progression}</div>}
                                                    {exercise.strides && <div><strong>מתגברות:</strong> {exercise.strides}</div>}
                                                    {exercise.cooldown && <div><strong>התאוששות:</strong> {exercise.cooldown}</div>}
                                                    {exercise.pace && <div><strong>קצב:</strong> {exercise.pace}</div>}
                                                    {exercise.intensity && <div><strong>עצימות:</strong> {exercise.intensity}</div>}
                                                    {!!exercise.sets && <div>סטים: {exercise.sets}</div>}
                                                    {!!exercise.reps && <div>חזרות: {exercise.reps}</div>}
                                                    {!!exercise.duration && <div>משך: {exercise.duration}</div>}
                                                    {!!exercise.rest && <div>מנוחה: {exercise.rest} שניות</div>}
                                                    {exercise.recommendedWeight && (
                                                        <div className="bg-green-100 p-2 rounded mt-2 border border-green-300">
                                                            <strong className="text-green-800">💪 משקל מומלץ: {exercise.recommendedWeight}</strong>
                                                        </div>
                                                    )}
                                                    {exercise.weightNote && (
                                                        <div className="text-green-700 text-xs mt-1">
                                                            📊 {exercise.weightNote}
                                                        </div>
                                                    )}
                                                    {exercise.notes && <div className="text-purple-600 mt-2">💡 {exercise.notes}</div>}
                                                    {exercise.tips && <div className="text-blue-600 mt-2">✨ {exercise.tips}</div>}
                                                    {exercise.sets > 0 && (() => {
                                                        const vUrl = exercise.videoUrl !== undefined ? exercise.videoUrl : getDefaultExerciseVideoUrl(exercise.name);
                                                        return vUrl ? <a href={vUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1 text-red-500 text-xs mt-2 hover:underline">🎥 הדגמת התרגיל</a> : null;
                                                    })()}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {workout.difficulty && (
                                        <div className="mt-4 p-4 bg-blue-50 rounded-lg">
                                            <div className="font-semibold text-blue-900 mb-1">הפידבק שלך:</div>
                                            <div className="text-blue-800">רמת קושי: {workout.difficulty}</div>
                                            {workout.feedback && <div className="text-blue-700 mt-1">{workout.feedback}</div>}
                                            {workout.feedbackSentToTrainer && (
                                                <div className="text-green-600 text-sm mt-2">✓ נשלח למאמן</div>
                                            )}
                                            {workout.trainerReply && (
                                                <div className="mt-3 pt-3 border-t border-blue-200">
                                                    <div className="font-semibold text-purple-900 mb-1">💬 תגובת המאמן:</div>
                                                    <div className="text-purple-700">{workout.trainerReply}</div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    {showFeedbackModal && (
                        <FeedbackModal
                            workout={selectedWorkout}
                            onClose={() => {
                                setShowFeedbackModal(false);
                                setSelectedWorkout(null);
                            }}
                            onSubmit={handleFeedbackSubmit}
                        />
                    )}
                </div>
            );
        }

        // Feedback Modal
        function FeedbackModal({ workout, onClose, onSubmit }) {
            const [difficulty, setDifficulty] = useState(workout.difficulty || '');
            const [feedback, setFeedback] = useState(workout.feedback || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(difficulty, feedback);
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                        <h3 className="text-2xl font-bold text-gray-800 mb-4">פידבק על האימון</h3>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 font-semibold mb-2">רמת קושי</label>
                                <div className="space-y-2">
                                    {['קל מדי', 'מתאים', 'קשה מדי'].map(level => (
                                        <label key={level} className="flex items-center gap-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                            <input
                                                type="radio"
                                                name="difficulty"
                                                value={level}
                                                checked={difficulty === level}
                                                onChange={(e) => setDifficulty(e.target.value)}
                                                required
                                                className="w-5 h-5 text-purple-600"
                                            />
                                            <span className="text-gray-700">{level}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="block text-gray-700 font-semibold mb-2">הערות למאמן (אופציונלי)</label>
                                <textarea
                                    value={feedback}
                                    onChange={(e) => setFeedback(e.target.value)}
                                    rows="4"
                                    placeholder="איך היה האימון? יש משהו שתרצה לשתף?"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>

                            <div className="flex gap-3">
                                <button
                                    type="submit"
                                    className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition"
                                >
                                    שלח למאמן
                                </button>
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 rounded-xl transition"
                                >
                                    ביטול
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ─── GROUP PROGRAM: Create Screen (Trainer) ───────────────────────────
        function GroupProgramCreateScreen({ onBack, onComplete, trainees }) {
            const { allowedAI } = React.useContext(TrainerContext);
            const [programName, setProgramName] = useState('');
            const [description, setDescription] = useState('');
            const [selectedTraineeId, setSelectedTraineeId] = useState('');
            const [saving, setSaving] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiError, setAiError] = useState(null);
            const [aiText, setAiText] = useState('');
            const [aiGeneratedPlan, setAiGeneratedPlan] = useState(null);
            const claudeApiKey = (allowedAI === 'all' || allowedAI === 'both') ? (localStorage.getItem('claudeApiKey') || '') : '';
            const geminiApiKey = (allowedAI === 'groq_gemini' || allowedAI === 'all' || allowedAI === 'both' || allowedAI === 'gemini') ? (localStorage.getItem('geminiApiKey') || '') : '';
            const groqApiKey = (allowedAI === 'groq' || allowedAI === 'groq_gemini' || allowedAI === 'all' || allowedAI === 'both') ? (localStorage.getItem('groqApiKey') || '') : '';
            const claudeViaProxy = !!(localStorage.getItem('anthropicProxyUrl') && (allowedAI === 'all' || allowedAI === 'both'));
            const hasAiProvider = !!(claudeApiKey || claudeViaProxy || geminiApiKey || groqApiKey);

            const availableTrainees = trainees.filter(t => !t.archived && !t.isDraft && t.workoutPlan);

            const handleGroupAiGenerate = async (provider) => {
                if (!aiText.trim()) { setAiError('אנא הכנס תיאור של התוכנית הקבוצתית'); return; }
                if (!programName.trim()) { setAiError('אנא הכנס שם לתוכנית לפני יצירה עם AI'); return; }
                setAiError(null);
                setAiLoading(true);
                try {
                    const fakeFormData = { name: programName.trim() };
                    const approvedExercises = getAllExerciseNames([]);
                    const plan = provider === 'gemini'
                        ? await generatePlanWithGemini(fakeFormData, geminiApiKey, { naturalDescription: aiText, approvedExercises })
                        : provider === 'groq'
                        ? await generatePlanWithGroq(fakeFormData, groqApiKey, { naturalDescription: aiText, approvedExercises })
                        : await generatePlanWithClaude(fakeFormData, claudeApiKey, { naturalDescription: aiText, approvedExercises });
                    // Auto-save immediately after generation
                    setSaving(true);
                    const program = {
                        id: 'gp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                        name: programName.trim(),
                        description: description.trim(),
                        workoutPlan: plan,
                        registrationOpen: true
                    };
                    await groupStorage.saveGroupProgram(program);
                    onComplete();
                } catch (err) {
                    const msg = err.message || '';
                    setAiError(msg || 'שגיאה ביצירת תוכנית עם AI');
                } finally {
                    setAiLoading(false);
                    setSaving(false);
                }
            };

            const handleCreate = async () => {
                if (!programName.trim()) {
                    alert('נא להזין שם לתוכנית');
                    return;
                }
                setSaving(true);
                try {
                    let workoutPlan = null;
                    if (aiGeneratedPlan) {
                        workoutPlan = aiGeneratedPlan;
                    } else if (selectedTraineeId) {
                        const tpl = availableTrainees.find(t => t.id === selectedTraineeId);
                        if (tpl && tpl.workoutPlan) {
                            workoutPlan = JSON.parse(JSON.stringify(tpl.workoutPlan));
                            workoutPlan.weeks.forEach(week => {
                                week.workouts.forEach(workout => {
                                    delete workout.completed;
                                    delete workout.feedback;
                                    delete workout.difficulty;
                                    delete workout.feedbackSentToTrainer;
                                    delete workout.feedbackRead;
                                });
                            });
                        }
                    }
                    const program = {
                        id: 'gp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                        name: programName.trim(),
                        description: description.trim(),
                        workoutPlan,
                        registrationOpen: true
                    };
                    await groupStorage.saveGroupProgram(program);
                    onComplete();
                } catch (error) {
                    alert('שגיאה ביצירת תוכנית: ' + error.message);
                } finally {
                    setSaving(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-4xl mx-auto">
                            <button onClick={onBack} className="mb-4 text-white hover:text-purple-100 font-semibold flex items-center gap-2">
                                ← חזרה
                            </button>
                            <h1 className="text-2xl font-bold">יצירת תוכנית קבוצתית</h1>
                            <p className="text-purple-100 mt-1">תוכנית שמתאמנים יכולים להירשם אליה בעצמם</p>
                        </div>
                    </div>
                    <div className="max-w-4xl mx-auto p-6 space-y-6">
                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-6">פרטי התוכנית</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-gray-700 font-semibold mb-2">שם התוכנית *</label>
                                    <input
                                        type="text"
                                        value={programName}
                                        onChange={(e) => setProgramName(e.target.value)}
                                        placeholder="לדוגמה: תוכנית כושר ינואר 2025"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-semibold mb-2">תיאור (אופציונלי)</label>
                                    <textarea
                                        value={description}
                                        onChange={(e) => setDescription(e.target.value)}
                                        rows="3"
                                        placeholder="תיאור קצר של התוכנית..."
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-semibold mb-2">בסס על תוכנית קיימת (אופציונלי)</label>
                                    <p className="text-sm text-gray-500 mb-2">בחר תוכנית מתאמן קיים לשימוש כתבנית לתוכנית הקבוצתית</p>
                                    <select
                                        value={selectedTraineeId}
                                        onChange={(e) => setSelectedTraineeId(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                    >
                                        <option value="">ללא תבנית</option>
                                        {availableTrainees.map(t => (
                                            <option key={t.id} value={t.id}>
                                                {t.name} — {t.workoutPlan.weeks ? t.workoutPlan.weeks.length : 0} שבועות
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </div>
                        {hasAiProvider && (
                            <div className="bg-white rounded-2xl shadow-lg p-6">
                                <h2 className="text-xl font-bold text-gray-800 mb-1">✨ יצירת תוכנית עם AI</h2>
                                <p className="text-sm text-gray-500 mb-4">תאר את התוכנית הקבוצתית בחופשיות ו-AI יבנה אותה עבורך</p>
                                <textarea
                                    value={aiText}
                                    onChange={(e) => { setAiText(e.target.value); setAiError(null); }}
                                    rows={5}
                                    placeholder={'לדוגמה: תוכנית כושר לקבוצת מתחילים, 8 שבועות, 3 אימונים בשבוע, 45 דקות כל אימון. התמקדות בכוח כללי ושריפת שומן. ציוד: מכון כושר מלא.'}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none mb-4"
                                    dir="auto"
                                />
                                {aiError && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm mb-4">
                                        ⚠️ {aiError}
                                    </div>
                                )}
                                {aiGeneratedPlan && (
