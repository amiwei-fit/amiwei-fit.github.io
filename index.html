                    if (!mentioned) continue;

                    const isExcluded = kw.some(k =>
                        exclPrefixes.some(p =>
                            customInstructions.includes(p + k) ||
                            customInstructions.toLowerCase().includes(p + k.toLowerCase())
                        )
                    );

                    if (isExcluded) {
                        toExclKw.push(...kw);
                    } else {
                        toInject.push({ kw, ex: getEx(customInstructions) });
                    }
                }

                // Remove excluded exercises from auto-selected list
                if (toExclKw.length > 0) {
                    exercises = exercises.filter(e =>
                        !toExclKw.some(k => e.name.toLowerCase().includes(k.toLowerCase()))
                    );
                }

                // Prepend requested exercises (after removing duplicates from auto-selected list)
                if (toInject.length > 0) {
                    const allInjectedKw = toInject.flatMap(({ kw }) => kw);
                    exercises = exercises.filter(e =>
                        !allInjectedKw.some(k => e.name.toLowerCase().includes(k.toLowerCase()))
                    );
                    exercises = [...toInject.map(({ ex }) => ex), ...exercises];
                }
            }

            // Limit based on workout duration
            const avgTimePerExercise = 7;
            const maxExercises = Math.floor(parseInt(workoutDuration) / avgTimePerExercise);

            return exercises.slice(0, maxExercises);
        };

        // General strength workout for overall fitness
        const generateGeneralStrengthWorkout = (level, workoutDuration, availableEquipment, customInstructions = '') => {
            const hasGym = availableEquipment.includes('חדר כושר מלא');
            const hasDumbbells = availableEquipment.includes('משקולות חופשיות (דמבלים/קטלבלים)') || hasGym;

            let exercises;

            if (hasGym || hasDumbbells) {
                exercises = [
                    { name: 'סקוואט', sets: 3, reps: '12-15', rest: 90, notes: 'רגליים וליבה' },
                    { name: 'בשכיבה לחיצת חזה', sets: 3, reps: '10-12', rest: 90, notes: 'חזה וזרועות' },
                    { name: 'חתירה', sets: 3, reps: '10-12', rest: 90, notes: 'גב' },
                    { name: 'לאנג\'ים', sets: 3, reps: '10 לכל רגל', rest: 60, notes: 'רגליים' },
                    { name: 'פלאנק', sets: 3, duration: '45 שניות', rest: 60, notes: 'ליבה' }
                ];
            } else {
                // Bodyweight: choose push-up variation based on level
                const pushExercise = level === 'מתחיל'
                    ? { name: 'נגיעות כתף (Shoulder Taps)', sets: 4, reps: '10 לכל צד', rest: 60, notes: 'חיזוק ליבה ויציבות כתף. חלופה מומלצת עד שמבצעים 8+ שכיבות סמיכה.' }
                    : level === 'בינוני'
                        ? { name: 'שכיבת סמיכה + Shoulder Tap לסירוגין', sets: 4, reps: '8-10', rest: 60, notes: 'ביצוע: שכיבת סמיכה → tap ימין → שכיבת סמיכה → tap שמאל. חזה, כתפיים, ליבה.' }
                        : { name: 'שכיבות סמיכה', sets: 4, reps: '15', rest: 60, notes: 'חזה וזרועות' };
                exercises = [
                    { name: 'סקוואט עמוק', sets: 4, reps: '20', rest: 60, notes: 'רגליים' },
                    pushExercise,
                    { name: 'חתירה אוסטרלית (Australian Pull-ups)', sets: 3, reps: '12', rest: 90, notes: 'גב - על מוט נמוך' },
                    { name: 'לאנג\'ים', sets: 3, reps: '12 לכל רגל', rest: 60, notes: 'רגליים' },
                    { name: 'פלאנק', sets: 3, duration: '45 שניות', rest: 60, notes: 'ליבה' }
                ];
            }

            if (level === 'מתקדם') {
                if (hasGym || hasDumbbells) {
                    exercises.push(
                        { name: 'דד-ליפט', sets: 4, reps: '8', rest: 120, notes: 'כל הגוף' },
                        { name: 'שכיבות סמיכה צמודות', sets: 3, reps: '12', rest: 60, notes: 'טריצפס וחזה' }
                    );
                }
            }

            // Apply free-text exercise instructions (same engine as muscle-building workouts)
            if (customInstructions) {
                const exKeywordMap = [
                    { kw: ['עליות מתח', 'pull-up', 'pullup', 'chin-up'],
                      getEx: (txt) => {
                          const m = txt.match(/מקסימום\s*(\d+)/);
                          const cm = m ? parseInt(m[1]) : null;
                          return { name: 'עליות מתח (Pull-ups)', sets: 4,
                              reps: cm ? `${Math.max(6,Math.round(cm*0.7))}-${Math.round(cm*0.85)}` : 'מקסימום',
                              rest: 120, notes: cm ? `גב וביצפס. מקסימום נוכחי: ${cm}. עבוד ב-70-85%.` : 'גב וביצפס.' };
                      } },
                    { kw: ['חתירה', 'bent over row', 'barbell row', 'rowing'],
                      getEx: () => ({ name: 'חתירה בהטיית גו (Bent Over Row)', sets: 3, reps: '10-12', rest: 90, notes: 'גב.' }) },
                    { kw: ['מקבילים', 'parallel bar dips'],
                      getEx: () => ({ name: 'מקבילים (Parallel Bar Dips)', sets: 3, reps: '10-15', rest: 90, notes: 'חזה תחתון + טריצפס.' }) },
                    { kw: ['בנץ', 'bench press', 'bench', 'לחיצת חזה'],
                      getEx: (txt) => {
                          const isDumb = txt.includes('משקולות') || txt.includes('דמבל') || txt.toLowerCase().includes('dumbbell');
                          return isDumb
                              ? { name: 'לחיצת חזה בשכיבה עם משקוליות יד (Dumbbell Bench Press)', sets: 3, reps: '10-12', rest: 90, notes: 'חזה.' }
                              : { name: 'לחיצת חזה בשכיבה עם מוט (Flat Bench Press)', sets: 3, reps: '10-12', rest: 90, notes: 'חזה, כתפיים, טריצפס.' };
                      } },
                    { kw: ['שכיבות סמיכה', 'push-up', 'pushup'],
                      getEx: () => ({ name: 'שכיבות סמיכה (Push-ups)', sets: 4, reps: '15-20', rest: 60, notes: 'חזה, כתפיים, טריצפס.' }) },
                    { kw: ['רומניאן', 'romanian deadlift', 'rdl'],
                      getEx: () => ({ name: 'רומניאן דד-ליפט (Romanian Deadlift)', sets: 3, reps: '10-12', rest: 90, notes: 'המסטרינג וגלוטס.' }) },
                    { kw: ['דד-ליפט', 'deadlift', 'dead lift'],
                      getEx: () => ({ name: 'דד-ליפט (Deadlift)', sets: 3, reps: '8-10', rest: 120, notes: 'כל הגוף. שרשרת אחורית.' }) },
                    { kw: ['סקוואט', 'סקווט', 'squat'],
                      getEx: () => ({ name: 'סקוואט (Squat)', sets: 3, reps: '12-15', rest: 90, notes: 'שרשרת קדמית.' }) },
                    { kw: ["לאנג'ים", 'לאנגים', 'lunges', 'lunge'],
                      getEx: () => ({ name: "לאנג'ים (Lunges)", sets: 3, reps: '12 לכל רגל', rest: 60, notes: 'שרשרת קדמית.' }) },
                    { kw: ['לחיצת רגליים', 'leg press'],
                      getEx: () => ({ name: 'לחיצת רגליים במכונה (Leg Press)', sets: 3, reps: '12-15', rest: 90, notes: 'Quad.' }) },
                    { kw: ['כפיפת ברכיים', 'leg curl'],
                      getEx: () => ({ name: 'כפיפת ברכיים במכונה (Leg Curl)', sets: 3, reps: '12-15', rest: 60, notes: 'המסטרינג.' }) },
                    { kw: ['לחיצת כתפיים', 'overhead press', 'shoulder press', 'ohp', 'military press'],
                      getEx: () => ({ name: 'לחיצת כתפיים (Overhead Press)', sets: 3, reps: '10-12', rest: 90, notes: 'כתפיים.' }) },
                    { kw: ['הרחקה לצד', 'הרחקת כתפיים', 'lateral raise'],
                      getEx: () => ({ name: 'הרחקת כתפיים לצד (Lateral Raise)', sets: 3, reps: '12-15', rest: 60, notes: 'כתפיים.' }) },
                    { kw: ['כפיפת מרפקים', 'bicep curl', 'bicep curls'],
                      getEx: () => ({ name: 'כפיפת מרפקים (Bicep Curls)', sets: 3, reps: '10-12', rest: 60, notes: 'ביצפס.' }) },
                    { kw: ['פשיטת מרפקים', 'tricep extension', 'triceps pushdown'],
                      getEx: () => ({ name: 'פשיטת מרפקים בפולי (Triceps Pushdown)', sets: 3, reps: '12-15', rest: 60, notes: 'טריצפס.' }) },
                    { kw: ['פלאנק', 'plank'],
                      getEx: () => ({ name: 'פלאנק', sets: 3, duration: '60 שניות', rest: 60, notes: 'ליבה.' }) },
                    { kw: ['כפיפות בטן', 'crunches'],
                      getEx: () => ({ name: 'כפיפות בטן (Crunches)', sets: 3, reps: '20', rest: 45, notes: 'בטן קדמית.' }) },
                    { kw: ['קטלבל', 'kettlebell'],
                      getEx: () => ({ name: 'Kettlebell Swing', sets: 3, reps: '15-20', rest: 90, notes: 'Full Body.' }) },
                ];

                const exclPrefixes = ['בלי ', 'ללא ', 'הסר ', 'הוצא ', 'אל תכלול ', 'אל תוסיף '];
                const toInject = [];
                const toExclKw = [];

                for (const { kw, getEx } of exKeywordMap) {
                    const mentioned = kw.some(k =>
                        customInstructions.includes(k) ||
                        customInstructions.toLowerCase().includes(k.toLowerCase())
                    );
                    if (!mentioned) continue;

                    const isExcluded = kw.some(k =>
                        exclPrefixes.some(p =>
                            customInstructions.includes(p + k) ||
                            customInstructions.toLowerCase().includes(p + k.toLowerCase())
                        )
                    );

                    if (isExcluded) {
                        toExclKw.push(...kw);
                    } else {
                        toInject.push({ kw, ex: getEx(customInstructions) });
                    }
                }

                if (toExclKw.length > 0) {
                    exercises = exercises.filter(e =>
                        !toExclKw.some(k => e.name.toLowerCase().includes(k.toLowerCase()))
                    );
                }

                if (toInject.length > 0) {
                    const allInjectedKw = toInject.flatMap(({ kw }) => kw);
                    exercises = exercises.filter(e =>
                        !allInjectedKw.some(k => e.name.toLowerCase().includes(k.toLowerCase()))
                    );
                    exercises = [...toInject.map(({ ex }) => ex), ...exercises];
                }
            }

            const avgTimePerExercise = 7;
            const maxExercises = Math.floor(parseInt(workoutDuration) / avgTimePerExercise);
            return exercises.slice(0, maxExercises);
        };

        // Calculate realistic running distance (km) from run time (min) and pace zones
        // Used to show honest distances instead of hardcoded ranges
        const calcRunDistKm = (runMinutes, paceZones, level) => {
            let avgPaceMin;
            if (paceZones && paceZones.easy) {
                const segs = paceZones.easy.split('-').map(p => {
                    const [m, s] = p.trim().split(':').map(Number);
                    return m + (s || 0) / 60;
                });
                avgPaceMin = segs.length === 2 ? (segs[0] + segs[1]) / 2 : segs[0];
            } else {
                avgPaceMin = level === 'advanced' ? 5.25 : level === 'intermediate' ? 6.25 : 7.5;
            }
            return runMinutes / avgPaceMin;
        };

        const generateCardioWorkout = (goals, level, multiplier, cardioTarget = {}, week, workoutDuration = 60, totalWeeks = 12, phase = { name: 'בסיס', key: 'base' }, runningSessionIdx = 0, forcedCardioType = null) => {
            // Always route to running when aerobic goal is selected
            const isRunningProgram = goals.includes('שיפור יכולת אירובית');

            if (isRunningProgram) {
                return generateRunningWorkout(cardioTarget, week, workoutDuration, goals, totalWeeks, phase, runningSessionIdx);
            }
            
            // General cardio workout (non-running focused)
            const cardioDuration = parseInt(workoutDuration);
            let intensity;
            if (level === 'מתחיל') {
                intensity = 'קל-בינוני';
            } else if (level === 'בינוני') {
                intensity = 'בינוני';
            } else {
                intensity = 'בינוני-גבוה';
            }

            const cardioOptions = ['ריצה', 'אופניים', 'שחייה', 'קפיצות חבל', 'אליפטיקל'];
            let selectedCardio = forcedCardioType || cardioOptions[Math.floor(Math.random() * cardioOptions.length)];
            let notes = goals.includes('ירידה במשקל') 
                ? 'שמור על קצב קבוע, דופק 60-70% מהמקסימום'
                : 'התמקד בסיבולת, דופק 70-80% מהמקסימום';

            const exercises = [
                {
                    name: selectedCardio,
                    duration: `${cardioDuration} דקות`,
                    intensity: intensity,
                    notes: notes
                }
            ];

            if (goals.includes('שיפור יכולת אירובית') && cardioDuration >= 45) {
                exercises.push({
                    name: 'תרגילי כוח קצרים (סיום האימון)',
                    sets: 2,
                    reps: '15-20',
                    rest: 30,
                    notes: 'בחר 3-4 תרגילים: שכיבות סמיכה, סקוואט, פלאנק, לאנג\'ים - כל תרגיל 15-20 חזרות'
                });
            }

            return exercises;
        };

        // Advanced Running Workout Generator based on BC Running (מועדון ארוחת הבוקר) methodology
        // Core BC Running principles (Lydiard-based):
        // 1. הדרגתיות (Gradualism) - build slowly, no shortcuts
        // 2. מתינות (Moderation) - "train, don't strain"
        // 3. האומץ להאט (Courage to slow down) - to run faster, first learn to run SLOWER
        // 4. עקביות (Consistency) - long-term commitment builds champions
        // 5. עבודה עם הגוף (Work with the body) - listen, adapt, respect recovery
        // 6. פרטלק > אינטרוולים - creative fartlek preferred over rigid track intervals
        // 7. בסיס אירובי (Aerobic base) - foundation before quality, Lydiard method
        const generateRunningWorkout = (cardioTarget, week, workoutDuration, goals, totalWeeks = 12, phase = { name: 'בסיס', key: 'base' }, runningSessionIdx = 0) => {
            const { runningLevel, raceGoal, current5kTime, current10kTime } = cardioTarget;
            const duration = parseInt(workoutDuration);

            // Resolve personal pace zones from 5K (or 10K) time
            const paceZones = getPaceFrom5K(current5kTime) || getPaceFrom10K(current10kTime) || null;

            // BC Running 4-week cycle (Nachshon Shochat methodology):
            // Cycle: Long Run → Easy+Strides → Fartlek → Tempo/Progression/Test
            const weekInCycle = ((week - 1) % 4) + 1;

            // Phase-based workout selection (periodization):
            // Base phase: mostly easy + long run, minimal quality
            // Build phase: introduce fartlek + tempo
            // Peak phase: full quality mix
            // Taper: shorter, easy + some quality to stay sharp

            if (runningLevel === 'beginner') {
                return generateWalkToRunWorkout(week, duration);
            }

            return generateAdvancedRunningWorkout(weekInCycle, duration, runningLevel || 'intermediate', raceGoal || 'general', week, paceZones, phase, totalWeeks, runningSessionIdx);
        };

        // Running Warmup Protocol (based on Ohio State / uploaded document)
        const getRunningWarmup = () => {
            return '5 דקות הליכה מהירה + תרגילי חימום: סיבובי ראש, סיבובי כתפיים לאחור, סיבובי זרועות, מעגלי ירכיים, סקוואטים בהליכה, ספיידרמן לאנג\'ים, הרמת ברכיים, בעיטות לישבן, סיבובי קרסול (10 חזרות כל תרגיל)';
        };

        // Walk-to-Run Program - Full 48-session plan (based on uploaded תוכנית מהליכה לריצה)
        // 3 sessions/week = 16 weeks total
        const generateWalkToRunWorkout = (week, duration) => {
            // Full 48-session program mapped to weeks (3 sessions/week)
            // Each entry covers one "phase" of training weeks
            const programs = [
                // Phase 1 - Weeks 1-3 (Sessions 1-9): 30s run / 2.5 min walk
                { week: 1,  intervals: 5,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה', phase: '1' },
                { week: 2,  intervals: 7,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה', cooldown: '5 דקות הליכה', phase: '1' },
                { week: 3,  intervals: 9,  run: '30 שניות',   walk: '2.5 דקות', warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '1' },
                // Phase 2 - Weeks 4-6 (Sessions 10-18): 1 min run / 2 min walk
                { week: 4,  intervals: 5,  run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '2' },
                { week: 5,  intervals: 7,  run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '2' },
                { week: 6,  intervals: 10, run: 'דקה',        walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '2' },
                // Phase 3 - Weeks 7-9 (Sessions 19-27): 2-3 min run / 2 min walk
                { week: 7,  intervals: 4,  run: '2 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '3' },
                { week: 8,  intervals: 5,  run: '2.5 דקות',   walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '3' },
                { week: 9,  intervals: 6,  run: '3 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '3' },
                // Phase 4 - Weeks 10-12 (Sessions 28-36): 4-6 min run / 2 min walk
                { week: 10, intervals: 4,  run: '4 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '4' },
                { week: 11, intervals: 4,  run: '5 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '4' },
                { week: 12, intervals: 4,  run: '6 דקות',     walk: '2 דקות',   warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '4' },
                // Phase 5 - Weeks 13-16 (Sessions 37-48): 7-20 min → continuous
                { week: 13, intervals: 3,  run: '8 דקות',     walk: 'דקה',      warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '5' },
                { week: 14, intervals: 2,  run: '12 דקות',    walk: 'דקה',      warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '5' },
                { week: 15, intervals: 2,  run: '18 דקות',    walk: 'דקה',      warmup: '5 דקות הליכה + חימום דינמי', cooldown: '5 דקות', phase: '5' },
                { week: 16, intervals: 1,  run: '30-40 דקות', walk: '',          warmup: '5 דקות הליכה', cooldown: '5 דקות', phase: '6' },
            ];

            const programWeek = Math.min(week, 16);
            const program = programs.find(p => p.week === programWeek) || programs[programWeek - 1] || programs[programs.length - 1];
            const warmupFull = getRunningWarmup();

            const mainText = program.phase === '6'
                ? `ריצה רציפה של ${program.run} בקצב נוח`
                : `${program.intervals} × (${program.run} ריצה קלילה + ${program.walk} הליכה)`;

            return [{
                name: `מהליכה לריצה - שבוע ${programWeek} (שלב ${program.phase}/6)`,
                duration: `כ-${duration} דקות`,
                warmup: warmupFull,
                main: mainText,
                cooldown: '5 דקות הליכה + מתיחות סטטיות: שוק, ירך קדמית, ירך אחורית',
                notes: program.phase === '6'
                    ? 'ריצה רציפה! הגעת לשלב האחרון. BC Running: "הדרגתיות ועקביות לאורך 16 שבועות - זה המפתח". ריצה בקצב שבו ניתן לנהל שיחה.'
                    : 'BC Running: "הדרגתיות, מתינות, עבודה עם הגוף". אל תמהר. הריצה צריכה להיות קלילה ונוחה - "קצב שיחה". עקביות > עצימות.',
                tips: 'אם האימון קשה מדי - חזור שבוע אחד אחורה. אם קל מדי - קדם שבוע קדימה. BC Running: "האומץ להאט הוא הצעד הראשון לרוץ מהר יותר".'
            }];
        };

        // Advanced Running Workout - BC Running (מועדון ארוחת הבוקר) methodology
        // Based on Nachshon Shochat + Lydiard periodization
        // 4-week cycle: Long Run → Easy+Strides → Fartlek → Tempo/Progression/Test
        // Phase-aware: base = more easy, build = fartlek, peak = tempo+intervals, taper = short
        const generateAdvancedRunningWorkout = (weekInCycle, duration, level, raceGoal, week, paceZones, phase = { key: 'base' }, totalWeeks = 12, runningSessionIdx = 0) => {
            const phaseKey = phase ? phase.key : 'base';

            // Secondary runs in the week → vary by session index:
            // idx=1: easy recovery | idx=2: progression (secondary quality) | idx=3+: easy again
            if (runningSessionIdx === 1) {
                return generateEasyRunWithStrides(Math.round(duration * 0.85), level);
            }
            if (runningSessionIdx === 2) {
                return generateProgressionRun(Math.round(duration * 0.90), level);
            }
            if (runningSessionIdx > 2) {
                return generateEasyRunWithStrides(Math.round(duration * 0.80), level);
            }

            // Every 8th week: 5K time trial
            const is5KTestWeek = (week % 8 === 0);

            // Taper phase: all workouts become short easy runs or light quality
            if (phaseKey === 'taper') {
                const taperDuration = Math.round(duration * 0.75);
                if (weekInCycle === 1) return generateEasyRunWithStrides(taperDuration, level);
                if (weekInCycle === 2) return generateEasyRunWithStrides(taperDuration, level);
                if (weekInCycle === 3) return generateFartlekWorkout(taperDuration, level, week); // light fartlek to stay sharp
                return generateProgressionRun(taperDuration, level); // short progression
            }

            // Long run gets 50-70% more time than the base easy run
            const longRunDur = Math.round(duration * (level === 'advanced' ? 1.7 : 1.5));

            // Base phase: emphasize aerobic base, minimal quality
            if (phaseKey === 'base') {
                if (weekInCycle === 1) return generateLongRun(longRunDur, level, raceGoal, paceZones);
                if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
                if (weekInCycle === 3) return generateEasyRunWithStrides(duration, level); // extra easy in base
                return generateProgressionRun(duration, level); // gentle quality
            }

            // Build phase: introduce fartlek and tempo
            if (phaseKey === 'build') {
                if (weekInCycle === 1) return generateLongRun(longRunDur, level, raceGoal, paceZones);
                if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
                if (weekInCycle === 3) return generateFartlekWorkout(duration, level, week);
                if (is5KTestWeek) return generate5KTestWorkout(duration, level);
                return generateTempoRun(duration, level, week, paceZones);
            }

            // Peak phase: full quality mix - all workout types
            // weekInCycle: 1=Long, 2=Easy+Strides, 3=Fartlek, 4=Tempo or Test
            if (weekInCycle === 1) return generateLongRun(longRunDur, level, raceGoal, paceZones);
            if (weekInCycle === 2) return generateEasyRunWithStrides(duration, level);
            if (weekInCycle === 3) return generateFartlekWorkout(duration, level, week);
            if (is5KTestWeek) return generate5KTestWorkout(duration, level);
            return generateTempoRun(duration, level, week, paceZones);
        };

        // Long Run - BC Running methodology: aerobic base, "courage to slow down"
        // Nachshon Shochat: easy with gentle pickup in final third
        const generateLongRun = (duration, level, raceGoal, paceZones = null) => {
            const easyPace = paceZones ? `קצב קל: ${paceZones.easy} לק"מ` : 'קצב שיחה מלא (60-70% דופק מקסימום)';
            // Running time = total duration minus ~10 min warmup walking/dynamic
            const runTime = Math.max(20, duration - 10);
            const t1 = Math.round(runTime * 0.33);
            const t2 = Math.round(runTime * 0.34);
            const t3 = runTime - t1 - t2;
            // Calculate distance from actual pace, not hardcoded
            const distKm = calcRunDistKm(runTime, paceZones, level);
            const targetDist = `${Math.floor(distKm * 0.9)}-${Math.ceil(distKm * 1.1)} ק"מ`;
            return [{
                name: 'ריצה ארוכה (Long Run) - עמוד התווך',
                duration: `${duration} דקות (ריצה: ${runTime} דקות + חימום/צינון)`,
                warmup: getRunningWarmup(),
                structure: `${t1} דקות: קל מאוד (Zone 1 — קצב שיחה מלא) | ${t2} דקות: אירובי יציב (Zone 2) | ${t3} דקות: הגברה מתונה`,
                pace: easyPace + ` | יעד מרחק: ${targetDist}`,
                cooldown: '5-7 דקות הליכה + מתיחות סטטיות',
                notes: level === 'advanced'
                    ? 'BC Running: הריצה הארוכה בונה את הבסיס האירובי - ה"בנק" של VO2max, שריפת שומן, סיבולת נפשית. לא ריצת מהירות. סיים בהרגשה שאפשר המשיך.'
                    : 'BC Running: "האומץ להאט" - כדי לרוץ מהר יותר, קודם ללמוד לרוץ לאט יותר. קצב שיחה מלא.',
                tips: 'נחשון שוחט: "רוץ את הארוכה לאט יותר ממה שאתה חושב שצריך". הדרגתיות + עקביות = שיפור לאורך זמן.'
            }];
        };

        // Easy Run with Strides - Nachshon Shochat + BC Running methodology
        // BC Running: strides 3-4x/week, including in warmup for quality sessions
        // מתגברות = short accelerations to improve stride mechanics and running economy
        const generateEasyRunWithStrides = (duration, level) => {
            const mainDuration = Math.max(25, duration - 10);
            const stridesCount = level === 'advanced' ? '5-6' : '4-5';
            return [{
                name: 'ריצה קלה עם מתגברות (Easy Run + Strides)',
                duration: `${duration} דקות (40-60 דקות אידיאלי)`,
                warmup: getRunningWarmup(),
                main: `${mainDuration} דקות ריצה קלה בקצב שיחה מלא (Zone 1-2)`,
                strides: `${stridesCount} מתגברות של 80-100 מטר: תאוצה הדרגתית עד 90% מהירות → 3 שניות בשיא → הגברה לאט, הליכה חזרה (90 שניות) בין כל מתגברת`,
                cooldown: '5 דקות ריצה קלה מאוד + מתיחות סטטיות',
                notes: 'BC Running: מתגברות 3-4 פעמים בשבוע (כולל בחימום לאימוני איכות). הן משפרות מכניקת צעד, כלכליות ריצה וקשר עצבי-שרירי. ריצה קלה = קצב שיחה מלא לאורך כל האימון.',
                tips: 'המתגברות אינן ספרינט! תאוצה חלקה ונוחה - כמו מטוס שממריא. הגוף לא מכנס אנרגיה אנאירובית. בשטח שטוח עם רוח גב אם אפשר.'
            }];
        };

        // Fartlek - BC Running methodology: creative, free, not on a track
        // BC Running: "פרטלק הוא אימון גמיש ויצירתי, רחוק ממלבן המסלול"
        // Combines aerobic + anaerobic, race simulations, hills, sudden bursts
        // Nachshon Shochat 3-week progression: Short → Medium → Pyramid
        const generateFartlekWorkout = (duration, level, week) => {
            const weekInCycle = ((week - 1) % 3) + 1; // 1, 2, or 3

            const fartlekVariations = [
                {
                    name: 'פרטלק קצר - "משחק מהירות" (Short Fartlek)',
                    duration: `${duration} דקות`,
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות של 80מ\' (חלק מהחימום לאימוני איכות - BC Running)',
                    main: level === 'advanced'
                        ? '10-12 × (60 שניות מהיר / 60 שניות ג\'וג קל) - עדיף בשטח טבעי, לא מסלול!'
                        : '8-10 × (60 שניות מהיר / 60 שניות ג\'וג קל) - גבעות, שבילים, פארק',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: "פרטלק = שחרור יצירתי ומהנה". ה"מהיר" = קצב 5K (מאתגר אך לא מקסימלי). ה"קל" = ג\'וג קל שמאפשר שיחה. שמור על קצב קבוע מהחזרה הראשונה לאחרונה.',
                    intensity: 'גבוהה - VO2max',
                    tips: 'BC Running: אל תגיע למסלול! שטח טבעי, גבעות, שבילים - הם הזירה הטבעית של הפרטלק. עיקרון: "train, don\'t strain".'
                },
                {
                    name: 'פרטלק בינוני - סף לקטט (Medium Fartlek)',
                    duration: `${duration} דקות`,
                    warmup: '15-20 דקות ריצה קלה + 4 מתגברות',
                    main: level === 'advanced'
                        ? '6-8 × (3 דקות מהיר-בינוני / 3 דקות קל) - שנה כיוון, כלול גבעות, הפתע את עצמך'
                        : '5-6 × (3 דקות מהיר-בינוני / 3 דקות קל) - קצב חצי מרתון',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: ה"מהיר-בינוני" = קצב 10K-חצי מרתון (ניתן לשמירה לאורך 3 דקות בכל חזרה). זה אזור הסף הלקטי - ה"מנוע" שמשפר את הריצה לאורך זמן.',
                    intensity: 'בינונית-גבוהה - Lactate Threshold',
                    tips: 'פרטלק = "משחק מהירות" שוודי. גמיש ומהנה. ניתן לשנות על פי תחושה ביום - זו חוזקתו.'
                },
                {
                    name: 'פרטלק פירמידה + ספרינטים (Pyramid Fartlek)',
                    duration: `${duration} דקות`,
                    warmup: '15-20 דקות ריצה קלה + 4-5 מתגברות',
                    main: 'פירמידה: 2→4→6→4→2 דקות (מהיר), 2-3 דקות ג\'וג קל בין כל פרק. סיום: 4×30 שניות ספרינט (א-לקטי) / 60 שניות ג\'וג',
                    cooldown: '10 דקות ריצה קלה + מתיחות',
                    notes: 'BC Running: הפירמידה עובדת על כל טווחי הקצב. הקצב ב-2 דקות מהיר מב-6 דקות. הספרינטים הקצרים בסוף (≤30 שניות במאמץ מירבי) = אימון "א-לקטי" שמשפר מהירות טהורה לפי שיטת לידיארד.',
                    intensity: 'גבוהה-מאוד גבוהה',
                    tips: 'BC Running: שמור את הספרינטים "בטנק". הם קצרים (עד 10-30 שניות) ומירביים. זו הדרך לשפר מהירות טהורה - לא חזרות 400מ\' ארוכות!'
                }
            ];

            return [fartlekVariations[weekInCycle - 1]];
        };

        // Tempo Run - BC Running: LT training based on Pfitzinger / BC Running methodology
        // BC Running: 3-5km warmup then 6-11km tempo at LT pace; strong VO2max stimulus
        // "גירוי חזק לשיפור קצב סף חומצת החלב" (BC Running on tempo runs)
        const generateTempoRun = (duration, level, week, paceZones = null) => {
            const warmupKm = level === 'advanced' ? '3-5 ק"מ' : '2-3 ק"מ';
            const tempoKm = level === 'advanced' ? '8-12 ק"מ' : '5-8 ק"מ';
            const tempoMin = Math.round(duration * 0.6);
            const tempoPaceStr = paceZones
                ? `קצב טמפו: ${paceZones.medium} לק"מ (אחרי חימום ${warmupKm})`
                : `קצב 10K + 20-30 שניות לק"מ | "נוח-קשה" | ניתן לדבר מילים בודדות`;
            return [{
                name: 'ריצת טמפו (Tempo Run) - סף לקטט',
                duration: `${duration} דקות`,
                warmup: `${warmupKm} ריצה קלה + ` + getRunningWarmup() + ' + 3-4 מתגברות',
                main: `${tempoMin} דקות / ${tempoKm} | ${tempoPaceStr}`,
                cooldown: '10-15 דקות ריצה קלה מאוד + מתיחות ארוכות',
                notes: 'BC Running: קצב טמפו = "נוח-קשה". דופק 80-90% מקסימום. ניתן לדבר מילים בודדות אבל לא משפטים. זהו אימון סף הלקטי - מגביר את היכולת לרוץ מהר יותר עם פחות חומצת חלב.',
                tips: 'לא מהיר מדי! קצב טמפו ≠ קצב 5K. BC Running: "אינטרוולים עצימים מוגזמים פוגעים ברצי ארוכות - הטמפו הוא הנשק הסודי".'
            }];
        };

        // Progression Run - Nachshon Shochat Run #4 + BC Running "negatively split"
        // BC Running: "easy out, fast back" - builds mental strength and race pacing
        const generateProgressionRun = (duration, level) => {
            const half = Math.round(duration / 2);
            return [{
                name: 'ריצת פרוגרסיה (Negative Split / Progression Run)',
                duration: `${duration} דקות`,
                warmup: getRunningWarmup(),
                structure: level === 'advanced'
                    ? `${Math.round(duration * 0.35)} דקות קל (Zone 1-2) → ${Math.round(duration * 0.35)} דקות קצב מרתון (Zone 3) → ${Math.round(duration * 0.25)} דקות קצב חצי מרתון (Zone 4) → ק"מ אחרון: כל מה שיש!`
                    : `מחצית ראשונה (${half} דקות): ריצה קלה בקצב שיחה (Zone 1-2) → מחצית שנייה: הגברה הדרגתית, דקות אחרונות: מאמץ גבוה (Zone 3-4)`,
                cooldown: '5-10 דקות הליכה + מתיחות סטטיות',
                notes: 'BC Running: "הלוך קל - חזור מהיר". הגברה הדרגתית מלמדת ניהול קצב (Pacing) - מיומנות קריטית במרתון. לא קפיצות פתאומיות - הדרגתיות!',
                tips: 'נחשון שוחט: "הסוד הוא לא להתחיל מהר מדי. הפיתוי הגדול ביותר הוא לצאת מהר מדי. כפה על עצמך להאט בהתחלה."'
            }];
        };

        // 5K Test/Time Trial - BC Running: "מבחן כושר" every 8 weeks
        // BC Running recommends tune-up races (10K) 3-5 weeks before marathon
        const generate5KTestWorkout = (duration, level) => {
            return [{
                name: '5K מבחן / מירוץ כושר (Tune-Up Race)',
                duration: `כ-35-45 דקות (כולל חימום וצינון)`,
                warmup: '2-3 ק"מ ריצה קלה + ' + getRunningWarmup() + ' + 4-5 מתגברות 80מ\'',
                main: 'ריצה מקסימלית של 5 ק"מ - מדוד את הזמן! יצא שלילי-ספליט (נגטיב ספליט).',
                cooldown: '10-15 דקות ריצה קלה מאוד + מתיחות ארוכות (10+ דקות)',
                notes: 'BC Running: מבחן כל 8 שבועות (לא ישן יותר מדי) לבדיקת התקדמות. הקצב ב-5K משמש כבסיס לחישוב כל קצבי האימון: טמפו, פרטלק, אינטרוולים. אם השתתפת במירוץ 10K - זה עדיף!',
                tips: 'לאחר המבחן: רשום את הזמן → עדכן קצבי אימון → שיפור של 10-30 שניות כל 8 שבועות = מעולה. BC Running: "מבחן + תחרות = מוטיבציה + כיוון ברור".'
            }];
        };

        // Run Less Run Faster (RLRF) - 3 key workouts methodology
        // BC Running perspective: fewer runs but each is quality ("train, don't strain")
        // Intervals (VO2max) + Tempo (LT) + Long Run
        const generateRLRFWorkout = (workoutType, duration, level, week) => {
            if (workoutType === 'intervals') {
                const weekInCycle = ((week - 1) % 4) + 1;
                // BC Running: 600-2000m intervals at 95-100% VO2max (3-5K race pace)
                const intervalSets = [
                    '6 × 400מ\' (קצב 5K) + 400מ\' ג\'וג קל בין חזרות',
                    '4 × 800מ\' (קצב 5K-10K) + 400מ\' ג\'וג',
                    '3 × 1200מ\' (קצב 10K) + 400מ\' ג\'וג',
                    '5 × 600מ\' (קצב 5K) + 300מ\' ג\'וג'
                ];
                return [{
                    name: 'ריצת אינטרוולים (RLRF Workout 1 / VO2max)',
                    warmup: '10-15 דקות ריצה קלה + מתיחות דינמיות + 4 מתגברות',
                    main: intervalSets[weekInCycle - 1],
                    cooldown: '10-15 דקות ריצה קלה',
                    notes: 'RLRF: 3 אימונים מרכזיים בשבוע = כל אחד חייב להיות איכותי. BC Running: אינטרוולים 600-2000מ\' ב-95-100% VO2max (קצב תחרות 3-5K). גירוי חזק לשיפור VO2max.',
                    tips: 'BC Running: "רבים מפריזים במינון ובתדירות של אינטרוולים עצימים עבור רצי ארוכות". RLRF פותר זאת: רק אימון אחד של אינטרוולים שבועי, אך הוא איכותי.'
                }];
            } else if (workoutType === 'tempo') {
                return [{
                    name: 'ריצת טמפו (RLRF Workout 2 / Lactate Threshold)',
                    warmup: '2-3 ק"מ ריצה קלה + מתגברות',
                    main: `${Math.round(duration * 0.6)} דקות / 6-11 ק"מ ריצת טמפו (קצב 10K + 20 שניות לק"מ)`,
                    cooldown: '10 דקות ריצה קלה',
                    notes: 'ריצת טמפו = מאמץ "נוח-קשה". דופק 80-90% מקסימום. ניתן לדבר מילים בודדות. BC Running: "גירוי חזק לשיפור קצב סף חומצת החלב". חימום: 3-5 ק"מ לפני הטמפו.',
                    tips: 'BC Running + RLRF: הטמפו הוא "הנשק הסודי" לרצי ארוכות. יעיל יותר מחזרות 400מ\' לרצי מרתון.'
                }];
            }
            return generateLongRun(duration, level, null);
        };

        // Main App
        function FitnessApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const traineeId = urlParams.get('trainee');

            if (traineeId) {
                return <TraineeView traineeId={traineeId} />;
            } else {
                return <TrainerApp />;
            }
        }

        // Trainer App
        function TrainerApp() {
            const [authUser, setAuthUser] = useState(undefined); // undefined = loading
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(user => {
                    setAuthUser(user); // null = not logged in, object = logged in
                });
                return () => unsubscribe();
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (err) {
                    if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                        // First-time setup: create the account
                        try {
                            await auth.createUserWithEmailAndPassword(email, password);
                        } catch (createErr) {
                            setError('שגיאה ביצירת חשבון: ' + createErr.message);
                        }
                    } else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                        setError('סיסמה שגויה');
                    } else if (err.code === 'auth/invalid-email') {
                        setError('כתובת מייל לא תקינה');
                    } else {
                        setError('שגיאת כניסה: ' + err.message);
                    }
                } finally {
                    setLoading(false);
                }
            };

            // Still loading auth state
            if (authUser === undefined) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center">
                        <div className="text-white text-xl">טוען...</div>
                    </div>
                );
            }

            if (!authUser) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">🔒</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">כניסת מאמן</h1>
                                <p className="text-gray-600">כניסה עם מייל וסיסמה</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input
                                        type="email"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="כתובת מייל"
                                        required
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>
                                <div>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="סיסמה"
                                        required
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>
                                {error && (
                                    <div className="text-red-600 text-sm text-center">{error}</div>
                                )}
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold py-3 px-6 rounded-xl transition"
                                >
                                    {loading ? 'מתחבר...' : 'כניסה'}
                                </button>
                            </form>
                            <p className="text-center text-xs text-gray-400 mt-4">
                                בפעם הראשונה: הזן מייל וסיסמה לבחירתך ליצירת חשבון
                            </p>
                        </div>
                    </div>
                );
            }

            return <TrainerDashboard />;
        }

        // Trainer Dashboard
        function TrainerDashboard() {
            const [trainees, setTrainees] = useState([]);
            const [showCreateForm, setShowCreateForm] = useState(false);
            const [selectedTrainee, setSelectedTrainee] = useState(null);
            const [editingTrainee, setEditingTrainee] = useState(null);
            const [continuationTrainee, setContinuationTrainee] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showArchive, setShowArchive] = useState(false);

            useEffect(() => {
                loadTrainees();
            }, []);

            const loadTrainees = async () => {
                setLoading(true);
                const data = await storage.getTrainees();
                setTrainees(data);
                setLoading(false);
            };

            const refreshTrainees = async () => {
                await loadTrainees();
            };

            const handleLogout = async () => {
                await auth.signOut();
            };

            const handleArchive = async (e, traineeId) => {
                e.stopPropagation();
                try {
                    await storage.archiveTrainee(traineeId);
                    await refreshTrainees();
                } catch (error) {
                    alert('שגיאה בהעברה לארכיון');
                }
            };

            const handleRestore = async (e, traineeId) => {
                e.stopPropagation();
                try {
                    await storage.restoreTrainee(traineeId);
                    await refreshTrainees();
                } catch (error) {
                    alert('שגיאה בשחזור מתאמן');
                }
            };

            const handleDelete = async (e, trainee) => {
                e.stopPropagation();
                if (window.confirm(`למחוק את "${trainee.name}" לצמיתות?\nפעולה זו אינה הפיכה.`)) {
                    try {
                        await storage.deleteTrainee(trainee.id);
                        await refreshTrainees();
                    } catch (error) {
                        alert('שגיאה במחיקת מתאמן');
                    }
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <div className="text-2xl font-bold text-gray-700">טוען נתונים...</div>
                        </div>
                    </div>
                );
            }

            if (continuationTrainee) {
                return (
                    <BuildContinuationPlan
                        trainee={continuationTrainee}
                        onBack={() => setContinuationTrainee(null)}
                        onComplete={() => {
                            setContinuationTrainee(null);
                            refreshTrainees();
                        }}
                    />
                );
            }

            if (editingTrainee) {
                return (
                    <EditTraineePlan
                        trainee={editingTrainee}
                        onBack={() => setEditingTrainee(null)}
                        onComplete={() => {
                            setEditingTrainee(null);
                            refreshTrainees();
                        }}
                    />
                );
            }

            if (selectedTrainee) {
                return (
                    <TraineeDetailView
                        trainee={selectedTrainee}
                        onBack={() => {
                            setSelectedTrainee(null);
                            refreshTrainees();
                        }}
                        onEditPlan={(trainee) => {
                            setSelectedTrainee(null);
                            setEditingTrainee(trainee);
                        }}
                        onContinuationPlan={(trainee) => {
                            setSelectedTrainee(null);
                            setContinuationTrainee(trainee);
                        }}
                    />
                );
            }

            if (showCreateForm) {
                return (
                    <CreateTraineePlan 
                        onBack={() => setShowCreateForm(false)}
                        onComplete={() => {
                            setShowCreateForm(false);
                            refreshTrainees();
                        }}
                    />
                );
            }

            const activeTrainees = trainees.filter(t => !t.archived);
            const archivedTrainees = trainees.filter(t => t.archived);
            const displayTrainees = showArchive ? archivedTrainees : activeTrainees;

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold">דשבורד מאמן 🎯</h1>
                                <p className="text-purple-100 mt-1">ניהול מתאמנים ותוכניות אימון</p>
                            </div>
                            <button
                                onClick={handleLogout}
                                className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition"
                            >
                                התנתק
                            </button>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto p-6">
                        <div className="mb-6">
                            <button
                                onClick={() => setShowCreateForm(true)}
                                className="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg flex items-center gap-2"
                            >
                                <span className="text-xl">➕</span>
                                צור תוכנית למתאמן חדש
                            </button>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <div className="flex items-center justify-between mb-6">
                                <h2 className="text-2xl font-bold text-gray-800">המתאמנים שלי</h2>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => setShowArchive(false)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${!showArchive ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        פעילים ({activeTrainees.length})
                                    </button>
                                    <button
                                        onClick={() => setShowArchive(true)}
                                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${showArchive ? 'bg-gray-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                    >
                                        ארכיון ({archivedTrainees.length})
                                    </button>
                                </div>
                            </div>

                            {displayTrainees.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <div className="text-6xl mb-4">{showArchive ? '📦' : '📭'}</div>
                                    <p className="text-xl">{showArchive ? 'הארכיון ריק' : 'אין עדיין מתאמנים פעילים'}</p>
                                    {!showArchive && <p className="text-sm mt-2">לחץ על "צור תוכנית למתאמן חדש" כדי להתחיל</p>}
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {displayTrainees.map(trainee => {
                                        const totalWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) =>
                                            sum + week.workouts.length, 0
                                        );
                                        const completedWorkouts = trainee.workoutPlan.weeks.reduce((sum, week) =>
                                            sum + week.workouts.filter(w => w.completed).length, 0
                                        );
                                        const progress = Math.round((completedWorkouts / totalWorkouts) * 100);

                                        const hasNewFeedback = !showArchive && trainee.workoutPlan.weeks.some(week =>
                                            week.workouts.some(w => w.feedback && w.feedbackSentToTrainer && !w.feedbackRead)
                                        );

                                        return (
                                            <div
                                                key={trainee.id}
                                                onClick={() => !showArchive && setSelectedTrainee(trainee)}
                                                className={`bg-gray-50 p-6 rounded-xl transition-all relative ${!showArchive ? 'hover:bg-gray-100 cursor-pointer' : 'opacity-80'}`}
                                            >
                                                {hasNewFeedback && (
                                                    <div className="absolute top-3 left-3 w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                                                )}
                                                <div className="text-3xl mb-2">{showArchive ? '📦' : '👤'}</div>
                                                <div className="font-bold text-gray-800 text-lg mb-1">{trainee.name}</div>
                                                <div className="text-sm text-gray-600 mb-3">{trainee.email}</div>
                                                <div className="mb-3">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <div className="flex-1 bg-gray-200 rounded-full h-2">
                                                            <div
                                                                className="bg-purple-500 h-2 rounded-full"
                                                                style={{ width: `${progress}%` }}
                                                            />
                                                        </div>
                                                        <span className="text-sm font-semibold text-purple-600">{progress}%</span>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 pt-3 border-t border-gray-200" onClick={e => e.stopPropagation()}>
                                                    {showArchive ? (
                                                        <>
                                                            <button
                                                                onClick={(e) => handleRestore(e, trainee.id)}
                                                                className="flex-1 text-xs py-2 px-3 bg-green-100 hover:bg-green-200 text-green-700 rounded-lg font-medium transition-colors"
                                                            >
                                                                שחזר
                                                            </button>
                                                            <button
                                                                onClick={(e) => handleDelete(e, trainee)}
                                                                className="flex-1 text-xs py-2 px-3 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg font-medium transition-colors"
                                                            >
                                                                מחק לצמיתות
                                                            </button>
                                                        </>
                                                    ) : (
                                                        <button
                                                            onClick={(e) => handleArchive(e, trainee.id)}
                                                            className="flex-1 text-xs py-2 px-3 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg font-medium transition-colors"
                                                        >
                                                            העבר לארכיון
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Create Trainee Plan Form
        function CreateTraineePlan({ onBack, onComplete }) {
            const [step, setStep] = useState('form'); // 'form' or 'preview'
            const [generatedPlan, setGeneratedPlan] = useState(null);
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                phone: '',
                age: '',
                gender: '',
                height: '',
                weight: '',
                activityLevel: '',
                workoutDuration: '', // in minutes
                goals: [],
                muscleGroups: [],
                availableEquipment: [], // equipment available for training
                // Running-specific fields
                runningLevel: '', // beginner, intermediate, advanced
                weeklyMileage: '', // current km per week
                raceGoal: '', // marathon, half-marathon, 10k, 5k, general fitness
                currentPace: '', // e.g., "5:30 per km"
                current5kTime: '',
                current10kTime: '',
                currentHalfTime: '',
                currentMarathonTime: '',
                injuryHistory: '',
                planWeeks: '',
                customInstructions: '',
                cardioTarget: {
                    hasDistanceGoal: false,
                    distance: '',
                    hasPaceGoal: false,
                    pace: ''
                }
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleGoalToggle = (goal) => {
                setFormData(prev => ({
                    ...prev,
                    goals: prev.goals.includes(goal)
                        ? prev.goals.filter(g => g !== goal)
                        : [...prev.goals, goal]
                }));
            };

            const handleMuscleGroupToggle = (group) => {
                setFormData(prev => ({
                    ...prev,
                    muscleGroups: prev.muscleGroups.includes(group)
                        ? prev.muscleGroups.filter(g => g !== group)
                        : [...prev.muscleGroups, group]
                }));
            };

            const handleCardioTargetChange = (field, value) => {
                setFormData(prev => ({
                    ...prev,
                    cardioTarget: {
                        ...prev.cardioTarget,
                        [field]: value
                    }
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                const workoutPlan = generateWorkoutPlan(formData);
                setGeneratedPlan(workoutPlan);
                setStep('preview');
            };

            const handleSavePlan = async () => {
                const trainee = {
                    id: Date.now().toString(),
                    ...formData,
                    workoutPlan: generatedPlan,
                    createdAt: new Date().toISOString()
                };

                try {
                    await storage.saveTrainee(trainee);
                    onComplete();
                } catch (error) {
                    console.error('Error saving trainee:', error);
                    alert('שגיאה בשמירת מתאמן. אנא נסה שוב.');
                }
            };

            const handleRegeneratePlan = (systemPrompt) => {
                const updatedFormData = { ...formData, _systemPrompt: systemPrompt || formData.customInstructions || '' };
                const workoutPlan = generateWorkoutPlan(updatedFormData);
                setGeneratedPlan(workoutPlan);
            };

            if (step === 'preview') {
                return (
                    <PlanPreviewEditor 
                        formData={formData}
                        workoutPlan={generatedPlan}
                        onBack={() => setStep('form')}
                        onSave={handleSavePlan}
                        onRegenerate={handleRegeneratePlan}
                        onUpdatePlan={setGeneratedPlan}
                    />
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 py-8 px-4">
                    <div className="max-w-2xl mx-auto">
                        <button
                            onClick={onBack}
                            className="mb-6 text-purple-600 hover:text-purple-700 font-semibold flex items-center gap-2"
                        >
                            ← חזרה
                        </button>

                        <div className="bg-white rounded-2xl shadow-xl p-8">
                            <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">יצירת תוכנית למתאמן</h2>
                            
                            <form onSubmit={handleSubmit} className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-2">שם מלא</label>
                                        <input
                                            type="text"
                                            name="name"
                                            value={formData.name}
                                            onChange={handleChange}
                                            required
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-2">אימייל <span className="text-gray-400 font-normal text-sm">(אופציונלי)</span></label>
                                        <input
                                            type="email"
                                            name="email"
                                            value={formData.email}
                                            onChange={handleChange}
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-2">טלפון <span className="text-gray-400 font-normal text-sm">(אופציונלי)</span></label>
                                        <input
                                            type="tel"
                                            name="phone"
                                            value={formData.phone}
                                            onChange={handleChange}
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                            placeholder="050-0000000"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-2">גיל</label>
                                        <input
                                            type="number"
                                            name="age"
                                            value={formData.age}
                                            onChange={handleChange}
                                            required
                                            min="1"
                                            max="100"
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-2">מין</label>
                                        <select
                                            name="gender"
                                            value={formData.gender}
                                            onChange={handleChange}
                                            required
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        >
                                            <option value="">בחר...</option>
                                            <option value="זכר">זכר</option>
                                            <option value="נקבה">נקבה</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-2">גובה (ס"מ)</label>
                                        <input
                                            type="number"
                                            name="height"
                                            value={formData.height}
                                            onChange={handleChange}
                                            required
                                            min="120"
                                            max="250"
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-2">משקל (ק"ג)</label>
                                        <input
                                            type="number"
                                            name="weight"
                                            value={formData.weight}
                                            onChange={handleChange}
                                            required
                                            min="30"
                                            max="300"
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-gray-700 font-semibold mb-2">רמת פעילות נוכחית</label>
                                    <select
                                        name="activityLevel"
                                        value={formData.activityLevel}
                                        onChange={handleChange}
                                        required
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    >
                                        <option value="">בחר...</option>
                                        <option value="מתחיל">מתחיל - לא מתאמן בכלל או מתאמן לעיתים רחוקות</option>
                                        <option value="בינוני">בינוני - מתאמן 1-2 פעמים בשבוע</option>
                                        <option value="מתקדם">מתקדם - מתאמן 3+ פעמים בשבוע באופן קבוע</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-gray-700 font-semibold mb-2">משך אימון רצוי</label>
                                    <select
                                        name="workoutDuration"
                                        value={formData.workoutDuration}
                                        onChange={handleChange}
                                        required
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    >
                                        <option value="">בחר משך אימון...</option>
                                        <option value="30">30 דקות</option>
                                        <option value="45">45 דקות</option>
                                        <option value="60">שעה (60 דקות)</option>
                                        <option value="75">שעה ורבע (75 דקות)</option>
                                        <option value="90">שעה וחצי (90 דקות)</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-gray-700 font-semibold mb-3">מטרות (ניתן לבחור יותר מאחת)</label>
                                    <div className="space-y-2">
                                        {['ירידה במשקל', 'עלייה במסת שריר', 'שיפור יכולת אירובית', 'שיפור בריאות כללית'].map(goal => (
                                            <label key={goal} className="flex items-center gap-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={formData.goals.includes(goal)}
                                                    onChange={() => handleGoalToggle(goal)}
                                                    className="w-5 h-5 text-purple-600"
                                                />
                                                <span className="text-gray-700">{goal}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                {formData.goals.includes('עלייה במסת שריר') && (
                                    <div className="bg-purple-50 p-4 rounded-lg border-2 border-purple-200">
                                        <label className="block text-gray-700 font-semibold mb-3">
                                            📅 כמה אימונים בשבוע?
                                        </label>
                                        <select
                                            name="weeklyWorkouts"
                                            value={formData.weeklyWorkouts || ''}
                                            onChange={handleChange}
                                            required
                                            className="w-full px-4 py-2 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 mb-4"
                                        >
                                            <option value="">בחר מספר אימונים...</option>
                                            <option value="2">2 אימונים בשבוע</option>
                                            <option value="3">3 אימונים בשבוע</option>
                                            <option value="4">4 אימונים בשבוע</option>
                                            <option value="5">5 אימונים בשבוע</option>
                                            <option value="6">6 אימונים בשבוע</option>
                                        </select>
                                        
                                        <label className="block text-gray-700 font-semibold mb-3">
                                            🎯 באילו קבוצות שריר עיקריות להתמקד?
                                        </label>
                                        <div className="space-y-2">
                                            <label className="flex items-center gap-3 p-3 bg-white border-2 border-purple-400 rounded-lg hover:bg-purple-50 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={formData.muscleGroups.includes('Full Body')}
                                                    onChange={() => handleMuscleGroupToggle('Full Body')}
                                                    className="w-5 h-5 text-purple-600"
                                                />
                                                <span className="text-gray-700 font-bold">💪 Full Body - אימון לכל הגוף</span>
                                            </label>
                                            <div className="text-sm text-purple-700 pr-10 mb-2">
                                                או בחר קבוצות שריר ספציפיות:
                                            </div>
                                            {['חזה', 'גב', 'כתפיים', 'רגליים', 'זרועות', 'בטן'].map(group => (
                                                <label key={group} className="flex items-center gap-3 p-3 bg-white border border-purple-200 rounded-lg hover:bg-purple-50 cursor-pointer">
                                                    <input
                                                        type="checkbox"
                                                        checked={formData.muscleGroups.includes(group)}
                                                        onChange={() => handleMuscleGroupToggle(group)}
                                                        className="w-5 h-5 text-purple-600"
                                                    />
                                                    <span className="text-gray-700">{group}</span>
                                                </label>
                                            ))}
                                        </div>
                                        
                                        {/* Equipment availability */}
                                        <div className="mt-4 pt-4 border-t-2 border-purple-200">
                                            <label className="block text-gray-700 font-semibold mb-3">
                                                🏋️ איזה ציוד יש לך לאימון?
                                            </label>
                                            <div className="space-y-2">
                                                {[
                                                    'משקל גוף בלבד',
                                                    'משקולות חופשיות (דמבלים/קטלבלים)',
                                                    'TRX / רצועות התנגדות',
                                                    'מתח, מקבילים',
                                                    'חדר כושר מלא'
                                                ].map(equipment => (
                                                    <label key={equipment} className="flex items-center gap-3 p-3 bg-white border border-purple-200 rounded-lg hover:bg-purple-50 cursor-pointer">
                                                        <input
                                                            type="checkbox"
                                                            checked={formData.availableEquipment?.includes(equipment) || false}
                                                            onChange={() => {
                                                                const current = formData.availableEquipment || [];
                                                                const updated = current.includes(equipment)
                                                                    ? current.filter(e => e !== equipment)
                                                                    : [...current, equipment];
                                                                setFormData(prev => ({ ...prev, availableEquipment: updated }));
                                                            }}
                                                            className="w-5 h-5 text-purple-600"
                                                        />
                                                        <span className="text-gray-700">{equipment}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Training experience and 1RM */}
                                        <div className="mt-4 pt-4 border-t-2 border-purple-200">
                                            <label className="block text-gray-700 font-semibold mb-3">
