        // ─── GROUP PROGRAM: Trainer view of a single member's progress ────────
        function GroupMemberTrainerView({ member, program, onBack }) {
            const [selectedWeek, setSelectedWeek] = useState(0);
            const [localMember, setLocalMember] = useState(member);
            const [replyDrafts, setReplyDrafts] = useState({});

            if (!localMember.workoutPlan) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4">📋</div>
                            <h1 className="text-2xl font-bold text-gray-800">אין תוכנית</h1>
                            <p className="text-gray-600 mt-2">המתאמן נרשם לפני שהתוכנית הוכנסה</p>
                            <button onClick={onBack} className="mt-4 text-purple-600 hover:text-purple-800 font-medium">← חזרה</button>
                        </div>
                    </div>
                );
            }

            const totalWorkouts = localMember.workoutPlan.weeks.reduce((s, w) => s + w.workouts.length, 0);
            const completedWorkouts = localMember.workoutPlan.weeks.reduce((s, w) => s + w.workouts.filter(x => x.completed).length, 0);
            const progress = totalWorkouts > 0 ? Math.round((completedWorkouts / totalWorkouts) * 100) : 0;
            const currentWeek = localMember.workoutPlan.weeks[selectedWeek];

            const markFeedbackAsRead = async (weekIndex, workoutIndex) => {
                const updated = JSON.parse(JSON.stringify(localMember));
                updated.workoutPlan.weeks[weekIndex].workouts[workoutIndex].feedbackRead = true;
                const saved = await groupStorage.updateGroupMember(localMember.id, { workoutPlan: updated.workoutPlan });
                if (saved) setLocalMember(saved);
            };

            const sendTrainerReply = async (weekIndex, workoutIndex) => {
                const key = `${weekIndex}-${workoutIndex}`;
                const reply = (replyDrafts[key] || '').trim();
                if (!reply) return;
                const updated = JSON.parse(JSON.stringify(localMember));
                const workout = updated.workoutPlan.weeks[weekIndex].workouts[workoutIndex];
                workout.trainerReply = reply;
                workout.trainerReplySentAt = new Date().toISOString();
                workout.feedbackRead = true;
                const saved = await groupStorage.updateGroupMember(localMember.id, { workoutPlan: updated.workoutPlan });
                if (saved) {
                    setLocalMember(saved);
                    setReplyDrafts(prev => ({ ...prev, [key]: '' }));
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto">
                            <button onClick={onBack} className="mb-4 text-white hover:text-purple-100 font-semibold flex items-center gap-2">
                                ← חזרה לרשימת המתאמנים
                            </button>
                            <div className="flex justify-between items-start">
                                <div>
                                    <h1 className="text-2xl font-bold">{localMember.name}</h1>
                                    <div className="text-purple-100 mt-0.5">{localMember.phone}</div>
                                    <div className="text-purple-200 text-sm mt-0.5">{program.name}</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-3xl font-bold">{progress}%</div>
                                    <div className="text-purple-100 text-sm">הושלם</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="max-w-6xl mx-auto p-6 space-y-6">
                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-lg font-bold text-gray-800 mb-3">התקדמות</h2>
                            <div className="flex items-center gap-4">
                                <div className="flex-1 bg-gray-200 rounded-full h-4">
                                    <div className="bg-gradient-to-r from-purple-500 to-indigo-500 h-4 rounded-full" style={{ width: `${progress}%` }} />
                                </div>
                                <span className="text-xl font-bold text-purple-600">{progress}%</span>
                            </div>
                            <p className="text-gray-600 mt-2 text-sm">השלים {completedWorkouts} מתוך {totalWorkouts} אימונים</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-lg font-bold text-gray-800 mb-4">שבועות</h2>
                            <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
                                {localMember.workoutPlan.weeks.map((week, index) => {
                                    const weekCompleted = week.workouts.filter(w => w.completed).length;
                                    const weekTotal = week.workouts.length;
                                    const hasFeedback = week.workouts.some(w => w.feedback && !w.feedbackRead);
                                    return (
                                        <button
                                            key={index}
                                            onClick={() => setSelectedWeek(index)}
                                            className={`relative p-3 rounded-xl font-semibold text-sm transition-all ${
                                                selectedWeek === index
                                                    ? 'bg-purple-600 text-white shadow-lg scale-105'
                                                    : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                            }`}
                                        >
                                            {hasFeedback && <div className="absolute top-1 left-1 w-2 h-2 bg-red-500 rounded-full"></div>}
                                            <div>שבוע {index + 1}</div>
                                            <div className="text-xs mt-0.5">{weekCompleted}/{weekTotal}</div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="space-y-4">
                            {currentWeek.workouts.map((workout, index) => (
                                <div key={index} className="bg-white rounded-2xl shadow-lg p-6">
                                    <div className="flex items-center gap-3 mb-3">
                                        <span className="text-3xl">{workout.type === 'כוח' ? '🏋️' : '🏃'}</span>
                                        <div>
                                            <h3 className="text-lg font-bold text-gray-800">{workout.day} — {workout.type}</h3>
                                            <div className="flex gap-2 mt-1 flex-wrap">
                                                {workout.completed && (
                                                    <span className="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full">
                                                        ✓ הושלם{workout.completedAt && ` — ${new Date(workout.completedAt).toLocaleDateString('he-IL')}`}
                                                    </span>
                                                )}
                                                {workout.difficulty && (
                                                    <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">קושי: {workout.difficulty}</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    {workout.feedback && (
                                        <div className={`p-3 rounded-xl ${workout.feedbackRead ? 'bg-gray-50' : 'bg-yellow-50 border border-yellow-200'}`}>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <div className="text-sm font-semibold text-gray-700 mb-0.5">💬 משוב מ-{localMember.name}:</div>
                                                    {workout.feedbackSentAt && (
                                                        <div className="text-xs text-gray-400 mb-1">{new Date(workout.feedbackSentAt).toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
                                                    )}
                                                    <div className="text-sm text-gray-600">{workout.feedback}</div>
                                                </div>
                                                {!workout.feedbackRead && (
                                                    <button
                                                        onClick={() => markFeedbackAsRead(selectedWeek, index)}
                                                        className="text-xs text-yellow-700 hover:text-yellow-900 font-medium mr-2 shrink-0"
                                                    >
                                                        סמן כנקרא
                                                    </button>
                                                )}
                                            </div>
                                            {workout.trainerReply && (
                                                <div className="mt-2 pt-2 border-t border-gray-200">
                                                    <div className="text-xs font-bold text-purple-900 mb-0.5">💬 תגובתך:</div>
                                                    <div className="text-xs text-purple-700">{workout.trainerReply}</div>
                                                    <div className="text-xs text-gray-400 mt-0.5">{new Date(workout.trainerReplySentAt).toLocaleDateString('he-IL')}</div>
                                                </div>
                                            )}
                                            <div className="mt-2 pt-2 border-t border-gray-200 flex gap-2">
                                                <textarea
                                                    value={replyDrafts[`${selectedWeek}-${index}`] || ''}
                                                    onChange={e => setReplyDrafts(prev => ({ ...prev, [`${selectedWeek}-${index}`]: e.target.value }))}
                                                    placeholder={workout.trainerReply ? 'ערוך / החלף תגובה...' : 'כתוב תגובה למתאמן...'}
                                                    rows={2}
                                                    className="flex-1 border border-gray-300 rounded-lg p-2 text-xs resize-none focus:outline-none focus:ring-2 focus:ring-purple-400"
                                                />
                                                <button
                                                    onClick={() => sendTrainerReply(selectedWeek, index)}
                                                    disabled={!(replyDrafts[`${selectedWeek}-${index}`] || '').trim()}
                                                    className="self-end bg-purple-600 hover:bg-purple-700 disabled:opacity-40 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition"
                                                >
                                                    שלח
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ─── GROUP PROGRAM: Trainer view — list of members ────────────────────
        function GroupProgramTrainerView({ program, onBack }) {
            const [members, setMembers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedMember, setSelectedMember] = useState(null);

            useEffect(() => { loadMembers(); }, [program.id]);

                setLoading(true);
                const data = await groupStorage.getGroupMembers(program.id);
                setMembers(data);
                setLoading(false);
            };

            const getGroupLink = () => {
                const savedUrl = localStorage.getItem('trainerWebsiteUrl');
                if (savedUrl) {
                    const url = savedUrl.trim();
                    const fullUrl = url.match(/^https?:\/\//) ? url : `https://${url}`;
                    return `${fullUrl}/?group=${program.id}`;
                }
                const baseUrl = `${window.location.origin}${window.location.pathname}`;
                return `${baseUrl}?group=${program.id}`;
            };

            if (selectedMember) {
                return (
                    <GroupMemberTrainerView
                        member={selectedMember}
                        program={program}
                        onBack={() => { setSelectedMember(null); loadMembers(); }}
                    />
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto">
                            <button onClick={onBack} className="mb-4 text-white hover:text-purple-100 font-semibold flex items-center gap-2">
                                ← חזרה לתוכניות קבוצתיות
                            </button>
                            <h1 className="text-2xl font-bold">{program.name}</h1>
                            {program.description && <p className="text-purple-100 mt-1">{program.description}</p>}
                            <div className="mt-2 text-purple-200 text-sm">{members.length} מתאמנים רשומים</div>
                        </div>
                    </div>
                    <div className="max-w-6xl mx-auto p-6 space-y-6">
                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <h2 className="text-lg font-bold text-gray-800 mb-3">קישור להרשמה</h2>
                            <p className="text-sm text-gray-600 mb-3">שלח קישור זה למתאמנים כדי שיוכלו להירשם לתוכנית:</p>
                            <div className="flex gap-2">
                                <input
                                    type="text"
                                    readOnly
                                    value={getGroupLink()}
                                    className="flex-1 px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm font-mono"
                                />
                                <button
                                    onClick={() => { navigator.clipboard.writeText(getGroupLink()); alert('הקישור הועתק!'); }}
                                    className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition font-semibold"
                                >
                                    העתק
                                </button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-bold text-gray-800">מתאמנים רשומים</h2>
                                <button onClick={loadMembers} className="text-sm text-purple-600 hover:text-purple-800 font-medium">↻ רענן</button>
                            </div>
                            {loading ? (
                                <div className="text-center py-8 text-gray-500">טוען...</div>
                            ) : members.length === 0 ? (
                                <div className="text-center py-12 text-gray-500">
                                    <div className="text-6xl mb-4">👥</div>
                                    <p className="text-xl">אין מתאמנים רשומים עדיין</p>
                                    <p className="text-sm mt-2">שלח את הקישור למעלה כדי לאפשר הרשמה</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {members.map(member => {
                                        const total = member.workoutPlan ? member.workoutPlan.weeks.reduce((s, w) => s + w.workouts.length, 0) : 0;
                                        const done = member.workoutPlan ? member.workoutPlan.weeks.reduce((s, w) => s + w.workouts.filter(x => x.completed).length, 0) : 0;
                                        const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                                        const hasNewFeedback = member.workoutPlan &&
                                            member.workoutPlan.weeks.some(w => w.workouts.some(x => x.feedback && !x.feedbackRead));
                                        return (
                                            <div
                                                key={member.id}
                                                onClick={() => setSelectedMember(member)}
                                                className="flex items-center gap-4 p-4 bg-gray-50 rounded-xl hover:bg-gray-100 cursor-pointer transition-all relative"
                                            >
                                                {hasNewFeedback && (
                                                    <div className="absolute top-3 right-3 w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse"></div>
                                                )}
                                                <div className="text-3xl">👤</div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-gray-800">{member.name}</div>
                                                    <div className="text-sm text-gray-500">{member.phone}</div>
                                                    <div className="flex items-center gap-2 mt-1">
                                                        <div className="flex-1 bg-gray-200 rounded-full h-1.5">
                                                            <div className="bg-purple-500 h-1.5 rounded-full" style={{ width: `${pct}%` }} />
                                                        </div>
                                                        <span className="text-xs font-semibold text-purple-600 shrink-0">{pct}%</span>
                                                    </div>
                                                </div>
                                                <div className="text-right text-sm text-gray-500 shrink-0">
                                                    <div>{done}/{total} אימונים</div>
                                                    {hasNewFeedback && <div className="text-red-500 font-medium mt-1">יש משוב חדש!</div>}
                                                </div>
                                                <div className="text-gray-400">›</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );

        // ─── GROUP PROGRAM: Public registration page ──────────────────────────
        function GroupRegistrationPage({ program, onRegister }) {
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [saving, setSaving] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!name.trim() || !phone.trim()) return;
                setSaving(true);
                try {
                    await onRegister(name, phone);
                } catch (error) {
                    alert('שגיאה בהרשמה: ' + error.message);
                    setSaving(false);
                }
            };

            return (
                <div className="min-h-screen gradient-bg flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                        <div className="text-center mb-8">
                            <div className="text-6xl mb-4">🏋️</div>
                            <h1 className="text-2xl font-bold text-gray-800 mb-2">{program.name}</h1>
                            {program.description && <p className="text-gray-500 text-sm mb-3">{program.description}</p>}
                            <p className="text-gray-600">הירשם לתוכנית האימונים</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 font-semibold mb-1.5 text-sm">שם מלא *</label>
                                <input
                                    type="text"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="הזן את שמך המלא"
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>
                            <div>
                                <label className="block text-gray-700 font-semibold mb-1.5 text-sm">מספר טלפון *</label>
                                <input
                                    type="tel"
                                    value={phone}
                                    onChange={(e) => setPhone(e.target.value)}
                                    placeholder="050-1234567"
                                    required
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                />
                            </div>
                            <button
                                type="submit"
                                disabled={saving || !name.trim() || !phone.trim()}
                                className="w-full bg-purple-600 hover:bg-purple-700 disabled:opacity-60 text-white font-semibold py-3 px-6 rounded-xl transition"
                            >
                                {saving ? 'נרשם...' : 'הירשם לתוכנית'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ─── GROUP PROGRAM: Member view (personal plan + tracking) ────────────
        function GroupMemberView({ member, program, onUpdateMember }) {
            const [localMember, setLocalMember] = useState(member);
            const [selectedWeek, setSelectedWeek] = useState(0);
            const [showFeedbackModal, setShowFeedbackModal] = useState(false);
            const [selectedWorkout, setSelectedWorkout] = useState(null);

            if (!localMember.workoutPlan) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <h1 className="text-xl font-bold text-gray-800">התוכנית עדיין לא זמינה</h1>
                            <p className="text-gray-600 mt-2">המאמן יוסיף תוכנית בקרוב. נסה לרענן את הדף.</p>
                        </div>
                    </div>
                );
            }

            const currentWeek = localMember.workoutPlan.weeks[selectedWeek];
            const completedWorkouts = localMember.workoutPlan.weeks.reduce((total, week) =>
                total + week.workouts.filter(w => w.completed).length, 0);
            const totalWorkouts = localMember.workoutPlan.weeks.reduce((total, week) =>
                total + week.workouts.length, 0);
            const progressPercentage = totalWorkouts > 0 ? Math.round((completedWorkouts / totalWorkouts) * 100) : 0;

            const handleWorkoutComplete = async (weekIndex, workoutIndex) => {
                const updated = JSON.parse(JSON.stringify(localMember));
                const workout = updated.workoutPlan.weeks[weekIndex].workouts[workoutIndex];
                const nowCompleted = !workout.completed;
                workout.completed = nowCompleted;
                workout.completedAt = nowCompleted ? new Date().toISOString() : null;
                const saved = await groupStorage.updateGroupMember(localMember.id, { workoutPlan: updated.workoutPlan });
                if (saved) {
                    setLocalMember(saved);
                    if (onUpdateMember) onUpdateMember(saved);
                }
            };

            const handleFeedbackSubmit = async (difficulty, feedbackText) => {
                const updated = JSON.parse(JSON.stringify(localMember));
                const workout = updated.workoutPlan.weeks[selectedWeek].workouts.find(w => w.day === selectedWorkout.day);
                if (workout) {
                    workout.difficulty = difficulty;
                    workout.feedback = feedbackText;
                    workout.feedbackSentToTrainer = true;
                    workout.feedbackRead = false;
                    workout.feedbackSentAt = new Date().toISOString();
                }
                const saved = await groupStorage.updateGroupMember(localMember.id, { workoutPlan: updated.workoutPlan });
                if (saved) {
                    setLocalMember(saved);
                    if (onUpdateMember) onUpdateMember(saved);
                }
                setShowFeedbackModal(false);
                setSelectedWorkout(null);
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="gradient-bg text-white p-6 shadow-lg">
                        <div className="max-w-6xl mx-auto">
                            <h1 className="text-2xl font-bold">שלום, {localMember.name}! 💪</h1>
                            <p className="text-purple-100 mt-0.5">{program.name}</p>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto p-6">
                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">התקדמות כללית</h2>
                            <div className="flex items-center gap-4 mb-3">
                                <div className="flex-1 bg-gray-200 rounded-full h-4">
                                    <div
                                        className="bg-gradient-to-r from-purple-500 to-indigo-500 h-4 rounded-full transition-all"
                                        style={{ width: `${progressPercentage}%` }}
                                    />
                                </div>
                                <span className="text-2xl font-bold text-purple-600">{progressPercentage}%</span>
                            </div>
                            <p className="text-gray-600">השלמת {completedWorkouts} מתוך {totalWorkouts} אימונים</p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">בחר שבוע</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                                {localMember.workoutPlan.weeks.map((week, index) => {
                                    const weekCompleted = week.workouts.filter(w => w.completed).length;
                                    const weekTotal = week.workouts.length;
                                    return (
                                        <button
                                            key={index}
                                            onClick={() => setSelectedWeek(index)}
                                            className={`p-4 rounded-xl font-semibold transition-all ${
                                                selectedWeek === index
                                                    ? 'bg-purple-600 text-white shadow-lg scale-105'
                                                    : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                            }`}
                                        >
                                            <div>שבוע {index + 1}</div>
                                            <div className="text-sm mt-1">{weekCompleted}/{weekTotal}</div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="space-y-4">
                            {currentWeek.workouts.map((workout, index) => (
                                <div key={index} className="bg-white rounded-2xl shadow-lg p-6">
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex items-center gap-4">
                                            <div className="text-4xl">{workout.type === 'כוח' ? '🏋️' : '🏃'}</div>
                                            <div>
                                                <h3 className="text-xl font-bold text-gray-800">
                                                    {workout.day} — {workout.type}
                                                </h3>
                                                {workout.completed && (
                                                    <span className="inline-block bg-green-100 text-green-800 text-sm px-3 py-1 rounded-full mt-1">
                                                        ✓ הושלם
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => handleWorkoutComplete(selectedWeek, index)}
                                                className={`px-4 py-2 rounded-lg font-semibold transition ${
                                                    workout.completed
                                                        ? 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                        : 'bg-green-500 text-white hover:bg-green-600'
                                                }`}
                                            >
                                                {workout.completed ? 'ביטול' : 'סיימתי'}
                                            </button>
                                            <button
                                                onClick={() => { setSelectedWorkout(workout); setShowFeedbackModal(true); }}
                                                className="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg font-semibold hover:bg-purple-200 transition"
                                            >
                                                פידבק
                                            </button>
                                        </div>
                                    </div>

                                    {workout.exercises && workout.exercises.length > 0 && (
                                        <div className="space-y-3">
                                            {workout.exercises.map((exercise, exIndex) => (
                                                <div key={exIndex} className="bg-gray-50 p-4 rounded-lg">
                                                    <div className="font-semibold text-gray-800 mb-2">{exercise.name}</div>
                                                    <div className="text-gray-600 text-sm space-y-1">
                                                        {exercise.warmup && <div><strong>חימום:</strong> {exercise.warmup}</div>}
                                                        {exercise.main && <div><strong>עיקרי:</strong> {exercise.main}</div>}
                                                        {exercise.structure && <div><strong>מבנה:</strong> {exercise.structure}</div>}
                                                        {exercise.pace && <div><strong>קצב:</strong> {exercise.pace}</div>}
                                                        {exercise.intensity && <div><strong>עצימות:</strong> {exercise.intensity}</div>}
                                                        {!!exercise.sets && <div>סטים: {exercise.sets}</div>}
                                                        {!!exercise.reps && <div>חזרות: {exercise.reps}</div>}
                                                        {!!exercise.duration && <div>משך: {exercise.duration}</div>}
                                                        {!!exercise.rest && <div>מנוחה: {exercise.rest} שניות</div>}
                                                        {exercise.recommendedWeight && (
                                                            <div className="bg-green-100 p-2 rounded mt-2 border border-green-300">
                                                                <strong className="text-green-800">💪 משקל מומלץ: {exercise.recommendedWeight}</strong>
                                                            </div>
                                                        )}
                                                        {exercise.notes && <div className="text-purple-600 mt-2">💡 {exercise.notes}</div>}
                                                        {exercise.tips && <div className="text-blue-600 mt-2">✨ {exercise.tips}</div>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {workout.difficulty && (
                                        <div className="mt-4 p-4 bg-blue-50 rounded-lg">
                                            <div className="font-semibold text-blue-900 mb-1">הפידבק שלך:</div>
                                            <div className="text-blue-800">רמת קושי: {workout.difficulty}</div>
                                            {workout.feedback && <div className="text-blue-700 mt-1">{workout.feedback}</div>}
                                            {workout.trainerReply && (
                                                <div className="mt-3 pt-3 border-t border-blue-200">
                                                    <div className="font-semibold text-purple-900 mb-1">💬 תגובת המאמן:</div>
                                                    <div className="text-purple-700">{workout.trainerReply}</div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>

                    {showFeedbackModal && selectedWorkout && (
                        <FeedbackModal
                            workout={selectedWorkout}
                            onClose={() => { setShowFeedbackModal(false); setSelectedWorkout(null); }}
                            onSubmit={handleFeedbackSubmit}
                        />
                    )}
                </div>
            );
        }

        // ─── GROUP PROGRAM: Public entry point (register or view plan) ────────
        function GroupProgramPage({ groupId }) {
            const [program, setProgram] = useState(null);
            const [loading, setLoading] = useState(true);
            const [memberId, setMemberId] = useState(() => localStorage.getItem(`groupMember_${groupId}`) || null);
            const [member, setMember] = useState(null);
            const [memberLoading, setMemberLoading] = useState(false);

            useEffect(() => { loadProgram(); }, [groupId]);
            useEffect(() => { if (memberId) loadMember(); }, [memberId]);

            const loadProgram = async () => {
                setLoading(true);
                const data = await groupStorage.getGroupProgram(groupId);
                setProgram(data);
                setLoading(false);
            };

            const loadMember = async () => {
                setMemberLoading(true);
                const data = await groupStorage.getGroupMember(memberId);
                setMember(data);
                setMemberLoading(false);
            };

            const handleRegister = async (name, phone) => {
                const newId = 'gm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                let workoutPlan = null;
                if (program && program.workoutPlan) {
                    workoutPlan = JSON.parse(JSON.stringify(program.workoutPlan));
                    workoutPlan.weeks.forEach(week => {
                        week.workouts.forEach(workout => {
                            workout.completed = false;
                            workout.feedback = null;
                            workout.difficulty = null;
                            workout.feedbackSentToTrainer = false;
                            workout.feedbackRead = false;
                        });
                    });
                }
                const newMember = { id: newId, programId: groupId, name: name.trim(), phone: phone.trim(), workoutPlan };
                await groupStorage.registerGroupMember(newMember);
                localStorage.setItem(`groupMember_${groupId}`, newId);
                setMemberId(newId);
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <h1 className="text-2xl font-bold text-gray-800">טוען תוכנית...</h1>
                        </div>
                    </div>
                );
            }

            if (!program) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4">❌</div>
                            <h1 className="text-2xl font-bold text-gray-800">תוכנית לא נמצאה</h1>
                            <p className="text-gray-600 mt-2">הקישור אינו תקף</p>
                        </div>
                    </div>
                );
            }

            if (memberId && (memberLoading || !member)) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-6xl mb-4">⏳</div>
                            <h1 className="text-2xl font-bold text-gray-800">טוען...</h1>
                        </div>
                    </div>
                );
            }

            if (member) {
                return <GroupMemberView member={member} program={program} onUpdateMember={setMember} />;
            }

            return <GroupRegistrationPage program={program} onRegister={handleRegister} />;
        }

        ReactDOM.render(<FitnessApp />, document.getElementById('root'));
    </script>
</body>
</html>
