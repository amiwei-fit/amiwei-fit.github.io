        // Hash a password with SHA-256 (browser native API)
        const hashPassword = async (password) => {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        };

                    );
                    const snapshot = await Promise.race([
                        db.collection('trainees').orderBy('createdAt', 'desc').get(),
                        timeoutPromise
                    ]);

                        .filter(doc => {
                            const data = doc.data();

                            // Sub-trainer: only show their own trainees

        // 1RM Percentage Table based on Repetitions
        const rm1PercentageTable = {
            1: 100, 2: 97, 3: 94, 4: 92, 5: 89, 6: 86, 7: 83, 8: 81, 9: 78, 10: 75,
            11: 73, 12: 71, 13: 70, 14: 68, 15: 67, 16: 65, 17: 64, 18: 63, 19: 61, 20: 60,
            21: 59, 22: 58, 23: 57, 24: 56, 25: 55, 26: 54, 27: 53, 28: 52, 29: 51, 30: 50
        };

        // Calculate recommended weight based on 1RM and target reps
        const calculateRecommendedWeight = (oneRM, targetReps) => {
            if (!oneRM || targetReps > 30) return null;
            const percentage = rm1PercentageTable[targetReps] || 50;
            return Math.round(oneRM * (percentage / 100));
        };

        // Get 1RM for exercise type
        const get1RMForExercise = (exerciseName, userData) => {
            if (!userData.knows1RM) return null;
            
            const name = exerciseName.toLowerCase();
            if (name.includes('סקוואט') || name.includes('squat')) {
                return userData.squat1RM;
            }
            if (name.includes('שכיבה') && (name.includes('לחיצת') || name.includes('חזה')) || name.includes('bench')) {
                return userData.bench1RM;
            }
            if (name.includes('דד-ליפט') || name.includes('deadlift')) {
                return userData.deadlift1RM;
            }
            if (name.includes('כתף') && name.includes('לחיצ') || name.includes('overhead') || name.includes('press')) {
                return userData.overheadPress1RM;
            }
            return null;
        };

        // Add weight recommendations to exercises
        const addWeightRecommendations = (exercises, userData, week) => {
            return exercises.map(exercise => {
                const oneRM = get1RMForExercise(exercise.name, userData);
                
                if (oneRM && exercise.reps && typeof exercise.reps === 'number') {
                    // Progressive overload: increase intensity every 2 weeks
                    const weekMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.025); // 2.5% every 2 weeks
                    const adjustedReps = Math.max(1, Math.round(exercise.reps / weekMultiplier));
                    const recommendedWeight = calculateRecommendedWeight(oneRM, adjustedReps);
                    
                    if (recommendedWeight) {
                        return {
                            ...exercise,
                            recommendedWeight: `${recommendedWeight} ק"ג`,
                            weightNote: `מבוסס על ${rm1PercentageTable[adjustedReps]}% מ-1RM (${oneRM} ק"ג). שבוע ${week}: ${adjustedReps} חזרות בעומס זה.`
                        };
                    }
                }
                
                // For exercises with rep ranges (like "8-10")
                if (oneRM && exercise.reps && typeof exercise.reps === 'string') {
                    const match = exercise.reps.match(/(\d+)-(\d+)/);
                    if (match) {
                        const maxReps = parseInt(match[2]);
                        const weekMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.025);
                        const adjustedReps = Math.max(1, Math.round(maxReps / weekMultiplier));
                        const recommendedWeight = calculateRecommendedWeight(oneRM, adjustedReps);
                        
                        if (recommendedWeight) {
                            return {
                                ...exercise,
                                recommendedWeight: `${recommendedWeight} ק"ג`,
                                weightNote: `מבוסס על ${rm1PercentageTable[adjustedReps]}% מ-1RM. התחל עם משקל זה ונסה להגיע ל-${exercise.reps} חזרות.`
                            };
                        }
                    }
                }
                
                return exercise;
            });
        };

        // Returns a YouTube video URL for a strength exercise, using a keyword map

        const getDefaultExerciseVideoUrl = (exerciseName) => {

            const runningKeywords = ['ריצ', 'אינטרוול', 'טמפו', 'פרטלק', 'הליכ', 'מתגברות', 'ריצה', 'run', 'jog', 'walk', 'interval', 'tempo', 'fartlek', 'stride', 'sprint', 'cardio', 'אירובי'];
            if (runningKeywords.some(k => lower.includes(k.toLowerCase()))) return null;
            const map = [
                { keys: ['romanian deadlift', 'rdl', 'רומניאן'], url: 'https://www.youtube.com/results?search_query=romanian+deadlift+RDL+proper+form+tutorial' },
                { keys: ['deadlift', 'דד-ליפט', 'דד ליפט'], url: 'https://www.youtube.com/watch?v=Y1IGeJEXpF4' }, // Alan Thrall - How to Deadlift
                { keys: ['goblet squat', 'גובלט סקוואט'], url: 'https://www.youtube.com/results?search_query=goblet+squat+proper+form+tutorial' },
                { keys: ['pistol squat', 'single leg squat'], url: 'https://www.youtube.com/results?search_query=pistol+squat+single+leg+squat+proper+form' },

                { keys: ['incline press', 'decline press', 'chest press', 'bench press', 'לחיצת חזה'], url: 'https://www.youtube.com/watch?v=BYKScL2sgCs' }, // Alan Thrall - How to Bench Press
                { keys: ['leg press', 'לחיצת רגליים'], url: 'https://www.youtube.com/results?search_query=leg+press+proper+form+tutorial' },

                { keys: ['lat pulldown', 'פולי עליון'], url: 'https://www.youtube.com/results?search_query=lat+pulldown+proper+form+tutorial' },

                { keys: ['pike push', 'overhead press', 'shoulder press', 'לחיצת כתף', 'לחיצת כתפיים'], url: 'https://www.youtube.com/watch?v=wol7Hko8RhY' }, // Alan Thrall - How to Overhead Press
                { keys: ['diamond push', 'tricep', 'skull', 'פשיטת מרפק'], url: 'https://www.youtube.com/results?search_query=tricep+extension+proper+form+tutorial' },

                { keys: ['bicep', 'curl', 'כפיפת מרפק'], url: 'https://www.youtube.com/results?search_query=bicep+curl+proper+form+tutorial' },
                { keys: ['plank', 'פלאנק'], url: 'https://www.youtube.com/results?search_query=plank+core+proper+form+tutorial' },
                { keys: ['hip thrust', 'glute bridge', 'hip extension', 'הרמות אגן', 'kick back'], url: 'https://www.youtube.com/watch?v=hCm-70-9_XE' }, // Bret Contreras - Hip Thrust Tutorial
                { keys: ['calf raise', 'עליות תאומים'], url: 'https://www.youtube.com/results?search_query=calf+raises+proper+form+tutorial' },
                { keys: ['leg curl', 'hamstring curl', 'כפיפת ברכיים'], url: 'https://www.youtube.com/results?search_query=leg+curl+hamstring+curl+proper+form+tutorial' },

                { keys: ['step-up', 'step up'], url: 'https://www.youtube.com/results?search_query=step+up+box+exercise+proper+form+tutorial' },
                { keys: ['cable fly', 'cable flys', 'פתיחות', 'fly', 'flies'], url: 'https://www.youtube.com/results?search_query=cable+fly+chest+proper+form+tutorial' },
                { keys: ['superman'], url: 'https://www.youtube.com/results?search_query=superman+exercise+lower+back+proper+form' },
                { keys: ['back extension', 'hyperextension', 'כיסא רומי', 'פשיטת גו'], url: 'https://www.youtube.com/results?search_query=back+extension+hyperextension+proper+form+tutorial' },
                { keys: ['shoulder tap', 'נגיעות כתף'], url: 'https://www.youtube.com/results?search_query=shoulder+tap+plank+proper+form+tutorial' },
                { keys: ['crunch', 'כפיפות בטן', 'sit-up', 'ab exercise'], url: 'https://www.youtube.com/results?search_query=crunches+ab+exercise+proper+form+tutorial' },
                { keys: ['lateral step', 'clamshell', 'adduction', 'miniband'], url: 'https://www.youtube.com/results?search_query=resistance+band+hip+exercise+proper+form+tutorial' },
                { keys: ['trx'], url: 'https://www.youtube.com/results?search_query=TRX+suspension+training+proper+form+tutorial' },
                { keys: ['door frame row', 'door frame rows', 'חתירה במסגרת הדלת', 'חתירה בדלת'], url: 'https://www.youtube.com/watch?v=r8NzhNe9Res' },
            ];
            for (const entry of map) {
                if (entry.keys.some(k => lower.includes(k.toLowerCase()))) return entry.url;
            }
            // Fallback: extract English name from parentheses or use full name
            const englishMatch = exerciseName.match(/\(([A-Za-z][^)]*)\)/);
            const searchTerm = englishMatch ? englishMatch[1] : exerciseName;
            return `https://www.youtube.com/results?search_query=${encodeURIComponent(searchTerm + ' proper form tutorial')}`;
        };

        // ── Shared AI plan helpers ─────────────────────────────────────────────
        const getTrainingSystemPrompt = () => {
            const trainerContext = localStorage.getItem('trainerContext') || '';
            const trainerContextSection = trainerContext
                ? `\n\nTRAINER'S PERSONAL METHODOLOGY AND DOCUMENTS (highest priority — follow these above all else):\n${trainerContext}`
                : '';
            return `You are an expert personal trainer and running coach certified by UESCA (United States Elite Coaches Association) with deep expertise in Jack Daniels' Running Formula. You create scientifically-backed, highly individualized workout plans.

=== PERIODIZATION PRINCIPLES (UESCA) ===
- Use HYBRID periodization for most athletes: 4-week mesocycles (weeks 1-3 increase load, week 4 is an unloading/recovery week).
- Use LINEAR periodization for beginners (one peak per year, steady progression from base to taper).
- Use BLOCK periodization for advanced/elite athletes (Accumulation → Transmutation → Realization blocks).
- "Least to Most Specific" rule: train aspects least specific to the goal race farthest from race day; train most race-specific physiology closest to race day.
  - Short events (5K): build endurance early, add intensity late.
  - Long events (marathon/ultra): build intensity early, maximize volume late (or for elite marathoners: volume early, intensity late).
- No more than 3 consecutive weeks of increasing volume unless volume is very low.
- Volume and intensity have an INVERSE relationship: on high-volume weeks, limit speedwork.
- NEVER increase volume to accommodate a race timeline. Readiness must dictate the goal event.
- The 10% weekly volume increase rule lacks scientific basis; base increases on the individual.
- Every hard training day must be followed by at least one recovery day.
- Always seek MAXIMUM benefit from MINIMUM stress — not maximum benefit from maximum stress.

=== TRAINING ZONES (FTHR-BASED) ===
FTHR = 95% of average HR during a 20-min all-out time trial (correlates to lactate threshold).
- Zone 1 (Recovery): Extremely easy active recovery.
- Zone 2 (Endurance/Easy): Base training, long runs; sub-lactate threshold; primary aerobic development.
- Zone 3 (Steady State): Slightly harder than Z2; lactate increases but clears; aerobic capacity adaptation.
- Zone 4 (Lactate Threshold/Tempo): Around LT; application: tempo runs.
- Zone 5 (VO2 Max/Intervals): Lactate accumulates faster than it clears; application: intervals/repeats.
- Zone 6 (Anaerobic Power): Above VO2 Max; short all-out sprints; not sustainable.

=== JACK DANIELS VDOT PACE ZONES ===

- Typical runner stores only 400–450g glycogen = 1,600–1,800 calories. Marathon costs ~3,000 calories.
- Glycogen depletion causes "the wall" typically at km 30–35.
- Post-workout glycogen replenishment window: 45 minutes after training (optimal absorption).
- Plan carbohydrate intake for all long runs and racing.

=== RECOVERY PRINCIPLES ===
- Overtraining progression: Acute Fatigue (1-2 days) → Functional Overreaching (1-2 weeks; may produce supercompensation) → Non-Functional Overreaching (weeks-months; fitness lost) → Overtraining Syndrome (months-years; career-threatening).
- REST = all energy expenditure, not just running. A 4-hour walking tour is not a rest day.
- The more total life stress (work, sleep deprivation, illness, heat/altitude), the more recovery required.
- Goal between sessions: "recovered enough" to perform the next workout at prescribed pace/distance without injury risk — not full physiological recovery.
- Marathon taper: 2-3 weeks. Body needs this to recover and optimize glycogen stores.
- Overreaching warning signs: underperformance, elevated resting HR, HRV changes, mood disturbances (depression, irritability, brain fog).
- Recovery week should be built into every mesocycle (4th week of each 4-week block in hybrid model).
- Think in HOURS, not days, for recovery: 5.5 hours between sessions is insufficient even if it's "two separate days."

=== PRACTICAL WEEKLY TRAINING TEMPLATES ===

Nachshon Shochat 4-run/week template (BC Running / בית דרור):
- Run 1: Slightly longer easy run. Start slow; on a good day, moderate acceleration in the last third. Fully aerobic the whole way.
- Run 2: Easy 40–60 min at full conversation pace. Finish with 4–5 strides of 80–100m (flat, with tailwind if possible; easy jog back).
- Run 3: Fartlek. After 20 min easy warm-up + 4 strides:
  - Week 1: 8–12 × (60 sec fast / 60 sec easy). Constant effort — don't start too fast.
  - Week 2: 6–8 × (3 min moderate-fast / 3 min easy).
  - Week 3: ladder — 2 min fast / 4 min fast / 6 min fast / 4 min fast / 2 min fast + 4 × 30 sec sprint / 60 sec jog.
- Run 4: Progression run. Go out easy; come back with gradual acceleration; run the last km fast.
- Every 4th week: replace Run 4 with a 5K test to measure progress.
- Golden rule: "Run your slow SLOWER to run your fast FASTER." Never race yourself every day. Always finish feeling you could run one more km or do 2 more reps.

"Run Less Run Faster" approach (3 key workouts/week, supplemented by cross-training):
- Prerequisite: athlete is already running at least 24 km/week.
- Key Workout 1 (INTERVALS): VO2max development. Warm-up: 10–15 min easy + dynamic stretches + 2×100m strides + 2×100m strides (first: heels-to-butt; second: high knees). Choose interval session from training table. Cooldown: 10–15 min easy.
- Key Workout 2 (TEMPO): LT improvement. Pace = 15–45 sec/km slower than 5K pace (around 10K pace); for marathon training = marathon race pace. Warm-up: 1.5–3 km easy. Sustain target pace 15–35 min (comfortably hard). Cooldown: ~10 min easy.
- Key Workout 3 (LONG RUN): For 5K–10K runners: 10–13 km. For HM/marathon runners: 16–24 km. Start slightly slower; pick up slightly in second half (negative split). Cooldown: ~10 min easy.
- Best predictor of future race performance = recent race result at the closest distance to goal event.
- Always train at CURRENT fitness level (not goal fitness). If all 3 key workouts in a week felt easy → upgrade pace by one level next week.
- Course specificity: train on terrain similar to race course (hills, surfaces) to accurately predict race performance.

=== RUNNING WARM-UP PROTOCOL (Ohio State / Ami Weiss) ===
Dynamic warm-up before every run session, especially before quality workouts and races. 10 reps each:
Head rotations both sides → shoulder rolls backward → arm circles backward → lateral arm swings → helicopter (arm swings + torso rotation) → hip circles both sides → windmill both sides → squats → walking forward lunges → Spiderman lunges (high lunge + upper-body rotation) → hurdle steps → toe touches every 3rd step → calf raises against wall → ankle rotations both sides → side leg swings against wall → front-back leg swings.
Cool-down: 5 min walk + static stretches (calves, hamstrings, quads, hip adductors, lower back/glutes, chest/shoulders, neck). 30 seconds each side.

=== STRENGTH TRAINING FOR RUNNERS ===
- Strength training does NOT add bulk if athlete is on a cardio program and eating normally; goal is neuromuscular efficiency.
- Priority areas: Calves/Soleus (stiffness improves stretch-shortening cycle; 16% increase in tendon stiffness = 4% VO2 reduction), Foot arch (barefoot plyometrics), Core/LPHC (planks, cable rows), Gluteals (glute max for propulsion; glute med for knee stability).
- Plyometrics improve running economy; require a solid strength base first; start with 1-2 exercises per session and progress gradually.
- Rep ranges: 3-11 reps → strength; 20-28 reps → muscular endurance/aerobic power; 10-15 reps → moderate both.
- For runners new to strength training: start with mid-range reps and low weight.
- Order: high neuroendocrine response exercises (squats, deadlifts) FIRST.
- Taper: stop lower-body resistance training 1-2 weeks before goal race.

Circuit-style strength+cardio training (בית דרור / Ami Weiss methodology):
- Highly effective for mixed fitness groups: alternate strength sets with short aerobic bouts (200m easy run or 20-sec sprint) between each set/exercise.
- Workout A structure (strength emphasis): Squat → 200m easy run → Push-ups → 200m easy run → Glute Bridge → 200m easy run → Plank (30 sec) → 200m easy run → Forward Lunge → 200m easy run. 3 sets.
- Workout B structure (power/speed emphasis): Squat → sprint 20 sec + walk back ×2 → Superman → sprint ×2 → Push-ups → sprint ×2 → Side Plank right → sprint ×2 → Side Plank left → sprint ×2. 3 sets; 45 sec rest between sets.
- Key exercises: Squat (deep, knees not past toes, back straight), Push-ups (elbows stay close to body; progress: knees → hands elevated → full → feet elevated), Glute Bridge (hold 3-5 sec or single-leg), Plank (body straight as a ruler; hips high; don't let them sag), Superman (lift chest and legs simultaneously), Side Plank (elbow under shoulder; progress: straight arm → add leg raise), Forward/Reverse Lunge (90° at both knees; back straight; gaze forward), TRX Row, TRX Chest Press.
- Quality over quantity — correct technique is always more important than reps or weight.
- Warm-up: 30 sec each of every exercise to be done in the main session.
- Cool-down: all major stretches 30 sec each side. Box breathing after intense sessions.

=== GENERAL PROGRAMMING RULES ===
- Every workout must have a clearly defined purpose.
- Training programs must be individualized; one-size-fits-all programs are inherently flawed.
- Consistency > isolated peaks. Rest IS training.
- Low-intensity base training is a prerequisite for high-intensity work to have a lasting effect.
- Cardiovascular adaptation is faster than musculoskeletal adaptation; volume/intensity must be progressed accordingly.
- Races during a training cycle count as quality sessions; reduce quality load on training days when racing regularly.
- A training program must be flexible and dynamic — modify based on ongoing athlete feedback.
- Focus on athlete WEAKNESSES furthest from race day; STRENGTHS closest to race day.${trainerContextSection}

                sseBuffer += decoder.decode(value, { stream: true });
                const lines = sseBuffer.split('\n');
                sseBuffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const jsonStr = line.slice(6).trim();
                    if (!jsonStr) continue;
                    try {
                        const parsed = JSON.parse(jsonStr);
                        if (parsed.type === 'content_block_delta' && parsed.delta?.type === 'text_delta') {
                            rawText += parsed.delta.text;
                        } else if (parsed.type === 'message_delta' && parsed.delta?.stop_reason) {
                            stopReason = parsed.delta.stop_reason;
                        }
                    } catch {}
                }
            }

            if (stopReason === 'max_tokens') {
                throw new Error('התוכנית גדולה מדי לעיבוד. נסה לפרק את השינוי לחלקים קטנים יותר.');
            }
            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('לא התקבלה תוכנית תקינה מה-AI');

            const plan = JSON.parse(jsonMatch[0]);

            if (plan.weeks && Array.isArray(plan.weeks)) {
                plan.weeks.forEach(week => {
                    if (week.workouts) {
                        week.workouts.forEach(workout => {
                            // Restore user progress that was stripped before sending
                            const key = `${week.weekNumber}|${workout.day}`;
                            if (workoutProgress[key]) {
                                const p = workoutProgress[key];
                                if (p.completed !== undefined) workout.completed = p.completed;
                                if (p.feedback !== undefined) workout.feedback = p.feedback;
                                if (p.difficulty !== undefined) workout.difficulty = p.difficulty;
                            }
                            if (workout.exercises) {
                                workout.exercises = workout.exercises.map(ex => ({
                                    ...ex,
                                    videoUrl: ex.videoUrl || getDefaultExerciseVideoUrl(ex.name)
                                }));
                                // Add warmup/cooldown blocks only if not already present (idempotent)
                                const hasWarmup = workout.exercises.some(ex => ex.name && ex.name.includes('חימום ומתיחות דינמיות'));
                                const hasCooldown = workout.exercises.some(ex => ex.name && ex.name.includes('מתיחות לשחרור'));
                                if (!hasWarmup) workout.exercises = [...getWarmupBlock(), ...workout.exercises];
                                if (!hasCooldown) workout.exercises = [...workout.exercises, ...getCooldownBlock()];
                            }
                        });
                    }
                });
            }

            return plan;
        };

        // Edit existing plan with Gemini — applies ONLY specific requested changes, keeps everything else intact
        const editPlanWithGemini = async (currentPlan, traineeData, changeRequest, apiKey) => {
            const trainerContext = localStorage.getItem('trainerContext') || '';
            const trainerContextSection = trainerContext
                ? `\n\nTRAINER'S PERSONAL METHODOLOGY (apply these principles when making changes):\n${trainerContext}`
                : '';

            const EDIT_SYSTEM_PROMPT = `You are an expert personal trainer. You receive an existing workout plan as JSON and a specific modification request. Your job is to apply ONLY the requested changes and return the complete modified plan.

Critical rules:
- Modify ONLY what is explicitly requested — nothing more
- Keep ALL other weeks, workouts, exercises, sets, reps, rest periods, notes, phases, and structure IDENTICAL to the input
- Do NOT reorganize, rename, or restructure anything that was not mentioned in the request
- All text must remain in Hebrew
- Return the complete plan (all weeks, all workouts) as valid JSON with exactly the same structure as the input — no markdown, no explanation outside the JSON${trainerContextSection}`;

            const originalInstructions = traineeData.customInstructions || '';
            const traineeSummary = [
                `Trainee: ${traineeData.name}`,
                traineeData.age ? `Age: ${traineeData.age}` : '',
                traineeData.activityLevel ? `Level: ${traineeData.activityLevel}` : '',
                (traineeData.goals||[]).length ? `Goals: ${traineeData.goals.join(', ')}` : '',
                originalInstructions ? `Original plan instructions: ${originalInstructions}` : ''
            ].filter(Boolean).join('\n');

            // Strip user-progress fields and auto-generated fields to reduce JSON size
            const workoutProgress = {};
            const strippedPlan = JSON.parse(JSON.stringify(currentPlan));
            strippedPlan.weeks?.forEach(week => {
                week.workouts?.forEach(workout => {
                    const key = `${week.weekNumber}|${workout.day}`;
                    workoutProgress[key] = {
                        completed: workout.completed,
                        feedback: workout.feedback,
                        difficulty: workout.difficulty
                    };
                    delete workout.completed;
                    delete workout.feedback;
                    delete workout.difficulty;
                    workout.exercises?.forEach(ex => { delete ex.videoUrl; });
                });
            });

            const userMessage = `${traineeSummary}\n\nExisting plan:\n${JSON.stringify(strippedPlan)}\n\nApply ONLY this change: ${changeRequest}\n\nReturn the complete modified plan as JSON only.`;

            const models = ['gemini-2.5-flash', 'gemini-2.5-flash-lite'];
            let rawText = '';
            let lastEditError = null;
            let gotResponse = false;

            for (const model of models) {
                for (let attempt = 0; attempt <= 1; attempt++) {
                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                system_instruction: { parts: [{ text: EDIT_SYSTEM_PROMPT }] },
                                contents: [{ role: 'user', parts: [{ text: userMessage }] }],
                                generationConfig: { maxOutputTokens: 65536, temperature: 0.7, responseMimeType: 'application/json' }
                            })
                        }
                    );

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        const errorMsg = err.error?.message || '';
                        const isQuotaError = response.status === 429 || errorMsg.toLowerCase().includes('quota') || errorMsg.toLowerCase().includes('resource_exhausted');
                        if (isQuotaError && attempt === 0) {
                            const delay = parseGeminiRetryDelay(errorMsg);
                            if (delay > 0) {
                                await new Promise(r => setTimeout(r, Math.min(delay, 30000)));
                                continue;
                            }
                        }
                        lastEditError = new Error(errorMsg || `שגיאת Gemini API: ${response.status}`);
                        break;
                    }

                    const data = await response.json();
                    rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    gotResponse = true;
                    break;
                }
                if (gotResponse) break;
            }

            if (!gotResponse) throw lastEditError || new Error('שגיאת Gemini API');
            if (!rawText) throw new Error('לא התקבלה תוכנית תקינה מ-Gemini');

            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('לא התקבלה תוכנית תקינה מ-Gemini');

            let plan;
            try {
                plan = JSON.parse(jsonMatch[0]);
            } catch (parseErr) {
                throw new Error('Gemini החזיר JSON לא תקין — נסה שוב');
            }

            if (plan.weeks && Array.isArray(plan.weeks)) {
                plan.weeks.forEach(week => {
                    if (week.workouts) {
                        week.workouts.forEach(workout => {
                            const key = `${week.weekNumber}|${workout.day}`;
                            if (workoutProgress[key]) {
                                const p = workoutProgress[key];
                                if (p.completed !== undefined) workout.completed = p.completed;
                                if (p.feedback !== undefined) workout.feedback = p.feedback;
                                if (p.difficulty !== undefined) workout.difficulty = p.difficulty;
                            }
                            if (workout.exercises) {
                                workout.exercises = workout.exercises.map(ex => ({
                                    ...ex,
                                    videoUrl: ex.videoUrl || getDefaultExerciseVideoUrl(ex.name)
                                }));
                                const hasWarmup = workout.exercises.some(ex => ex.name && ex.name.includes('חימום ומתיחות דינמיות'));
                                const hasCooldown = workout.exercises.some(ex => ex.name && ex.name.includes('מתיחות לשחרור'));
                                if (!hasWarmup) workout.exercises = [...getWarmupBlock(), ...workout.exercises];
                                if (!hasCooldown) workout.exercises = [...workout.exercises, ...getCooldownBlock()];
                            }
                        });
                    }
                });
            }

            return plan;
        };

        // Workout generation algorithm
        const generateWorkoutPlan = (userData) => {
            const { weight, height, age, gender, activityLevel, workoutDuration, goals, muscleGroups, cardioTarget, weeklyWorkouts } = userData;

            // Parse current continuous running ability from custom instructions BEFORE enrichedCardioTarget
            // e.g. "יכול לרוץ 4 דקות רצוף", "4 דקות רצוף מקסימום", "4 דקות ברציפות"
            const _instructionsText = userData._systemPrompt || userData.customInstructions || '';
            const _continuousRunMatch =
                _instructionsText.match(/(\d+(?:\.\d+)?)\s*דקות?\s*(?:רצוף|ברציפות|רצופות?)/i) ||
                _instructionsText.match(/מקסימום\s+(\d+(?:\.\d+)?)\s*דקות?/i);
            const customContinuousRunMinutes = _continuousRunMatch ? parseFloat(_continuousRunMatch[1]) : null;

            // --- Fix: merge top-level running fields into cardioTarget ---
            // (runningLevel, raceGoal etc. are stored as top-level formData fields, not inside cardioTarget)
            const enrichedCardioTarget = {
                ...cardioTarget,
                runningLevel: userData.runningLevel || cardioTarget.runningLevel || 'beginner',
                raceGoal:     userData.raceGoal     || cardioTarget.raceGoal     || 'general',
                weeklyMileage:userData.weeklyMileage || cardioTarget.weeklyMileage || '',
                current5kTime:    userData.current5kTime     || cardioTarget.current5kTime     || '',
                current10kTime:   userData.current10kTime    || cardioTarget.current10kTime    || '',
                currentHalfTime:  userData.currentHalfTime   || cardioTarget.currentHalfTime   || '',
                currentMarathonTime: userData.currentMarathonTime || cardioTarget.currentMarathonTime || '',
                injuryHistory: userData.injuryHistory || '',
                maxContinuousDistance: userData.maxContinuousDistance || '',
                customContinuousRunMinutes,
            };

            const isMuscleBuilding = goals.includes('עלייה במסת שריר');
            const hasAerobicGoal   = goals.includes('שיפור יכולת אירובית');

            // Parse system prompt for workout modifications
            const systemPromptText = (userData._systemPrompt || userData.customInstructions || '');
            const forcedCardioType =
                (systemPromptText.includes('ריצה') || systemPromptText.includes('run')) ? 'ריצה' :
                (systemPromptText.includes('אופניים') || systemPromptText.includes('bike') || systemPromptText.includes('cycling')) ? 'אופניים' :
                (systemPromptText.includes('שחייה') || systemPromptText.includes('swim')) ? 'שחייה' :
                (systemPromptText.includes('קפיצות חבל') || systemPromptText.includes('חבל')) ? 'קפיצות חבל' :
                (systemPromptText.includes('אליפטיקל') || systemPromptText.includes('elliptical')) ? 'אליפטיקל' :
                null;
            const intensityModifier =
                (systemPromptText.includes('הפחת עצימות') || systemPromptText.includes('קל יותר') || systemPromptText.includes('עצימות נמוכה')) ? 0.8 :
                (systemPromptText.includes('הגבר עצימות') || systemPromptText.includes('כבד יותר') || systemPromptText.includes('יותר קשה')) ? 1.2 :
                1.0;

            let duration, workoutsPerWeek;

            if (isMuscleBuilding) {
                duration = 4;
                workoutsPerWeek = parseInt(weeklyWorkouts) || 4;
            } else if (hasAerobicGoal) {
                // Plan length based on race goal (BC Running: gradual preparation)
                const rg = enrichedCardioTarget.raceGoal;
                if      (rg === 'marathon')      duration = 24;
                else if (rg === 'half-marathon') duration = 18;
                else if (rg === '10k')           duration = 16;
                else if (rg === '5k')            duration = 12;
                else                             duration = 12; // general fitness

                const defaultAerobicWorkouts = activityLevel === 'מתחיל' ? 3 : activityLevel === 'בינוני' ? 4 : 5;
                workoutsPerWeek = parseInt(weeklyWorkouts) || defaultAerobicWorkouts;
            } else {
                duration = goals.includes('ירידה במשקל') ? 6 : 4;
                const defaultGeneralWorkouts = activityLevel === 'מתחיל' ? 3 : activityLevel === 'בינוני' ? 4 : 5;
                workoutsPerWeek = parseInt(weeklyWorkouts) || defaultGeneralWorkouts;
            }

            // Override duration if user specified a custom number of weeks
            if (userData.planWeeks && parseInt(userData.planWeeks) > 0) {
                duration = parseInt(userData.planWeeks);
            } else if (systemPromptText) {
                // Parse weeks from free-text instructions.
                // Handles: "8 שבועות", "1 שבוע", "שבוע 1", "שבועות 6", "שבועיים"
                const weeksMatch =
                    systemPromptText.match(/(\d+)\s*(?:שבועות|שבוע)/) ||   // "4 שבועות" / "1 שבוע"
                    systemPromptText.match(/(?:שבועות|שבוע)\s+(\d+)/);      // "שבוע 1" / "שבועות 6"
                if (weeksMatch) {
                    duration = parseInt(weeksMatch[1]);
                } else if (systemPromptText.includes('שבועיים')) {
                    duration = 2; // "שבועיים" = 2 weeks
                }
            }

            // Parse workouts-per-week override from free-text instructions
            // Handles: "2 אימונים בשבוע", "3 פעמים בשבוע", "אימון 4 פעמים בשבוע"
            if (systemPromptText) {
                const wkMatch =
                    systemPromptText.match(/(\d+)\s*(?:אימונים?|פעמים?)\s*בשבוע/) ||
                    systemPromptText.match(/(?:אימונים?|פעמים?)\s*(\d+)\s*בשבוע/);
                if (wkMatch) workoutsPerWeek = parseInt(wkMatch[1]);
            }

            // Week offset for continuation plans: ensures the 4-week exercise rotation
            // continues seamlessly from where the previous plan ended.
            // e.g. if previous plan was 8 weeks, this plan starts at week 9 for rotation purposes.
            const continuationOffset = Math.max(0, (parseInt(userData.continuationFromWeek) || 1) - 1);

            // Running workout duration (by level — not the form's 60-min default)
            const getRunningDuration = (level, week, totalWeeks) => {
                const base = level === 'advanced' ? 50 : level === 'intermediate' ? 40 : 28;
                const phase = week / totalWeeks;
                if (phase >= 0.85) return Math.round(base * 0.85); // taper
                return Math.round(base * (1 + 0.22 * Math.min(phase / 0.75, 1))); // gradual build
            };

            // Training phase label (for periodization)
            const getPhase = (week, total) => {
                const p = week / total;
                if (p <= 0.30) return { name: 'בסיס', key: 'base' };
                if (p <= 0.65) return { name: 'בנייה', key: 'build' };
                if (p <= 0.85) return { name: 'שיא', key: 'peak' };
                return { name: 'טייפר', key: 'taper' };
            };

            const weeks = [];

            for (let week = 1; week <= duration; week++) {
                const phase = getPhase(week, duration);
                const weekLabel = hasAerobicGoal ? phase.name : `שבוע ${week}`;
                const weekPlan = { weekNumber: week, workouts: [], phase: weekLabel };
                const intensityMultiplier = 1 + (Math.floor((week - 1) / 2) * 0.1);
                const runningDuration = getRunningDuration(enrichedCardioTarget.runningLevel, week, duration);

                let runningSessionIdx = 0;
                for (let day = 1; day <= workoutsPerWeek; day++) {
                    let workout;

                    if (isMuscleBuilding) {
                        const sessionNum = (week - 1) * workoutsPerWeek + day;
                        const exercises = generateStrengthWorkout(goals, activityLevel, intensityMultiplier, muscleGroups, workoutDuration, userData.availableEquipment || [], week + continuationOffset, sessionNum, userData.strengthExperience || '', systemPromptText);
                        const exercisesWithWeights = addWeightRecommendations(exercises, userData, week);
                        workout = { day, type: 'כוח', exercises: exercisesWithWeights, completed: false, feedback: null, difficulty: null, phase: `שבוע ${week}` };

                    } else if (hasAerobicGoal) {
                        // Every session = run + strength at the end (no separate strength days)
                        const runningExercises = generateCardioWorkout(goals, activityLevel, intensityMultiplier, enrichedCardioTarget, week, runningDuration, duration, phase, runningSessionIdx++);
                        if (phase.key === 'taper') {
                            // Taper weeks: pure running, no strength
                            workout = { day, type: 'ריצה', exercises: runningExercises, completed: false, feedback: null, difficulty: null, phase: phase.name };
                        } else {
                            // All other weeks: running + runner strength appended
                            const strengthMins = workoutsPerWeek <= 3 ? '15' : '20';
                            const strengthExercises = generateRunnerStrengthWorkout(activityLevel, userData.availableEquipment || [], strengthMins);
                            workout = {
                                day, type: 'ריצה + חיזוק',
                                exercises: [
                                    ...runningExercises,
                                    { name: `━━━ חיזוק לרצים (${strengthMins} דקות) ━━━`, sets: 0, reps: '', rest: 0, notes: 'מעבר לתרגילי חיזוק' },
                                    ...strengthExercises
                                ],
                                completed: false, feedback: null, difficulty: null, phase: phase.name
                            };
                        }

                    } else {
                        const isGeneralHealth = goals.includes('שיפור בריאות כללית');
                        const sessionNum = (week - 1) * workoutsPerWeek + day;

                        if (isGeneralHealth) {
                            // Every workout = strength first + cardio at the end
                            const totalMin = parseInt(workoutDuration) || 60;
                            const strengthMin = Math.round(totalMin * 0.6).toString();
                            const cardioMin   = Math.round(totalMin * 0.4).toString();

                            const strengthExercises = generateStrengthWorkout(goals, activityLevel, intensityMultiplier * intensityModifier, muscleGroups, strengthMin, userData.availableEquipment || [], week, sessionNum, userData.strengthExperience || '', systemPromptText);
                            const exercisesWithWeights = addWeightRecommendations(strengthExercises, userData, week);

                            const cardioWorkoutType = forcedCardioType || 'אירובי';
                            const cardioExercises = generateCardioWorkout(goals, activityLevel, intensityMultiplier * intensityModifier, cardioTarget, week, cardioMin, 12, { name: 'בסיס', key: 'base' }, 0, forcedCardioType);

                            workout = {
                                day, type: 'כוח + אירובי',
                                exercises: [
                                    ...exercisesWithWeights,
                                    { name: `━━━ חלק אירובי (${cardioMin} דקות) ━━━`, sets: 0, reps: '', rest: 0, notes: 'מעבר לאימון אירובי' },
                                    ...cardioExercises
                                ],
                                completed: false, feedback: null, difficulty: null
                            };
                        } else {
                            // Weight loss / other goals: alternating strength / cardio days
                            if (day % 2 === 1) {
                                const exercises = generateStrengthWorkout(goals, activityLevel, intensityMultiplier * intensityModifier, muscleGroups, workoutDuration, userData.availableEquipment || [], week, sessionNum, userData.strengthExperience || '', systemPromptText);
                                const exercisesWithWeights = addWeightRecommendations(exercises, userData, week);
                                workout = { day, type: 'כוח', exercises: exercisesWithWeights, completed: false, feedback: null, difficulty: null };
                            } else {
                                const cardioWorkoutType = forcedCardioType || 'אירובי';
                                workout = { day, type: cardioWorkoutType, exercises: generateCardioWorkout(goals, activityLevel, intensityMultiplier * intensityModifier, cardioTarget, week, workoutDuration, 12, { name: 'בסיס', key: 'base' }, 0, forcedCardioType), completed: false, feedback: null, difficulty: null };
                            }
                        }
                    }

                    // Post-process all exercises: attach video URLs + apply intensity modifier
                    if (workout && workout.exercises) {
                        workout.exercises = workout.exercises.map(ex => {
                            let updated = ex;
                            // Attach default video URL for strength exercises
                            if (ex.sets > 0 && ex.videoUrl === undefined) {
                                updated = { ...updated, videoUrl: getDefaultExerciseVideoUrl(ex.name) };
                            }
                            // Apply intensity modifier from customInstructions ("הפחת/הגבר עצימות")
                            if (intensityModifier !== 1.0 && ex.sets > 0) {
                                const newSets = intensityModifier > 1.0
                                    ? ex.sets + 1
                                    : Math.max(2, ex.sets - 1);
                                const newRest = intensityModifier < 1.0
                                    ? Math.round((ex.rest || 90) * 1.2)
                                    : intensityModifier > 1.0
                                        ? Math.round((ex.rest || 90) * 0.85)
                                        : ex.rest;
                                updated = { ...updated, sets: newSets, rest: newRest };
                            }
                            return updated;
                        });
                        // Wrap every workout with warmup (10-15 min) and cooldown (10-15 min) sections
                        workout.exercises = [
                            ...getWarmupBlock(),
                            ...workout.exercises,
                            ...getCooldownBlock(),
                        ];
                    }
                    weekPlan.workouts.push(workout);
                }

                weeks.push(weekPlan);
            }

            return {
                duration,
                workoutsPerWeek,
                workoutDuration,
                weeks,
                createdAt: new Date().toISOString(),
                muscleGroups: muscleGroups || [],
                cardioTarget: enrichedCardioTarget,
                _debug: { goals, isMuscleBuilding, hasAerobicGoal, raceGoal: enrichedCardioTarget.raceGoal, runningLevel: enrichedCardioTarget.runningLevel }
            };
        };

        const generateStrengthWorkout = (goals, level, multiplier, muscleGroups = [], workoutDuration = 60, availableEquipment = [], weekNum = 1, sessionNum = 1, strengthExperience = '', customInstructions = '') => {
            let exercises = [];

            // Check if this is for a runner (aerobic goal)
            const isRunner = goals.includes('שיפור יכולת אירובית');

            if (isRunner) {
                // Runner-specific strength training - focus on injury prevention and running economy
                exercises = generateRunnerStrengthWorkout(level, availableEquipment, workoutDuration);
                return exercises;
            }

            // Strength training for muscle building
            const isMuscleBuilding = goals.includes('עלייה במסת שריר');

            if (isMuscleBuilding) {
                return generateMuscleBuildingWorkout(muscleGroups, level, workoutDuration, availableEquipment, sessionNum, strengthExperience, customInstructions, weekNum);
            }

            // Default general fitness workout
            return generateGeneralStrengthWorkout(level, workoutDuration, availableEquipment, customInstructions);
        };

        // Running Pace Table (McMillan-based, from uploaded pace table document)
        // Maps test time (2K/3K/4K) to training zones
        const runningPaceTable = [
            { test2k: '6:00',  test3k: '9:20',  test4k: '12:50', easy: '4:00-4:41', medium: '3:36-3:45', fast: '3:26-3:35', r400: '1:12-1:16' },
            { test2k: '6:30',  test3k: '10:06', test4k: '13:51', easy: '4:15-4:58', medium: '3:49-3:59', fast: '3:38-3:48', r400: '1:17-1:21' },
            { test2k: '7:00',  test3k: '10:53', test4k: '14:55', easy: '4:30-5:14', medium: '4:03-4:13', fast: '3:51-4:02', r400: '1:22-1:26' },
            { test2k: '7:30',  test3k: '11:40', test4k: '15:58', easy: '4:45-5:31', medium: '4:16-4:27', fast: '4:04-4:15', r400: '1:27-1:31' },
            { test2k: '8:00',  test3k: '12:26', test4k: '17:02', easy: '5:00-5:48', medium: '4:30-4:42', fast: '4:18-4:30', r400: '1:32-1:37' },
            { test2k: '8:30',  test3k: '13:12', test4k: '18:05', easy: '5:15-6:06', medium: '4:44-4:56', fast: '4:31-4:43', r400: '1:38-1:43' },
            { test2k: '9:00',  test3k: '13:59', test4k: '19:09', easy: '5:30-6:23', medium: '4:57-5:10', fast: '4:44-4:57', r400: '1:44-1:50' },
            { test2k: '9:30',  test3k: '14:45', test4k: '20:12', easy: '5:44-6:40', medium: '5:11-5:25', fast: '4:58-5:12', r400: '1:51-1:56' },
            { test2k: '10:00', test3k: '15:32', test4k: '21:16', easy: '5:59-6:57', medium: '5:25-5:40', fast: '5:12-5:27', r400: '1:57-2:03' },

        const getPaceFrom5K = (time5k) => {
            if (!time5k) return null;
            const clean = time5k.replace(/[^0-9:]/g, '');
            const parts = clean.split(':');
            if (parts.length !== 2) return null;
            const totalMin = parseFloat(parts[0]) + parseFloat(parts[1]) / 60;
            if (isNaN(totalMin) || totalMin <= 0) return null;
            const pacePerKm = totalMin / 5;
            const fmt = (m) => {
                const min = Math.floor(m);
                const sec = Math.round((m - min) * 60);
                return `${min}:${sec.toString().padStart(2, '0')}`;
            };
            return {
                easy:   `${fmt(pacePerKm + 1.25)}-${fmt(pacePerKm + 1.75)}`,

                fast:   `${fmt(pacePerKm - 0.08)}-${fmt(pacePerKm + 0.08)}`,
